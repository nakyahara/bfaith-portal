<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>B-Faith ABAキーワード — 設定</title>
  <style>
    body { font-family: "Segoe UI", "Hiragino Sans", sans-serif; max-width: 560px; margin: 32px auto; padding: 0 16px; color: #222; }
    h1 { font-size: 18px; }
    label { display: block; margin: 16px 0 4px; font-weight: 600; }
    input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
    button { margin-top: 16px; margin-right: 8px; padding: 8px 20px; border: none; border-radius: 6px; cursor: pointer; }
    #save { background: #1d6428; color: #fff; }
    #test { background: #0f4d7a; color: #fff; }
    #result { margin-top: 16px; padding: 10px; border-radius: 6px; display: none; white-space: pre-wrap; }
    .ok { background: #e8f5e9; color: #1d6428; }
    .ng { background: #fdecea; color: #b12704; }
    .hint { color: #777; font-size: 12px; margin-top: 4px; }
  </style>
</head>
<body>
  <h1>B-Faith ABAキーワード — 設定</h1>
  <label for="baseUrl">API ベースURL</label>
  <input id="baseUrl" type="text" placeholder="https://wh.bfaith-wh.uk">
  <div class="hint">通常は変更不要 (miniPC の warehouse サーバー)</div>

  <label for="token">APIトークン (ABA_EXT_TOKEN)</label>
  <input id="token" type="password" placeholder="miniPC の .env に設定した値">
  <div class="hint">管理者 (中原さん) から受け取ったトークンを貼り付け</div>

  <button id="save">保存</button>
  <button id="test">接続テスト</button>
  <div id="result"></div>
  <script src="options.js"></script>
</body>
</html>
