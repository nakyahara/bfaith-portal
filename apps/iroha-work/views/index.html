<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="いろは在庫化">
<title>いろは在庫化 作業画面</title>
<link rel="manifest" href="/apps/iroha-work/manifest.json">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" sizes="180x180" href="/app-icons/iroha-work-180.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
  :root{
    --ink:#26312B; --sub:#5C6B62; --faint:#8A968D;
    --ground:#F4F6F1; --surface:#FFFFFF; --line:#DFE5DC; --well:#EDF1EA;
    --accent:#3E8E5A; --accent-ink:#FFFFFF; --accent-soft:#E3F0E7;
    --amber:#C77D2B; --amber-soft:#F7ECDD;
    --danger:#C2453A; --danger-soft:#F8E6E3;
    --shadow:0 2px 10px rgba(38,49,43,.08);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{touch-action:manipulation}
  body{margin:0;background:var(--ground);color:var(--ink);
    font-family:"Noto Sans JP","Hiragino Sans",system-ui,sans-serif;font-size:16px;line-height:1.55}
  h1,h2,h3,button,.chip,.st{font-family:"Zen Maru Gothic","Noto Sans JP",sans-serif}
  .num{font-variant-numeric:tabular-nums}
  .app{max-width:900px;margin:0 auto;padding:12px 14px 40px}

  header.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
  header.top h1{font-size:1.25rem;font-weight:900;margin:0}
  .who{margin-left:auto;font-weight:700;background:var(--surface);border:1.5px solid var(--line);
    border-radius:999px;padding:8px 16px;cursor:pointer;font-family:"Zen Maru Gothic","Noto Sans JP",sans-serif;font-size:1rem}

  /* ── バナー (エラーは押すまで消えない) ── */
  .banner{display:none;width:100%;border-radius:12px;padding:12px 16px;font-weight:700;margin-bottom:10px;cursor:pointer}
  .banner.on{display:block}
  .banner.err{background:var(--danger-soft);color:var(--danger);border:1.5px solid var(--danger)}
  .banner.warn{background:var(--amber-soft);color:var(--amber);border:1.5px solid var(--amber)}
  .banner small{display:block;font-weight:400;font-size:.78rem;margin-top:2px}
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:var(--ground);
    border-radius:12px;padding:12px 22px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .25s;z-index:40;
    max-width:90vw;text-align:center}
  .toast.on{opacity:.96}

  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
  .flabel{font-size:.78rem;color:var(--sub);font-weight:700}
  .chip{border:1.5px solid var(--line);background:var(--surface);color:var(--sub);border-radius:999px;
    padding:9px 18px;font-weight:700;font-size:.95rem;cursor:pointer}
  .chip.on{background:var(--ink);border-color:var(--ink);color:var(--ground)}
  .search{flex:1;min-width:180px;border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;
    font-size:1rem;background:var(--surface);color:var(--ink)}
  .sync{font-size:.75rem;color:var(--faint);width:100%;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .sync button{border:1.5px solid var(--line);background:var(--surface);color:var(--sub);border-radius:8px;
    padding:4px 12px;font-size:.78rem;font-weight:700;cursor:pointer}

  /* ── リスト ── */
  .list{display:flex;flex-direction:column;gap:10px}
  .row{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);
    border-radius:16px;padding:10px 14px;box-shadow:var(--shadow);cursor:pointer}
  .row .thumb{width:64px;height:64px;border-radius:12px;background:#fff;border:1px solid var(--line);
    display:grid;place-items:center;font-size:1.6rem;flex:none;overflow:hidden}
  .row .thumb img{width:100%;height:100%;object-fit:contain}
  .row .bd{flex:1;min-width:0}
  .row h2{margin:0;font-size:1rem;font-weight:700;line-height:1.35}
  .row .meta{font-size:.82rem;color:var(--sub)}
  .row .meta b{color:var(--ink);font-size:1.1em}
  .row .meta2{font-size:.78rem;color:var(--faint);margin-top:2px}
  .tag{display:inline-block;font-size:.74rem;font-weight:700;border-radius:7px;padding:2px 9px;
    margin-right:6px;vertical-align:1px}
  .tag.urgent{background:var(--danger-soft);color:var(--danger)}
  .tag.new{background:var(--accent-soft);color:var(--accent)}
  .tag.miss{background:var(--amber-soft);color:var(--amber)}
  .st{flex:none;font-size:.82rem;font-weight:700;border-radius:9px;padding:6px 12px;cursor:pointer;border:none;
    font-family:"Zen Maru Gothic","Noto Sans JP",sans-serif}
  .st.todo{background:var(--well);color:var(--sub)}
  .st.doing{background:var(--amber-soft);color:var(--amber)}
  .st.done{background:var(--accent-soft);color:var(--accent)}
  .st.pause{background:var(--danger-soft);color:var(--danger)}
  .st.other{background:var(--well);color:var(--faint)}
  .row .chev{color:var(--faint);font-size:1.2rem;flex:none}
  .empty{padding:40px 10px;text-align:center;color:var(--faint)}

  /* ── 詳細 ── */
  .detail{display:none}
  body.detail-open .listpage{display:none}
  body.detail-open .detail{display:block}
  .backbar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .back{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;
    padding:10px 18px;font-size:1rem;font-weight:700;cursor:pointer}
  .backbar .st{margin-left:auto;font-size:.95rem;padding:8px 16px}
  .dcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);
    padding:18px;margin-bottom:14px}
  .dhead{display:flex;gap:16px}
  .dhead .thumb{width:132px;height:132px;border-radius:14px;background:#fff;border:1px solid var(--line);
    display:grid;place-items:center;font-size:3rem;flex:none;overflow:hidden}
  .dhead .thumb img{width:100%;height:100%;object-fit:contain}
  .dhead h2{margin:0 0 6px;font-size:1.3rem;font-weight:900;line-height:1.35}
  .dhead .meta{font-size:.88rem;color:var(--sub);word-break:break-all}
  .qty{font-size:1.05rem;margin-top:6px}
  .qty b{font-size:1.6em;font-family:"Zen Maru Gothic","Noto Sans JP",sans-serif}
  .bcode{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--well);border-radius:8px;
    padding:2px 8px;font-size:.95em}

  .kvs{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
  .kv{background:var(--well);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
  .kv label{display:block;font-size:.7rem;color:var(--sub);letter-spacing:.08em;margin-bottom:3px}
  .kv .v{font-weight:700}
  .kv.miss{border:1.5px dashed var(--amber);background:var(--amber-soft)}
  .kv.miss .v{color:var(--amber)}
  /* ── 作業時間 ── */
  /* ── 完成写真・動画 ── */
  .photos{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
  .ph{position:relative;width:96px;height:96px;border-radius:12px;border:1.5px solid var(--line);background:var(--well);
    display:grid;place-items:center;color:var(--sub);font-size:.72rem;text-align:center;line-height:1.35;cursor:pointer}
  .ph .ic{font-size:1.6rem;display:block}
  .ph.add{border-style:dashed;border-color:var(--accent);color:var(--accent);font-weight:700}
  .ph.mov{border-color:var(--amber)}
  .ph .del{position:absolute;top:-8px;right:-8px;width:26px;height:26px;border-radius:50%;border:none;
    background:var(--danger);color:#fff;font-weight:700;cursor:pointer;line-height:1}
  .ph .stx{font-size:.66rem;color:var(--faint)}
  .ph.err{border-color:var(--danger);color:var(--danger)}
  .wchips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .wchip{background:var(--amber-soft);color:var(--amber);border-radius:999px;padding:7px 16px;
    font-weight:700;font-size:.92rem}
  .wtimer{text-align:center;padding:4px 0 12px}
  .wtimer .t{font-size:3rem;font-weight:900;font-family:"Zen Maru Gothic","Noto Sans JP",sans-serif}
  .wtimer small{display:block;color:var(--sub);font-weight:700;letter-spacing:.12em;font-size:.72rem}
  .wbtns{display:flex;gap:12px;flex-wrap:wrap}
  .wbtns .btn{flex:1;min-width:180px;min-height:62px;font-size:1.1rem}
  .btn.warn{color:var(--amber);border-color:var(--amber)}
  .est{font-size:.82rem;color:var(--sub);margin-top:10px}
  h3.sec{font-size:.95rem;margin:0 0 10px;color:var(--sub);letter-spacing:.05em}
  .nlink{font-size:.82rem;color:var(--sub);margin:10px 0 0}
  .nlink a{color:var(--accent);font-weight:700}

  /* ── ダイアログ ── */
  .overlay{position:fixed;inset:0;background:rgba(20,26,22,.5);display:none;place-items:center;padding:16px;z-index:20}
  .overlay.on{display:grid}
  .modal{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);
    padding:20px;width:min(480px,100%)}
  .modal h3{margin:0 0 4px;font-size:1.1rem}
  .modal .mname{font-size:.88rem;color:var(--sub);margin-bottom:14px}
  .stbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
  .btn{min-height:58px;border-radius:14px;border:1.5px solid var(--line);
    background:var(--surface);color:var(--ink);font-size:1.02rem;font-weight:700;cursor:pointer;
    font-family:"Zen Maru Gothic","Noto Sans JP",sans-serif}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .btn.cur{outline:3px solid var(--accent);outline-offset:1px}
  .btn:disabled{opacity:.55}
  .mbtns{display:flex;gap:10px}
  .mbtns .btn{flex:1;min-height:52px}
  .msaving{font-size:.85rem;color:var(--sub);font-weight:700;min-height:1.4em;margin-bottom:8px}
  .hint{font-size:.78rem;color:var(--faint);margin-top:8px}

  /* ── 作業者選択 (だれがつかう?) ── */
  .gate{position:fixed;inset:0;background:var(--ground);z-index:30;display:none;overflow:auto;padding:24px 16px}
  .gate.on{display:block}
  .gate .gwrap{max-width:640px;margin:0 auto}
  .gate h2{font-size:1.2rem;font-weight:900}
  .gate .gsec{font-size:.85rem;color:var(--sub);font-weight:700;margin:18px 0 8px}
  .gate .names{display:flex;gap:10px;flex-wrap:wrap}
  .gate .name{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:16px 22px;
    font-size:1.1rem;font-weight:700;cursor:pointer;font-family:"Zen Maru Gothic","Noto Sans JP",sans-serif;color:var(--ink)}
  .gate .gnote{font-size:.8rem;color:var(--faint);margin-top:20px}
</style>
</head>
<body>
<div class="app">
  <!-- ══ 画面1: リスト ══ -->
  <div class="listpage">
    <header class="top">
      <h1>🎋 いろは在庫化</h1>
      <button class="who" id="whoBtn" onclick="openGate()">👤 —</button>
    </header>
    <div class="banner err" id="errBanner" onclick="this.classList.remove('on')"></div>
    <div class="banner warn" id="warnBanner" onclick="this.classList.remove('on')"></div>

    <div class="filters">
      <span class="flabel">Notionのステータス:</span>
      <span id="tabs"></span>
      <input class="search" id="q" placeholder="商品名・商品コードで検索">
      <span class="sync">
        <span id="syncTxt">読み込み中…</span>
        <button id="refreshBtn" onclick="forceRefresh()">🔄 いま更新</button>
      </span>
    </div>

    <div class="list" id="list"><div class="empty">読み込み中…</div></div>
  </div>

  <!-- ══ 画面2: 詳細 ══ -->
  <div class="detail">
    <div class="backbar">
      <button class="back" onclick="closeDetail()">‹ 一覧にもどる</button>
      <button class="st todo" id="dstate" onclick="openStFromDetail()">—</button>
    </div>
    <div id="dbody"></div>
  </div>

  <!-- ══ ステータス変更ダイアログ ══ -->
  <div class="overlay" id="stOv">
    <div class="modal">
      <h3>ステータスを変える</h3>
      <div class="mname" id="stName">—</div>
      <div class="msaving" id="stMsg"></div>
      <div class="stbtns" id="stBtns"></div>
      <div id="pinRow" style="display:none;margin-bottom:12px">
        <label style="font-size:.8rem;color:var(--sub);font-weight:700">職員PIN (棚入完了の変更に必要です)</label>
        <input id="pinIn" type="tel" inputmode="numeric" maxlength="8" placeholder="****" autocomplete="off"
          style="width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-size:1.3rem;
                 letter-spacing:.3em;background:var(--surface);color:var(--ink)">
      </div>
      <div class="mbtns"><button class="btn" id="stCancel" onclick="closeSt()">やめる</button></div>
      <p class="hint">ここで変えると、Notionのカードのステータスもそのまま変わります。<br>
        「棚入完了」への変更・取り消しは職員の方だけができます (職員PINが必要)。</p>
    </div>
  </div>

  <!-- ══ 作業者選択 ══ -->
  <div class="gate" id="gate">
    <div class="gwrap">
      <h2>👤 だれがつかいますか?</h2>
      <p style="color:var(--sub);font-size:.9rem">じぶんの名前をおしてください。ステータスを変えるときの記録に使います。</p>
      <div id="gateNames"></div>
      <p class="gnote">名前がないときは、職員の方が管理画面 (パソコン) から追加できます。</p>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
'use strict';
const BASE = '/apps/iroha-work';
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ステータス → 見た目クラス (未知のステータスは other で「すべて」にだけ出る)
const ST_CLASS = { '未着手':'todo', '作業中':'doing', '中断':'pause', '棚入完了':'done' };
const stClass = s => ST_CLASS[s] || 'other';

let state = { cards: [], statuses: [], workers: [], refresh: {}, me: {} };
let curTab = 'all';
let curDetail = null;      // 開いている詳細の page_id
let worker = null;         // { id, display_name, worker_type }
// タイマーはサーバー時刻基準 (iPadの時計を信じない)。/api/state の serverNow とのオフセットで補正
let clockOffset = 0;
const nowMs = () => Date.now() + clockOffset;

// ─── 通知まわり (Codex R2 ①: エラーは押すまで消えない・成功はトースト) ───
function showErr(msg, sub) {
  const b = $('#errBanner');
  b.innerHTML = esc(msg) + (sub ? '<small>' + esc(sub) + '</small>' : '');
  b.classList.add('on');
}
function showWarn(msg) { const b = $('#warnBanner'); b.textContent = msg; b.classList.add('on'); }
let toastTimer = null;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('on'), 2600);
}

// ─── 作業者選択 ───
function openGate() {
  const g = $('#gateNames');
  const members = state.workers.filter(w => w.worker_type === 'member');
  const staff = state.workers.filter(w => w.worker_type === 'staff');
  const chunk = (label, ws) => ws.length === 0 ? '' :
    '<div class="gsec">' + label + '</div><div class="names">' +
    ws.map(w => '<button class="name" onclick="pickWorker(' + w.id + ')">' + esc(w.display_name) + '</button>').join('') + '</div>';
  g.innerHTML = (chunk('作業する人', members) + chunk('職員', staff)) ||
    '<p style="color:var(--faint)">作業者がまだ登録されていません。職員の方が管理画面から追加してください。</p>';
  $('#gate').classList.add('on');
}
function pickWorker(id) {
  const w = state.workers.find(x => x.id === id);
  if (!w) return;
  worker = w;
  try { localStorage.setItem('iw_worker_id', String(id)); } catch (e) { /* プライベートモード等 */ }
  $('#whoBtn').textContent = '👤 ' + w.display_name + (w.worker_type === 'staff' ? ' (職員)' : '') + ' ▾';
  $('#gate').classList.remove('on');
}
function restoreWorker() {
  let id = null;
  try { id = Number(localStorage.getItem('iw_worker_id')); } catch (e) { /* 読めなければ選び直し */ }
  const w = state.workers.find(x => x.id === id);
  if (w) { worker = w; $('#whoBtn').textContent = '👤 ' + w.display_name + (w.worker_type === 'staff' ? ' (職員)' : '') + ' ▾'; }
  else if (!worker) openGate();
}

// ─── データ取得 ───
async function loadState() {
  let r, j;
  try {
    r = await fetch(BASE + '/api/state');
    j = await r.json();
  } catch (e) {
    showErr('サーバーに接続できませんでした', e.message);
    return;
  }
  if (!j.ok) { showErr(j.message || '読み込みに失敗しました'); return; }
  state = j;
  if (j.serverNow) clockOffset = Date.parse(j.serverNow) - Date.now();
  renderSync();
  renderTabs();
  renderList();
  restoreWorker();
  if (curDetail) {
    const c = state.cards.find(x => x.page_id === curDetail);
    if (c) renderDetail(c);
  }
}

function fmtTime(iso) {
  if (!iso) return '—';
  try { return new Date(iso).toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' }); } catch (e) { return '—'; }
}

function renderSync() {
  const rf = state.refresh || {};
  let txt = 'Notionと同期: ' + fmtTime(rf.lastRefreshAt) + ' ・ 🗂 カード' + state.cards.length + '枚 ・ ステータスの札をタップすると変えられます';
  $('#syncTxt').textContent = txt;
  if (rf.error) showErr('Notionから最新を取得できませんでした (前回取得分を表示しています)', rf.error);
  if (rf.truncated) showWarn('カードが件数上限を超えているため最新化できていません (前回取得分を表示中。職員の方は管理画面を確認してください)');
}

// ─── タブ・一覧 ───
function counts() {
  const c = { all: state.cards.length };
  for (const s of state.statuses) c[s] = 0;
  for (const card of state.cards) if (c[card.status] != null) c[card.status]++;
  return c;
}

function renderTabs() {
  const c = counts();
  const tabs = [['all', 'すべて'], ...state.statuses.map(s => [s, s])];
  $('#tabs').innerHTML = tabs.map(([key, label]) =>
    '<button class="chip' + (curTab === key ? ' on' : '') + '" onclick="pickTab(\'' + esc(key) + '\')">' +
    esc(label) + ' <span class="num">' + (c[key] ?? 0) + '</span></button>').join('');
}
function pickTab(key) { curTab = key; renderTabs(); renderList(); }

function masterSummary(c) {
  const m = c.master;
  const parts = [];
  if (m.material_code) parts.push('資材 ' + m.material_code);
  if (m.storage_container) parts.push(m.storage_container + (m.units_per_container != null ? 'に' + m.units_per_container + '個ずつ' : ''));
  else if (m.units_per_container != null) parts.push('入数 ' + m.units_per_container);
  return parts.join(' ・ ');
}

function rowTags(c) {
  let h = '';
  if (c.priority.kind === 'urgent') h += '<span class="tag urgent">🔥 急ぎ・' + esc(c.priority.label) + '</span>';
  if (c.priority.kind === 'new') h += '<span class="tag new">🌱 新商品</span>';
  if (c.master.missing.length > 0) h += '<span class="tag miss">⚠ ' + esc(c.master.missing.join('・')) + ' 未登録</span>';
  return h;
}

function visibleCards() {
  const q = $('#q').value.trim().toLowerCase();
  return state.cards.filter(c => {
    if (curTab !== 'all' && c.status !== curTab) return false;
    if (!q) return true;
    return String(c.title).toLowerCase().includes(q) || String(c.product_code || '').toLowerCase().includes(q);
  });
}

function thumbHtml(c) {
  if (c.image_url) return '<img src="' + esc(c.image_url) + '" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">';
  return '📦';
}

function renderList() {
  const cards = visibleCards();
  if (cards.length === 0) {
    $('#list').innerHTML = '<div class="empty">' + ($('#q').value ? '見つかりませんでした' : 'このステータスのカードはありません') + '</div>';
    return;
  }
  $('#list').innerHTML = cards.map(c => {
    const meta = [
      c.qty != null ? '<b>' + esc(c.qty) + '</b> 個' : null,
      c.arrival ? '入庫 ' + esc(c.arrival) : null,
      masterSummary(c) || null,
    ].filter(Boolean).join(' ・ ');
    const meta2 = [
      estText(c),

// ── 時間の表示 ──
function fmtDur(sec) {
  sec = Math.max(0, Math.floor(sec));
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  if (h > 0) return h + '時間' + m + '分';
  if (m > 0) return m + '分';
  return s + '秒';
}
function fmtClock(sec) {
  sec = Math.max(0, Math.floor(sec));
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  const mm = String(m).padStart(2, '0'), ss = String(s).padStart(2, '0');
  return h > 0 ? h + ':' + mm + ':' + ss : mm + ':' + ss;
}
// 目安と実測 (1回だけなら「平均」と言わず「前回」— Codex R2)
function estText(c) {
  if (!c.estimate) return '⏱ 実測データなし (今回の作業時間が次回の目安になります)';
  const e = c.estimate;
  if (e.cards === 1) return '⏱ 前回の実績 ' + fmtDur(e.lastSeconds);
  return '⏱ これまでの実績 平均' + fmtDur(e.avgSeconds) + ' (' + e.cards + '回)';
}

const KIND_ICON = { photo: '📷', video: '🎥' };
function mediaTile(m) {

function mediaCardHtml(c) {

    '</div></div>').join('');
  const addP = photos < 3 ? '<div class="ph add" onclick="pickMedia(\'photo\')"><div><span class="ic">📷</span>写真を<br>とる</div></div>' : '';
  const addV = videos < 1 ? '<div class="ph add mov" onclick="pickMedia(\'video\')"><div><span class="ic">🎥</span>動画を<br>とる</div></div>' : '';
  return '<div class="dcard"><h3 class="sec">できあがりの写真・動画</h3>' +

}

function openMedia(ev, id) {

// ── 撮影 → (写真は縮小) → アップロード。operation_id で再送しても二重登録されない ──
const pendingTiles = new Map();   // opId → { pageId, kind, blob, name, failed }
const newOpId = () => Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);

function pickMedia(kind) {
  if (!worker) { openGate(); return; }
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = kind === 'photo' ? 'image/*' : 'video/*';
  inp.capture = 'environment';
  inp.onchange = () => { if (inp.files && inp.files[0]) handlePicked(kind, inp.files[0]); };
  inp.click();
}

async function handlePicked(kind, file) {
  const pageId = curDetail;
  if (!pageId) return;
  let blob = file;
  if (kind === 'photo') {
    try { blob = await shrinkPhoto(file); }
    catch (e) { showErr('写真を読み込めませんでした', e.message); return; }
  } else if (file.size > 120 * 1024 * 1024) {
    showErr('動画が大きすぎます (120MBまで)。短めに撮り直してください');
    return;
  }
  const opId = newOpId();
  pendingTiles.set(opId, { pageId, kind, blob, failed: false });
  rerenderDetail();
  uploadMedia(opId);
}

// HEIC対策の本命: canvas で JPEG に変換 + 長辺1600pxへ縮小 (EXIFの位置情報もここで落ちる)
async function shrinkPhoto(file) {
  const bmp = await createImageBitmap(file).catch(async () => {
    const url = URL.createObjectURL(file);
    try {
      const img = new Image();
      await new Promise((ok2, ng) => { img.onload = ok2; img.onerror = () => ng(new Error('画像を開けません')); img.src = url; });
      return img;
    } finally { URL.revokeObjectURL(url); }
  });
  const w = bmp.width, h = bmp.height;
  const scale = Math.min(1, 1600 / Math.max(w, h));
  const cv = document.createElement('canvas');
  cv.width = Math.round(w * scale); cv.height = Math.round(h * scale);
  cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height);
  const blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', 0.85));
  if (!blob) throw new Error('JPEGに変換できませんでした');
  return blob;
}

async function uploadMedia(opId) {
  const p = pendingTiles.get(opId);
  if (!p || !worker) return;
  p.failed = false;
  rerenderDetail();
  const fd = new FormData();
  fd.append('page_id', p.pageId);
  fd.append('kind', p.kind);
  fd.append('worker_id', String(worker.id));
  fd.append('operation_id', opId);
  fd.append('file', p.blob, p.kind === 'photo' ? 'photo.jpg' : 'video.mp4');
  let j;
  try {
    const r = await fetch(BASE + '/api/media', { method: 'POST', body: fd });
    j = await r.json().catch(() => ({}));
  } catch (e) { j = { ok: false, message: '通信できませんでした (' + e.message + ')' }; }
  if (!j.ok) {
    if (j.error === 'cap_reached' || j.error === 'bad_file' || j.error === 'too_large') {
      pendingTiles.delete(opId);
      showErr(j.message || '送信できませんでした');
    } else {
      p.failed = true;   // 通信断など: blob を持ったまま「↻再送」を出す
      showErr((j.message || '送信できませんでした') + ' — タイルの「再送」でやり直せます');
    }
    rerenderDetail();
    return;
  }
  pendingTiles.delete(opId);
  const c = state.cards.find(x => x.page_id === p.pageId);
  if (c && !c.media.some(m => m.id === j.media.id)) c.media.push(j.media);
  rerenderDetail();
  toast(p.kind === 'photo' ? '写真を送りました (ドライブへ保存中)' : '動画を送りました (ドライブへ保存中)');
}

function retryUpload(ev, opId) { ev.stopPropagation(); uploadMedia(opId); }

// タイマーはサーバーの started_at との差分を表示するだけ (1秒ずつ足さない — iPadの時計・スリープに強い)
let tickId = null;
function startTimerTick(c) {
  clearInterval(tickId);
  const el = document.getElementById('wt');
  if (!el) return;
  const start = Date.parse(el.dataset.start);

async function startWork() {
  if (!worker) { openGate(); return; }
  if (!curDetail) return;
  const btn = document.getElementById('startBtn');
  if (btn) { btn.disabled = true; btn.textContent = '保存中…'; }
  let j;
  try {
    const r = await fetch(BASE + '/api/sessions/start', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ page_id: curDetail, worker_id: worker.id }),
    });
    j = await r.json().catch(() => ({}));
  } catch (e) { j = { ok: false, message: '通信できませんでした (' + e.message + ')' }; }
  if (!j.ok) {
    if (btn) { btn.disabled = false; btn.textContent = '▶ 作業をはじめる'; }
    showErr(j.message || '作業をはじめられませんでした');
    return;
  }
  if (j.serverNow) clockOffset = Date.parse(j.serverNow) - Date.now();
  const c = state.cards.find(x => x.page_id === curDetail);
  if (c) {
    if (j.status) c.status = j.status;
    if (!c.active.some(a => a.worker_id === worker.id)) {
      c.active.push({ id: j.sessionId, worker_id: worker.id, worker_name: worker.display_name, started_at: j.startedAt });
    }
    renderTabs(); renderList(); renderDetail(c);
  }
  toast(j.already ? '作業中にもどりました (開始済みでした)'
    : '作業をはじめました' + (j.status === '作業中' ? ' (Notionも「作業中」にしました)' : ''));
}

async function stopWork(reason) {
  if (!worker || !curDetail) return;
  const cNow = state.cards.find(x => x.page_id === curDetail);
  const mine = cNow ? myActiveOf(cNow) : null;
  if (!mine || !mine.id) { showErr('作業の記録が見つかりません。画面を更新します'); loadState(); return; }
  for (const id of ['pauseBtn', 'doneBtn']) { const b = document.getElementById(id); if (b) b.disabled = true; }
  let j;
  try {
    const r = await fetch(BASE + '/api/sessions/stop', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ page_id: curDetail, worker_id: worker.id, session_id: mine.id, reason }),
    });
    j = await r.json().catch(() => ({}));
  } catch (e) { j = { ok: false, message: '通信できませんでした (' + e.message + ')' }; }
  if (!j.ok) {
    for (const id of ['pauseBtn', 'doneBtn']) { const b = document.getElementById(id); if (b) b.disabled = false; }
    showErr(j.message || '終了できませんでした');
    return;
  }
  const pid = curDetail;
  const c = state.cards.find(x => x.page_id === pid);
  if (c) {
    c.active = c.active.filter(a => a.worker_id !== worker.id);
    renderList(); renderDetail(c);
  }
  // ⑤ステータスとの連動は自動にしない: 人が選んで変える。促すのは**全員が離れたとき**だけ
  //   (だれかが作業中のまま棚入完了を促すと、早まって完了にしてしまう — Codex PR2 #4)
  if (j.remainingActive > 0) {
    toast('作業時間 ' + fmtDur(j.session.raw_seconds) + ' を記録しました (' + j.remainingActive + '名がまだ作業中)');
    return;
  }
  toast('おつかれさまでした! 作業時間 ' + fmtDur(j.session.raw_seconds) + ' を記録しました');
  if (reason === 'pause') {
    openSt(null, pid);
    const m = document.getElementById('stMsg');
    if (m) m.textContent = 'みんな作業から離れました。つづきが後になるなら「中断」を選んでください';
  } else if (reason === 'done') {
    openSt(null, pid);
    const m = document.getElementById('stMsg');
    if (m) m.textContent = 'できあがりです! 棚に入れ終わったら「棚入完了」を (職員PINが必要です)';
  }
}

let stTarget = null;   // page_id
let stSaving = false;

function skipPhotoDone(to) {

function closeSt() { if (stSaving) return; $('#stOv').classList.remove('on'); stTarget = null; }
$('#stOv').addEventListener('click', e => { if (e.target === $('#stOv')) closeSt(); });

async function doSetSt(to) {
  if (stSaving || !stTarget || !worker) return;
  const c = state.cards.find(x => x.page_id === stTarget);
  if (!c) { closeSt(); return; }
  if (to === c.status) { closeSt(); return; }

  // 棚入完了が絡む変更は職員のみ (PIN で本人確認)。端末Cookie利用時だけ PIN を求める
  const gated = to === '棚入完了' || c.status === '棚入完了';
  if (gated && !state.me.session) {
    if (worker.worker_type !== 'staff') {
      $('#stMsg').textContent = '❌ 「棚入完了」の変更は職員のみです。右上の名前を職員に切り替えてください';
      return;
    }
    if (!$('#pinIn').value.trim()) {
      $('#pinRow').style.display = 'block';
      $('#stMsg').textContent = '職員PINを入れてから「' + to + '」を押してください';
      $('#pinIn').focus();
      return;
    }
  }

  stSaving = true;
  for (const b of document.querySelectorAll('#stBtns .btn, #stCancel')) b.disabled = true;
  $('#stMsg').textContent = '保存中… (Notionに反映しています)';
  let j = null;
  try {
    const r = await fetch(BASE + '/api/status', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ page_id: stTarget, to, expect: c.status, worker_id: worker.id,
        pin: $('#pinIn').value.trim() || undefined, skip_photo: stSkipPhoto || undefined }),
    });
    j = await r.json().catch(() => ({}));
  } catch (e) {
    j = { ok: false, error: 'network', message: '通信できませんでした (' + e.message + ')。もう一度お試しください' };
  }
  stSaving = false;
  stSkipPhoto = false;   // スキップは1回の送信だけに効かせる
  for (const b of document.querySelectorAll('#stBtns .btn, #stCancel')) b.disabled = false;

  if (j.ok) {
    c.status = j.status;
    renderTabs(); renderList();
    if (curDetail === c.page_id) renderDetail(c);
    $('#stOv').classList.remove('on'); stTarget = null;
    toast('「' + j.status + '」に変えました (Notionにも反映済み)');
    return;
  }
  if (j.error === 'conflict') {
    $('#stOv').classList.remove('on'); stTarget = null;
    showErr(j.message || 'Notion側で変更されています');
    if (j.current) { c.status = j.current; renderTabs(); renderList(); if (curDetail === c.page_id) renderDetail(c); }
    loadState();
    return;
  }
  if (j.error === 'card_gone') {
    $('#stOv').classList.remove('on'); stTarget = null;
    showErr(j.message || 'カードが見つかりません');
    closeDetail();
    loadState();
    return;
  }
  // 写真がまだ → 撮りにいくよう促す。職員判断で「写真なしで完了」もできる (履歴に残る)
  if (j.error === 'photo_required') {
    const m = $('#stMsg');
    m.innerHTML = '❌ ' + esc(j.message || 'できあがりの写真がありません') +
      ' <button class="reg" style="margin-top:6px" onclick="skipPhotoDone(\'' + esc(to) + '\')">写真なしで完了する (職員判断)</button>';
    return;
  }
  // PIN 関連はダイアログ内で入力し直せるようにする
  if (j.error === 'pin_required' || j.error === 'pin_invalid') {
    $('#pinRow').style.display = 'block';
    $('#pinIn').value = '';
    $('#stMsg').textContent = '❌ ' + (j.message || 'PINを確認してください');
    $('#pinIn').focus();
    return;
  }
  // staff_required / notion_error / verify_failed など: ダイアログを開いたまま理由を出す (やり直せる)
  $('#stMsg').textContent = '❌ ' + (j.message || '変更できませんでした');
}

// ─── 起動・巡回 ───
loadState();
setInterval(() => { if (!stSaving) loadState(); }, 60_000);
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeSt(); closeDetail(); } });
</script>
</body>
</html>
