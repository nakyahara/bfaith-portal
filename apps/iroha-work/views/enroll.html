<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="いろは在庫化">
  <title>端末登録 | いろは在庫化 作業アプリ</title>
  <link rel="manifest" href="/apps/iroha-work/manifest.json">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Saira+Semi+Condensed:wght@600;700&display=swap">
  <style>
    /* 作業画面と同じデザイン B (ライト・クリーンテック): 冷たい白 + 電気的な青 */
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; background: #F3F5F9; color: #0F1728;
      font-family: "BIZ UDPGothic", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif; }
    .wrap { min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .card { background: #fff; color: #0F1728; border: 1px solid #D9DEE8; border-radius: 8px; padding: 28px 24px; width: min(94vw, 460px);
      box-shadow: 0 1px 2px rgba(15,23,40,.06), 0 4px 14px rgba(15,23,40,.06); text-align: center; }
    .logo { font-family: "Saira Semi Condensed", sans-serif; font-weight: 700; letter-spacing: .12em; color: #1F5EFF; font-size: .95em; }
    h1 { font-size: 1.25em; margin: 4px 0 6px; }
    .lead { color: #5B6472; font-size: 0.95em; line-height: 1.7; margin: 0 0 20px; }
    .code-in { width: 100%; font-size: 2.4em; font-weight: 700; letter-spacing: 0.32em;
      text-align: center; padding: 14px 10px 14px 20px; border: 1px solid #D9DEE8; border-radius: 8px;
      font-family: "Saira Semi Condensed", ui-monospace, monospace; color: #0F1728; }
    .code-in:focus { outline: 2px solid #1F5EFF; outline-offset: -1px; }
    button.go { width: 100%; margin-top: 16px; padding: 16px; font-size: 1.15em; font-weight: 700;
      border: 0; border-radius: 8px; background: #1F5EFF; color: #fff; cursor: pointer; font-family: inherit; }
    button.go:disabled { background: #98A1B0; }
    .msg { margin-top: 14px; font-size: 0.95em; min-height: 1.5em; }
    .msg.err { color: #D63B3B; }
    .msg.ok { color: #0F9D6B; font-weight: 700; }
    .how { margin-top: 22px; padding-top: 18px; border-top: 1px solid #EEF1F7;
      font-size: 0.85em; color: #98A1B0; line-height: 1.8; text-align: left; }
    .how b { color: #5B6472; }
    .alt { margin-top: 14px; font-size: 0.85em; }
    .alt a { color: #98A1B0; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="logo">IROHA STOCK</div>
      <h1>この iPad を登録します</h1>
      <p class="lead">管理者から聞いた<b>6桁の登録コード</b>を入れてください。<br>
        一度登録すれば、次からはログインなしで使えます。</p>

      <input class="code-in" id="code" type="tel" inputmode="numeric" pattern="[0-9]*"
             maxlength="6" placeholder="------" autocomplete="one-time-code" autofocus>
      <button class="go" id="go" type="button" disabled>登録する</button>
      <div class="msg" id="msg"></div>

      <div class="how">
        <b>登録コードの出し方 (管理者の方へ)</b><br>
        パソコンで <b>いろは在庫化 作業アプリの管理画面</b> を開き、「📱 iPad の登録コードを発行」を押すと
        6桁の数字が出ます。<b>10分間だけ</b>有効で、1台につき1回使えます。
      </div>
      <div class="alt"><a href="/login">管理者としてログインする</a></div>
    </div>
  </div>

  <script>
    const BASE = '/apps/iroha-work';
    const $ = s => document.querySelector(s);
    const codeEl = $('#code'), goEl = $('#go'), msgEl = $('#msg');

    // この画面に来た = この端末は未登録 (または登録が切れた)。前の利用者の一覧・作業者・削除トークン・
    // 画面キャッシュを端末から消す。SW が /enroll へのリダイレクト結果を返す経路では作業画面の 401 処理を
    // 通らないので、ここでも消す (Codex 落ちない化 R2 #1)。登録成功時にももう一度
    async function clearLocalData() {
      for (const k of ['iw_state_snapshot', 'iw_worker_id', 'iw_media_tok']) { try { localStorage.removeItem(k); } catch (e) { /* 無視 */ } }
      try { if (window.caches) for (const k of await caches.keys()) if (k.startsWith('iroha-work-shell-')) await caches.delete(k); } catch (e) { /* 無視 */ }
      try { const reg = await navigator.serviceWorker?.getRegistration(BASE + '/'); reg?.active?.postMessage('clear-shell'); } catch (e) { /* 無視 */ }
    }
    clearLocalData();

    function setMsg(kind, text) { msgEl.className = 'msg' + (kind ? ' ' + kind : ''); msgEl.textContent = text; }

    codeEl.addEventListener('input', () => {
      const v = codeEl.value.replace(/\D/g, '').slice(0, 6);
      if (v !== codeEl.value) codeEl.value = v;
      goEl.disabled = v.length !== 6;
      setMsg(null, '');
      if (v.length === 6) submit();   // 6桁入ったら自動で送る (現場のタップを1回減らす)
    });
    codeEl.addEventListener('keydown', e => { if (e.key === 'Enter' && codeEl.value.length === 6) submit(); });
    goEl.addEventListener('click', submit);

    let sending = false;
    async function submit() {
      if (sending || codeEl.value.length !== 6) return;
      sending = true; goEl.disabled = true;
      setMsg(null, '登録しています…');
      try {
        const r = await fetch(BASE + '/enroll/redeem', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code: codeEl.value }),
        });
        const j = await r.json().catch(() => ({}));
        if (j.ok) {
          setMsg('ok', '✅ 「' + j.label + '」として登録しました。開いています…');
          await clearLocalData();   // 新しい登録で開く前に、前の端末データを確実に消す
          setTimeout(() => { location.href = BASE + '/'; }, 900);
          return;
        }
        setMsg('err', j.message || '登録できませんでした');
        codeEl.value = ''; codeEl.focus();
      } catch (e) {
        setMsg('err', '通信できませんでした (' + e.message + ')');
      } finally {
        sending = false; goEl.disabled = codeEl.value.length !== 6;
      }
    }
  </script>
</body>
</html>
