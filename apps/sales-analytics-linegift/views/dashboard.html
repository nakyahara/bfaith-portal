<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>LINEギフト 売上分析ダッシュボード v1.0</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    body { font-family: -apple-system, "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
           background: #f6f8fa; color: #24292e; margin: 0; padding: 16px; }
    h1 { font-size: 1.4em; margin: 0; display: flex; gap: 8px; align-items: center; }
    .topbar { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
    .topbar .back-link { color: #0969da; text-decoration: none; font-size: .9em; padding: 4px 8px; border-radius: 4px; }
    .topbar .back-link:hover { background: #ddf4ff; text-decoration: underline; }
    .topbar .build-info { margin-left: auto; font-size: .8em; color: #586069; }
    .build-btn { background: #06C755; color: #fff; border: 0; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-size: .9em; }
    .build-btn:hover { background: #058845; }
    .build-btn:disabled { background: #ccc; cursor: not-allowed; }

    .filters { background: #fff; padding: 12px; border-radius: 8px; display: flex; gap: 16px;
               flex-wrap: wrap; align-items: center; margin-bottom: 16px; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
    .filters label { font-size: .85em; color: #586069; }
    .filters select { padding: 4px 8px; font-size: .92em; border: 1px solid #d0d7de; border-radius: 4px; min-width: 120px; }
    .filters .reset { background: #6b7280; color: #fff; border: 0; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: .85em; }

    .kpi-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 16px; }
    .kpi-card { background: #fff; padding: 14px 16px; border-radius: 8px; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
    .kpi-card .label { color: #586069; font-size: .78em; margin-bottom: 4px; }
    .kpi-card .value { font-size: 1.4em; font-weight: 600; color: #24292e; }
    .kpi-card .sub { color: #586069; font-size: .72em; margin-top: 2px; }

    .row-2 { display: grid; grid-template-columns: 2fr 1fr; gap: 12px; margin-bottom: 16px; }
    .panel { background: #fff; padding: 14px; border-radius: 8px; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
    .panel h2 { font-size: .95em; margin: 0 0 10px; color: #24292e; }

    .chart-wrap { width: 100%; overflow-x: auto; position: relative; }
    svg.chart { width: 100%; max-width: 100%; height: 360px; display: block; }
    svg.chart .bar-sales  { fill: #06C755; }
    svg.chart .bar-profit { fill: #f59e0b; }
    svg.chart .line { stroke: #0969da; stroke-width: 2; fill: none; }
    svg.chart .dot { fill: #0969da; }
    svg.chart .axis { stroke: #d0d7de; }
    svg.chart text { font-size: 11px; fill: #586069; }
    svg.chart .hover-zone { fill: transparent; cursor: pointer; }
    svg.chart .hover-zone:hover { fill: rgba(9, 105, 218, .05); }
    svg.chart .hover-guide { stroke: #0969da; stroke-width: 1; stroke-dasharray: 3 3; pointer-events: none; opacity: 0; }
    svg.chart.hover-active .hover-guide.active { opacity: .5; }

    .chart-tooltip {
      position: absolute; pointer-events: none; opacity: 0;
      background: rgba(36, 41, 46, .95); color: #fff;
      padding: 8px 10px; border-radius: 6px; font-size: .8em; line-height: 1.5;
      box-shadow: 0 2px 8px rgba(0,0,0,.18);
      white-space: nowrap; z-index: 10;
      transition: opacity .12s ease-out;
    }
    .chart-tooltip.visible { opacity: 1; }
    .chart-tooltip .tt-month { font-weight: 600; margin-bottom: 4px; font-size: .9em; }
    .chart-tooltip .tt-row { display: flex; justify-content: space-between; gap: 16px; }
    .chart-tooltip .tt-row .lbl { color: #c0c8d0; }
    .chart-tooltip .tt-row .val { font-weight: 600; }
    .chart-tooltip .tt-row .sw { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }

    .top5 { display: flex; flex-direction: column; gap: 6px; }
    /* TOP5 横棒: bar-track が flex:1 で残り幅を取り、内側 bar が width:% で実際の比率 (2026-05-27 fix) */
    .top5-row { display: flex; align-items: center; gap: 8px; font-size: .85em; }
    .top5-row .name { width: 40%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .top5-row .bar-track { flex: 1; height: 14px; background: #f6f8fa; border-radius: 2px; overflow: hidden; }
    .top5-row .bar-track .bar { height: 100%; background: #f59e0b; border-radius: 2px; transition: width .2s; }
    .top5-row .val { color: #24292e; font-size: .85em; min-width: 70px; text-align: right; font-weight: 600; }

    table { width: 100%; border-collapse: collapse; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.06); font-size: .85em; }
    th, td { padding: 6px 10px; text-align: left; border-bottom: 1px solid #eaecef; }
    th { background: #f6f8fa; font-weight: 600; cursor: pointer; user-select: none; }
    th.sortable:hover { background: #eef2f6; }
    th.sorted-desc::after { content: ' ▼'; color: #06C755; }
    th.sorted-asc::after  { content: ' ▲'; color: #06C755; }
    td.num { text-align: right; }
    .bar-cell { display: inline-block; height: 10px; background: #06C755; border-radius: 2px; vertical-align: middle; margin-left: 4px; }
    .bar-cell.profit { background: #f59e0b; }
    .bar-cell.units  { background: #0969da; }
    .panel.scroll { max-height: 600px; overflow-y: auto; }
    .empty { color: #586069; padding: 24px; text-align: center; }
    .loading { color: #586069; font-style: italic; }
    .status-ok { color: #1a7f37; }
    .status-fail { color: #cf222e; }
    .status-running { color: #d29922; }
  </style>
</head>
<body>
  <div class="topbar">
    <a class="back-link" href="/">← ポータルに戻る</a>
    <h1>💚 LINEギフト 売上分析 v1.0</h1>
    <div class="build-info" id="build-info"></div>
    <button class="build-btn" id="build-btn">🔄 データ再集計</button>
  </div>

  <div class="filters">
    <label>期間モード:
      <select id="filter-mode">
        <option value="window" selected>ウィンドウ (直近 N 日)</option>
        <option value="month">月別</option>
        <option value="custom">カスタム期間</option>
      </select>
    </label>
    <label id="mode-window-wrap">期間:
      <select id="filter-window">
        <option value="7">過去 7 日</option>
        <option value="28">過去 28 日</option>
        <option value="90" selected>過去 90 日</option>
      </select>
    </label>
    <label id="mode-month-wrap" style="display:none;">月:
      <select id="filter-month"><option value="">読み込み中…</option></select>
    </label>
    <span id="mode-custom-wrap" style="display:none;">
      <label>開始: <input id="filter-from" type="date" /></label>
      <label>終了: <input id="filter-to" type="date" /></label>
    </span>
    <label>シーン:
      <select id="filter-season"><option value="">指定なし</option></select>
    </label>
    <button class="reset" id="reset-btn">フィルタ解除</button>
    <div id="as-of-info" style="margin-left:auto; font-size:.75em; color:#586069;"></div>
  </div>

  <div class="kpi-grid">
    <div class="kpi-card"><div class="label">売上 (税込)</div><div class="value" id="kpi-sales">-</div><div class="sub">期間集計</div></div>
    <div class="kpi-card"><div class="label">注文数</div><div class="value" id="kpi-orders">-</div></div>
    <div class="kpi-card"><div class="label">平均注文単価</div><div class="value" id="kpi-aov">-</div></div>
    <div class="kpi-card"><div class="label">粗利</div><div class="value" id="kpi-profit">-</div></div>
    <div class="kpi-card"><div class="label">粗利率</div><div class="value" id="kpi-rate">-</div></div>
  </div>

  <div class="row-2">
    <div class="panel">
      <h2>月別 売上 + 粗利 (過去 12 ヶ月)</h2>
      <div class="chart-wrap">
        <div id="monthly-chart"><div class="loading">読み込み中…</div></div>
        <div class="chart-tooltip" id="monthly-tooltip" role="tooltip"></div>
      </div>
    </div>
    <div class="panel">
      <h2>利益額 TOP 5 (現フィルタ)</h2>
      <div class="top5" id="top5-list"><div class="loading">読み込み中…</div></div>
    </div>
  </div>

  <div class="panel" style="margin-bottom: 16px;">
    <h2>価格帯別販売動向 (実売単価ベース、8 段階)</h2>
    <div id="price-band-table"><div class="loading">読み込み中…</div></div>
  </div>

  <div class="panel scroll">
    <h2>商品ランキング (Top 500)</h2>
    <div id="ranking-table"><div class="loading">読み込み中…</div></div>
  </div>

<script>
const QS = () => new URLSearchParams(location.search);
function setQS(k, v) {
  const p = QS();
  if (v == null || v === '') p.delete(k); else p.set(k, v);
  history.replaceState(null, '', location.pathname + (p.toString() ? '?' + p.toString() : ''));
}

function fmtJpy(n) {
  if (n == null) return '-';
  const v = Number(n);
  if (v >= 100_000_000) return '¥' + (v / 100_000_000).toFixed(2) + '億';
  if (v >= 10_000)      return '¥' + Math.round(v / 10_000).toLocaleString('ja-JP') + '万';
  return '¥' + Math.round(v).toLocaleString('ja-JP');
}
function fmtPct(n) { return (Number(n) * 100).toFixed(1) + '%'; }
function fmtInt(n) { return n == null ? '-' : Number(n).toLocaleString('ja-JP'); }

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

async function fetchJson(url, opts) {
  const res = await fetch(url, opts);
  const body = await res.json().catch(() => ({ ok: false, error: 'invalid json' }));
  if (!body.ok) throw new Error(body.error || `HTTP ${res.status}`);
  return body.result;
}

const state = {
  mode: QS().get('mode') || 'window', // 'window' | 'month' | 'custom'
  window: Number(QS().get('window')) || 90,
  month: QS().get('month') || '',
  from: QS().get('from') || '',
  to: QS().get('to') || '',
  season: QS().get('season') || '',
  sort: QS().get('sort') || 'sales',
};

function syncFiltersFromState() {
  document.getElementById('filter-mode').value = state.mode;
  document.getElementById('filter-window').value = String(state.window);
  document.getElementById('filter-month').value = state.month;
  document.getElementById('filter-from').value = state.from;
  document.getElementById('filter-to').value = state.to;
  document.getElementById('filter-season').value = state.season;
  document.getElementById('mode-window-wrap').style.display = state.mode === 'window' ? '' : 'none';
  document.getElementById('mode-month-wrap').style.display  = state.mode === 'month'  ? '' : 'none';
  document.getElementById('mode-custom-wrap').style.display = state.mode === 'custom' ? '' : 'none';
  // シーン絞り込みは window モードでのみ意味を持つ (シーン期間集計が経路として別、
  // 月別/カスタム期間と組み合わせるとサイレント無視されるため UI で disable: Codex Round 1 medium)
  const seasonSel = document.getElementById('filter-season');
  seasonSel.disabled = state.mode !== 'window';
  seasonSel.title = state.mode === 'window' ? '' : 'シーン絞り込みは「ウィンドウ」モードでのみ利用可能です';
}

// 現フィルタ状態から API 共通 query を生成 (sku-ranking/kpi/price-band 共用)
function buildPeriodQS() {
  const qs = new URLSearchParams();
  if (state.mode === 'month' && state.month) {
    qs.set('mode', 'month'); qs.set('month', state.month);
  } else if (state.mode === 'custom' && state.from && state.to) {
    qs.set('mode', 'custom'); qs.set('from', state.from); qs.set('to', state.to);
  } else {
    qs.set('window', String(state.window));
  }
  return qs;
}

// 現フィルタが API 呼び出し可能か (custom で日付未入力など)
function periodReady() {
  if (state.mode === 'month')  return Boolean(state.month);
  if (state.mode === 'custom') return Boolean(state.from && state.to && state.from <= state.to);
  return true;
}

async function loadKpi() {
  const ids = { sales: 'kpi-sales', orders: 'kpi-orders', aov: 'kpi-aov', profit: 'kpi-profit', rate: 'kpi-rate' };
  try {
    const r = await fetchJson(`/apps/sales-analytics-linegift/api/dashboard/kpi-summary?${buildPeriodQS().toString()}`);
    if (!r) {
      Object.values(ids).forEach((id) => document.getElementById(id).textContent = '(データなし)');
      document.getElementById('as-of-info').textContent = '';
      return;
    }
    document.getElementById('kpi-sales').textContent = fmtJpy(r.total_sales_jpy_incl);
    document.getElementById('kpi-orders').textContent = fmtInt(r.total_orders);
    document.getElementById('kpi-aov').textContent = fmtJpy(r.avg_order_value_jpy_incl);
    document.getElementById('kpi-profit').textContent = fmtJpy(r.total_gross_profit_jpy_incl);
    document.getElementById('kpi-rate').textContent = fmtPct(r.gross_margin_rate);
    document.getElementById('as-of-info').textContent = `as_of: ${escapeHtml(r.as_of_date_jst)} / 集計: ${escapeHtml(r.synced_at)}`;
  } catch (e) {
    Object.values(ids).forEach((id) => document.getElementById(id).textContent = 'エラー');
    console.error(e);
  }
}

// 「キリの良い」値を返す (Y軸目盛り用、5分割になる単位を選ぶ)
function niceTickMax(value) {
  if (value <= 0) return 1;
  const exp = Math.floor(Math.log10(value));
  const f = value / Math.pow(10, exp);
  let nice;
  if (f <= 1)        nice = 1;
  else if (f <= 2)   nice = 2;
  else if (f <= 2.5) nice = 2.5;
  else if (f <= 5)   nice = 5;
  else               nice = 10;
  return nice * Math.pow(10, exp);
}

async function loadMonthly() {
  const wrap = document.getElementById('monthly-chart');
  try {
    const rows = await fetchJson('/apps/sales-analytics-linegift/api/dashboard/monthly-trend');
    if (!rows || rows.length === 0) { wrap.innerHTML = '<div class="empty">月次データなし</div>'; return; }
    // 2026-05-27 中原さん指摘: 売上/粗利は同一スケール (同じ左軸)、粗利率を右軸 % で表示する
    const rawMaxAmount = Math.max(
      ...rows.map((r) => Number(r.sales_jpy_incl) || 0),
      ...rows.map((r) => Number(r.gross_profit_jpy_incl) || 0),
      1,
    );
    const rawMaxRate = Math.max(...rows.map((r) => Number(r.gross_margin_rate) || 0), 0.01);
    const maxAmount = niceTickMax(rawMaxAmount);
    // 粗利率は % スケール、最大値の 1.2 倍を上限に切り上げ (上に余白を確保)
    const maxRatePct = Math.max(5, Math.ceil(rawMaxRate * 100 * 1.2 / 5) * 5);
    const W = Math.max(rows.length * 90, 540);
    const H = 360;
    const padL = 78, padR = 78, padB = 40, padT = 36;
    const innerW = W - padL - padR;
    const innerH = H - padT - padB;
    // 月幅を半分に分けて棒を 2 本横並びにする
    const slotW = innerW / rows.length;
    const bw = slotW * 0.34;
    let svg = `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">`;

    // Y軸グリッド + 目盛り (5分割)
    const yTicks = 5;
    for (let i = 0; i <= yTicks; i++) {
      const y = padT + innerH * (1 - i / yTicks);
      svg += `<line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}" stroke="#eaecef" stroke-width="1" />`;
      // 左軸ラベル (金額: 売上+粗利 共通スケール)
      const amountVal = maxAmount * i / yTicks;
      svg += `<text x="${padL - 6}" y="${y + 4}" text-anchor="end" fill="#586069">${fmtJpy(amountVal)}</text>`;
      // 右軸ラベル (粗利率 %)
      const ratePct = maxRatePct * i / yTicks;
      svg += `<text x="${W - padR + 6}" y="${y + 4}" text-anchor="start" fill="#0969da">${ratePct.toFixed(0)}%</text>`;
    }

    // X軸線
    svg += `<line class="axis" x1="${padL}" y1="${H - padB}" x2="${W - padR}" y2="${H - padB}" stroke-width="1.5" />`;

    // 棒 (売上=緑 / 粗利=橙) を月ごとに横並びで描画
    rows.forEach((r, i) => {
      const slotX = padL + i * slotW;
      const center = slotX + slotW / 2;
      const xSales  = center - bw - 1;
      const xProfit = center + 1;
      const hSales  = innerH * ((Number(r.sales_jpy_incl) || 0) / maxAmount);
      const hProfit = innerH * ((Number(r.gross_profit_jpy_incl) || 0) / maxAmount);
      const ySales  = H - padB - hSales;
      const yProfit = H - padB - hProfit;
      svg += `<rect class="bar-sales"  x="${xSales}"  y="${ySales}"  width="${bw}" height="${hSales}" />`;
      svg += `<rect class="bar-profit" x="${xProfit}" y="${yProfit}" width="${bw}" height="${hProfit}" />`;
      // X軸 月ラベル
      svg += `<text x="${center}" y="${H - padB + 18}" text-anchor="middle">${escapeHtml(r.year_month)}</text>`;
    });

    // 折線 (粗利率) + 点 (右軸 % スケール)
    // ratio はプロット領域内にクランプ (赤字月 / 想定外の高粗利率で SVG 外にはみ出すのを防ぐ、Codex Round 1 medium)
    let pathD = '';
    rows.forEach((r, i) => {
      const slotX = padL + i * slotW;
      const x = slotX + slotW / 2;
      const ratePct = (Number(r.gross_margin_rate) || 0) * 100;
      const ratio = Math.min(1, Math.max(0, ratePct / maxRatePct));
      const y = H - padB - innerH * ratio;
      pathD += (i === 0 ? 'M' : 'L') + x + ' ' + y + ' ';
      svg += `<circle class="dot" cx="${x}" cy="${y}" r="4" />`;
    });
    svg += `<path class="line" d="${pathD.trim()}" />`;

    // 月別ホバーゾーン + 縦ガイド線 (透明矩形にカーソルを置くとカスタムツールチップを表示、2026-05-27)
    rows.forEach((r, i) => {
      const slotX = padL + i * slotW;
      const center = slotX + slotW / 2;
      svg += `<line class="hover-guide" data-idx="${i}" x1="${center}" y1="${padT}" x2="${center}" y2="${H - padB}" />`;
      svg += `<rect class="hover-zone" data-idx="${i}" x="${slotX}" y="${padT}" width="${slotW}" height="${innerH}" />`;
    });

    // 凡例 (上部)
    svg += `<rect x="${padL}"        y="${padT - 22}" width="12" height="12" fill="#06C755" />`;
    svg += `<text x="${padL + 16}"   y="${padT - 12}" fill="#06C755">売上 (左軸)</text>`;
    svg += `<rect x="${padL + 110}"  y="${padT - 22}" width="12" height="12" fill="#f59e0b" />`;
    svg += `<text x="${padL + 126}"  y="${padT - 12}" fill="#f59e0b">粗利 (左軸)</text>`;
    svg += `<line x1="${padL + 220}" y1="${padT - 16}" x2="${padL + 242}" y2="${padT - 16}" stroke="#0969da" stroke-width="2" />`;
    svg += `<circle cx="${padL + 231}" cy="${padT - 16}" r="4" fill="#0969da" />`;
    svg += `<text x="${padL + 248}"  y="${padT - 12}" fill="#0969da">粗利率 (右軸 %)</text>`;

    svg += '</svg>';
    wrap.innerHTML = svg;
    bindMonthlyTooltip(wrap.querySelector('svg.chart'), rows);
  } catch (e) {
    wrap.innerHTML = `<div class="empty">読込失敗: ${escapeHtml(e.message)}</div>`;
  }
}

// 月別グラフのホバー → カスタムツールチップ。SVG ネイティブの <title> は表示遅延が大きいため自作
function bindMonthlyTooltip(svgEl, rows) {
  if (!svgEl) return;
  const tooltip = document.getElementById('monthly-tooltip');
  // ツールチップの absolute 配置基準と座標計算基準を一致させる (Codex Round 1 high)
  // tooltip は .chart-wrap (position: relative) 直下、SVG は #monthly-chart の子なので親の親
  const wrap = tooltip ? tooltip.parentElement : null;
  if (!tooltip || !wrap) return;
  const zones = svgEl.querySelectorAll('.hover-zone');
  const guides = svgEl.querySelectorAll('.hover-guide');

  function showFor(idx, clientX, clientY) {
    const r = rows[idx];
    if (!r) return;
    tooltip.innerHTML = `
      <div class="tt-month">${escapeHtml(r.year_month)}</div>
      <div class="tt-row"><span class="lbl"><span class="sw" style="background:#06C755"></span>売上</span><span class="val">${fmtJpy(r.sales_jpy_incl)}</span></div>
      <div class="tt-row"><span class="lbl"><span class="sw" style="background:#f59e0b"></span>粗利</span><span class="val">${fmtJpy(r.gross_profit_jpy_incl)}</span></div>
      <div class="tt-row"><span class="lbl"><span class="sw" style="background:#0969da"></span>粗利率</span><span class="val">${fmtPct(r.gross_margin_rate)}</span></div>
      <div class="tt-row"><span class="lbl">注文数</span><span class="val">${fmtInt(r.orders)}</span></div>`;
    // 表示位置: chart-wrap 基準でマウス座標から少しオフセット
    const rect = wrap.getBoundingClientRect();
    const offsetX = clientX - rect.left + wrap.scrollLeft;
    const offsetY = clientY - rect.top + wrap.scrollTop;
    tooltip.classList.add('visible');
    // 一旦左に置いてサイズ確定 → 右端はみ出し時のみ左反転
    tooltip.style.left = (offsetX + 12) + 'px';
    tooltip.style.top  = (offsetY - 12) + 'px';
    const tw = tooltip.offsetWidth, th = tooltip.offsetHeight;
    if (offsetX + 12 + tw > rect.width)  tooltip.style.left = Math.max(0, offsetX - tw - 12) + 'px';
    if (offsetY - 12 - th < 0)           tooltip.style.top  = (offsetY + 18) + 'px';
    // ガイド線 active 切替
    svgEl.classList.add('hover-active');
    guides.forEach((g) => g.classList.toggle('active', Number(g.dataset.idx) === idx));
  }
  function hide() {
    tooltip.classList.remove('visible');
    svgEl.classList.remove('hover-active');
    guides.forEach((g) => g.classList.remove('active'));
  }

  zones.forEach((z) => {
    const idx = Number(z.dataset.idx);
    z.addEventListener('mouseenter', (ev) => showFor(idx, ev.clientX, ev.clientY));
    z.addEventListener('mousemove',  (ev) => showFor(idx, ev.clientX, ev.clientY));
    z.addEventListener('mouseleave', hide);
  });
}

async function loadTop5() {
  const wrap = document.getElementById('top5-list');
  try {
    const qs = buildPeriodQS();
    qs.set('sort', 'profit'); qs.set('limit', '5');
    if (state.season) qs.set('season_code', state.season);
    const rows = await fetchJson('/apps/sales-analytics-linegift/api/dashboard/sku-ranking?' + qs.toString());
    if (!rows || rows.length === 0) { wrap.innerHTML = '<div class="empty">データなし</div>'; return; }
    const max = Math.max(...rows.map((r) => Number(r.gross_profit_jpy_incl) || 0), 1);
    // 「粗利」ランキングであることを凡例で明示 (TOP5 が何の指標か分かりにくい問題への対応、2026-05-27 中原さん指摘)
    let html = '<div style="font-size:.78em; color:#586069; margin-bottom:6px;">並び順: 💰 粗利額 (現フィルタの上位 5 件)</div>';
    html += rows.map((r) => {
      const pct = (Number(r.gross_profit_jpy_incl) || 0) / max * 100;
      const label = r.product_name || r.sku_code;
      const titleAttr = `${label}\n粗利: ${fmtJpy(r.gross_profit_jpy_incl)}\n売上: ${fmtJpy(r.sales_amount_jpy_incl)}\n件数: ${fmtInt(r.units)}\n粗利率: ${fmtPct(r.gross_margin_rate)}`;
      return `<div class="top5-row" title="${escapeHtml(titleAttr)}">
        <div class="name" title="${escapeHtml(label)}">${escapeHtml(label)}</div>
        <div class="bar-track"><div class="bar" style="width:${pct.toFixed(1)}%"></div></div>
        <div class="val">💰 ${fmtJpy(r.gross_profit_jpy_incl)}</div>
      </div>`;
    }).join('');
    wrap.innerHTML = html;
  } catch (e) {
    wrap.innerHTML = `<div class="empty">読込失敗: ${escapeHtml(e.message)}</div>`;
  }
}

async function loadPriceBand() {
  const wrap = document.getElementById('price-band-table');
  try {
    const rows = await fetchJson(`/apps/sales-analytics-linegift/api/dashboard/price-band-summary?${buildPeriodQS().toString()}`);
    if (!rows || rows.length === 0) { wrap.innerHTML = '<div class="empty">データなし</div>'; return; }
    // 2026-05-27 中原さん指摘: 右端の単一バーが何を示すか不明だった → 件数/売上/粗利 列内に色分けバーを inline 表示
    const maxOrders = Math.max(...rows.map((r) => Number(r.orders_count) || 0), 1);
    const maxSales  = Math.max(...rows.map((r) => Number(r.sales_jpy_incl) || 0), 1);
    const maxProfit = Math.max(...rows.map((r) => Number(r.gross_profit_jpy_incl) || 0), 1);
    wrap.innerHTML = `<table>
      <thead><tr>
        <th>価格帯</th>
        <th class="num">SKU 数</th>
        <th class="num"><span style="color:#0969da">■</span> 件数 (件)</th>
        <th class="num"><span style="color:#06C755">■</span> 売上 (円)</th>
        <th class="num"><span style="color:#f59e0b">■</span> 粗利 (円)</th>
        <th class="num">粗利率 (%)</th>
      </tr></thead>
      <tbody>${rows.map((r) => {
        const oBar = (Number(r.orders_count) || 0) / maxOrders * 60;
        const sBar = (Number(r.sales_jpy_incl) || 0) / maxSales * 60;
        const pBar = (Number(r.gross_profit_jpy_incl) || 0) / maxProfit * 60;
        return `<tr>
          <td>${escapeHtml(r.band_label)}</td>
          <td class="num">${fmtInt(r.sku_count)}</td>
          <td class="num">${fmtInt(r.orders_count)} <span class="bar-cell units" style="width:${oBar.toFixed(0)}px"></span></td>
          <td class="num">${fmtJpy(r.sales_jpy_incl)} <span class="bar-cell" style="width:${sBar.toFixed(0)}px"></span></td>
          <td class="num">${fmtJpy(r.gross_profit_jpy_incl)} <span class="bar-cell profit" style="width:${pBar.toFixed(0)}px"></span></td>
          <td class="num">${fmtPct(r.gross_margin_rate)}</td>
        </tr>`;
      }).join('')}</tbody>
    </table>`;
  } catch (e) {
    wrap.innerHTML = `<div class="empty">読込失敗: ${escapeHtml(e.message)}</div>`;
  }
}

async function loadRanking() {
  const wrap = document.getElementById('ranking-table');
  try {
    const qs = buildPeriodQS();
    qs.set('sort', state.sort); qs.set('limit', '500');
    if (state.season) qs.set('season_code', state.season);
    const rows = await fetchJson('/apps/sales-analytics-linegift/api/dashboard/sku-ranking?' + qs.toString());
    if (!rows || rows.length === 0) { wrap.innerHTML = '<div class="empty">データなし</div>'; return; }
    const maxSales  = Math.max(...rows.map((r) => Number(r.sales_amount_jpy_incl) || 0), 1);
    const maxUnits  = Math.max(...rows.map((r) => Number(r.units) || 0), 1);
    const maxProfit = Math.max(...rows.map((r) => Number(r.gross_profit_jpy_incl) || 0), 1);
    const headers = [
      { id: 'rank',  label: '#', sortable: false, num: true },
      { id: 'name',  label: '商品', sortable: false },
      { id: 'price', label: '単価 (円)', sortable: false, num: true },
      { id: 'sales', label: '売上 (円)', sortable: true,  num: true },
      { id: 'units', label: '件数 (件)', sortable: true,  num: true },
      { id: 'profit',label: '粗利 (円)', sortable: true,  num: true },
      { id: 'gm',    label: '粗利率 (%)', sortable: false, num: true },
    ];
    wrap.innerHTML = `<table>
      <thead><tr>${headers.map((h) => {
        let cls = '';
        if (h.sortable) {
          cls = 'sortable';
          if (state.sort === h.id) cls += ' sorted-desc';
        }
        return `<th class="${cls}${h.num ? ' num' : ''}" data-sort="${h.id}">${escapeHtml(h.label)}</th>`;
      }).join('')}</tr></thead>
      <tbody>${rows.map((r, i) => {
        const sBar = (Number(r.sales_amount_jpy_incl) || 0) / maxSales * 60;
        const uBar = (Number(r.units) || 0) / maxUnits * 60;
        const pBar = (Number(r.gross_profit_jpy_incl) || 0) / maxProfit * 60;
        const name = r.product_name || r.sku_code;
        return `<tr>
          <td class="num">${i + 1}</td>
          <td title="${escapeHtml(r.sku_code)}">${escapeHtml(name)}</td>
          <td class="num">${fmtJpy(r.unit_price_jpy_incl_display)}</td>
          <td class="num">${fmtJpy(r.sales_amount_jpy_incl)} <span class="bar-cell" style="width:${sBar.toFixed(0)}px"></span></td>
          <td class="num">${fmtInt(r.units)} <span class="bar-cell units" style="width:${uBar.toFixed(0)}px"></span></td>
          <td class="num">${fmtJpy(r.gross_profit_jpy_incl)} <span class="bar-cell profit" style="width:${pBar.toFixed(0)}px"></span></td>
          <td class="num">${fmtPct(r.gross_margin_rate)}</td>
        </tr>`;
      }).join('')}</tbody>
    </table>`;
    wrap.querySelectorAll('th.sortable').forEach((th) => {
      th.addEventListener('click', () => {
        state.sort = th.dataset.sort;
        setQS('sort', state.sort);
        loadRanking();
        loadTop5();
      });
    });
  } catch (e) {
    wrap.innerHTML = `<div class="empty">読込失敗: ${escapeHtml(e.message)}</div>`;
  }
}

async function loadMonths() {
  try {
    const months = await fetchJson('/apps/sales-analytics-linegift/api/dashboard/available-months');
    const sel = document.getElementById('filter-month');
    const cur = state.month;
    if (!months || months.length === 0) {
      sel.innerHTML = '<option value="">(データなし)</option>';
      return;
    }
    // 既定: state.month 指定が無ければ最新月をセット
    if (!cur) state.month = months[0];
    sel.innerHTML = months.map((m) => `<option value="${escapeHtml(m)}">${escapeHtml(m)}</option>`).join('');
    sel.value = state.month;
  } catch (e) {
    document.getElementById('filter-month').innerHTML = `<option value="">読込失敗</option>`;
  }
}

async function loadSeasons() {
  try {
    const seasons = await fetchJson('/apps/sales-analytics-linegift/api/dashboard/seasons');
    const ss = document.getElementById('filter-season');
    ss.innerHTML = '<option value="">指定なし</option>' + seasons.map((s) =>
      `<option value="${escapeHtml(s.season_code)}">${escapeHtml(s.season_name)} (${escapeHtml(s.latest_start || '-')} 〜 ${escapeHtml(s.latest_end || '-')})</option>`
    ).join('');
    syncFiltersFromState();
  } catch (e) {
    console.error('seasons load failed:', e);
  }
}

async function loadBuildStatus() {
  try {
    const r = await fetchJson('/apps/sales-analytics-linegift/api/build-status');
    const cur = r?.current;
    const info = document.getElementById('build-info');
    if (!cur) { info.textContent = 'build 未実行'; return; }
    const cls = cur.status === 'COMPLETED' ? 'status-ok' : (cur.status === 'FAILED' ? 'status-fail' : 'status-running');
    info.innerHTML = `<span class="${cls}">最終 build: ${escapeHtml(cur.status)}</span> @ ${escapeHtml(cur.heartbeat_at)}`;
  } catch (e) { /* swallow */ }
}

function clearPanelsForPendingPeriod() {
  // custom 期間が未確定のうちは既存値が残ると条件不整合に見えるため、
  // KPI/グラフ/表すべてプレースホルダ表示にクリア (Codex Round 1 medium)
  const placeholder = '<div class="empty">期間を確定してください</div>';
  ['kpi-sales','kpi-orders','kpi-aov','kpi-profit','kpi-rate'].forEach((id) => {
    document.getElementById(id).textContent = '-';
  });
  document.getElementById('top5-list').innerHTML       = placeholder;
  document.getElementById('price-band-table').innerHTML = placeholder;
  document.getElementById('ranking-table').innerHTML    = placeholder;
}

function refreshAll() {
  if (!periodReady()) {
    document.getElementById('as-of-info').textContent = '期間を入力してください (開始 ≤ 終了)';
    clearPanelsForPendingPeriod();
    // 月別トレンドは期間モードに依存しないので継続表示
    loadMonthly();
    return;
  }
  loadKpi();
  loadMonthly();
  loadTop5();
  loadPriceBand();
  loadRanking();
  loadBuildStatus();
}

document.getElementById('filter-mode').addEventListener('change', (ev) => {
  state.mode = ev.target.value; setQS('mode', state.mode === 'window' ? '' : state.mode);
  // window 以外に切替時はシーン絞り込みを解除 (黙って無視されるのを防ぐ、Codex Round 1)
  if (state.mode !== 'window' && state.season) { state.season = ''; setQS('season', ''); }
  syncFiltersFromState(); refreshAll();
});
document.getElementById('filter-window').addEventListener('change', (ev) => {
  state.window = Number(ev.target.value); setQS('window', state.window); refreshAll();
});
document.getElementById('filter-month').addEventListener('change', (ev) => {
  state.month = ev.target.value; setQS('month', state.month); refreshAll();
});
document.getElementById('filter-from').addEventListener('change', (ev) => {
  state.from = ev.target.value; setQS('from', state.from); refreshAll();
});
document.getElementById('filter-to').addEventListener('change', (ev) => {
  state.to = ev.target.value; setQS('to', state.to); refreshAll();
});
document.getElementById('filter-season').addEventListener('change', (ev) => {
  state.season = ev.target.value; setQS('season', state.season); refreshAll();
});
document.getElementById('reset-btn').addEventListener('click', () => {
  state.mode = 'window'; state.window = 90;
  state.month = ''; state.from = ''; state.to = '';
  state.season = ''; state.sort = 'sales';
  history.replaceState(null, '', location.pathname);
  syncFiltersFromState();
  refreshAll();
});
document.getElementById('build-btn').addEventListener('click', async (ev) => {
  const btn = ev.target;
  btn.disabled = true; btn.textContent = '⏳ 起動中…';
  try {
    await fetchJson('/apps/sales-analytics-linegift/api/build-trigger', { method: 'POST', headers: { 'Content-Type': 'application/json' } });
    btn.textContent = '✓ 起動完了';
    setTimeout(() => { btn.textContent = '🔄 データ再集計'; btn.disabled = false; }, 3000);
    setTimeout(() => loadBuildStatus(), 1500);
  } catch (e) {
    btn.textContent = `失敗: ${e.message}`;
    setTimeout(() => { btn.textContent = '🔄 データ再集計'; btn.disabled = false; }, 5000);
  }
});

// 起動時: 月一覧 + シーン一覧を並行ロード → state を整えてから一括 refresh
Promise.all([loadMonths(), loadSeasons()]).then(() => {
  syncFiltersFromState();
  refreshAll();
});
</script>
