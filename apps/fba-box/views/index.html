<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="FBA箱詰め">
  <title>FBA箱詰め記録</title>
  <link rel="manifest" href="/apps/fba-box/manifest.json">
  <link rel="icon" type="image/png" href="/app-icons/fba-box-192.png">
  <!-- iPhone / iPad のホーム画面はこれを見る。無いとページの見た目がそのまま切り取られ、
       ほかの倉庫アプリと見分けがつかない (中原さん 2026-09-01 の指摘と同じ) -->
  <link rel="apple-touch-icon" sizes="180x180" href="/app-icons/fba-box-180.png">
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; background: #F4F5F7; color: #2B2B2B;
      font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
      /* 横には動かさない。行がはみ出さないよう直したうえで、指のはずみで滑るのも止める */
      overscroll-behavior-x: none; }
    /* ⭐iOS のダブルタップ拡大を止める (中原さん 2026-09-10「＋ と − を素早く 2 回押すと画面が拡大する」)。
       拡大されると横にも動かせてしまうので、「右左に滑る」もこれで止まる。
       touch-action: manipulation = タップとスクロールは今までどおり、ダブルタップ拡大だけ外す。
       画面全体ではなく**押すところ**に付ける (本文はピンチで拡大できるまま = 小さい字を読む人の逃げ道を塞がない) */
    button, .row, .tab, .chip, .boxbtn, .selbtn, .stepbtn, .bigbtn, label, input, select { touch-action: manipulation; }
    button { font-family: inherit; }
    .hidden { display: none !important; }

    /* ─ 上部バー ─ */
    /* 🚨 上部バー・送信中の帯・箱バーは **1 つの塊で** 貼り付ける。
       別々に貼って .boxbar { top: 52px } のように固定値でずらすと、
       ①上部バーが折り返して高くなったとき ②「送信中…」の帯が出入りするとき
       に箱バーが上部バーの裏へ潜り、いまの箱や箱の切替ボタンが押せなくなる
       (Codex PR #1298 R1。固定値は元からあった作りで、狭い画面ではさらにずれていた) */
    .stickyhead { position: sticky; top: 0; z-index: 30; }
    .topbar { background: #B5651D; color: #fff;
      padding: 10px 12px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .topbar .title { font-weight: 700; font-size: 1.05em; }
    .topbar .sp { flex: 1; }
    .chip { background: rgba(255,255,255,0.16); border-radius: 999px; padding: 6px 14px;
      font-size: 0.95em; border: 0; color: #fff; cursor: pointer; }
    .chip.warn { background: #E03131; }
    .netbar { background: #E03131; color: #fff; text-align: center; padding: 10px; font-weight: 700; }
    .savebar { background: #F59F00; color: #fff; text-align: center; padding: 6px; font-size: 0.9em; }

    /* ─ 現在の箱 ─
       🚨 横スクロールするのは**箱の一覧だけ** (#boxbtns)。バー全体をスクロールにすると、箱が増えたとき
       「＋ 新しい箱」が右へ流れていき、何度もスワイプしないと押せなくなる (中原さん 2026-09-18) */
    .boxbar { background: #fff; border-bottom: 2px solid #E9ECEF;
      padding: 10px 12px; display: flex; align-items: center; gap: 10px; overflow: hidden; }
    /* 🚨 「いまの箱」は縮む (flex: 0 1 auto + min-width: 0)。縮まないと、箱コードや資材名が長いとき
       (例「大型2プラン2-12 (特大強化段ボ… / 100個)」) にバーからあふれ、overflow:hidden のせいで
       「＋ 新しい箱」が画面の外に隠れて押せなくなる (Codex PR #1359 R1)。あふれるときは箱コードの
       うしろ (サイズ・個数) から「…」で落ちる — 箱コードは頭にあるので残る */
    .curbox { background: #FFF4E6; border: 2px solid #E8890C; border-radius: 14px; padding: 8px 16px;
      font-weight: 800; font-size: 1.25em; color: #B5651D; white-space: nowrap;
      flex: 0 1 auto; min-width: 0; max-width: 52%; overflow: hidden; }
    .curbox small { display: block; font-size: 0.55em; font-weight: 600; color: #A0742E;
      overflow: hidden; text-overflow: ellipsis; }
    #curbox-code { display: block; overflow: hidden; text-overflow: ellipsis; }
    /* 推定の行だけは折り返す — 「(重量不明 N点を除く)」を「…」で落とすと、kg だけ見えて
       「まだ入る」と誤解させる (要件 §7 / Codex PR #1359 R2) */
    #curbox-est { white-space: normal; overflow: visible; text-overflow: clip; line-height: 1.35; }
    /* flex-basis を 0 に (auto だと「箱の一覧の中身の幅」を主張して、
       狭い画面で「いまの箱」を潰してしまう)。一覧は余った幅をもらって、その中で横スクロールする */
    #boxbtns { flex: 1 1 0; min-width: 0; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    #btn-newbox { flex: 0 0 auto; }   /* いつも右端に出しておく (押せなくならないように) */
    .boxbtn { border: 2px solid #DEE2E6; background: #fff; border-radius: 12px; padding: 8px 14px;
      font-size: 1em; font-weight: 700; color: #495057; cursor: pointer; white-space: nowrap; }
    .boxbtn.closed { background: #F1F3F5; color: #ADB5BD; }
    /* 箱ダイアログの「どのサイズの箱か」 */
    .boxmat { background: #FFF4E6; color: #B5651D; border-radius: 10px; padding: 8px 12px;
      font-weight: 800; font-size: 1.05em; margin: 6px 0 4px; }
    .boxmat.none { background: #F1F3F5; color: #868E96; font-weight: 700; font-size: 0.95em; }
    .boxbtn.newbox { border-style: dashed; color: #B5651D; border-color: #E8890C; }

    /* ─ 番号で探す ─ 商品が 60 を超えるとスクロールが大変 (いろは 2026-09-23)。
       利用者さんが言った「商品番号」(通常_22 の 22) を入れると、その商品だけが出る。
       🚨 文字は 16px 以上 — それより小さいと iPhone が入力のたびに画面を拡大する */
    .findbar { background: #fff; border-bottom: 2px solid #E9ECEF; padding: 6px 12px;
      display: flex; align-items: center; gap: 8px; }
    .findbar label { font-weight: 800; color: #B5651D; white-space: nowrap; }
    #find { flex: 1 1 auto; min-width: 0; font-size: 1.3em; font-weight: 800; padding: 8px 12px;
      border: 2px solid #DEE2E6; border-radius: 12px; letter-spacing: 0.05em; }
    #find:focus { outline: none; border-color: #E8890C; }
    /* 端末の標準の「×」は隠す (右の「× 消す」と 2 つ並んで紛らわしい) */
    #find::-webkit-search-cancel-button { -webkit-appearance: none; display: none; }
    #find-x { flex: none; border: 0; background: #E9ECEF; color: #495057; border-radius: 10px;
      padding: 10px 14px; font-size: 1em; font-weight: 800; cursor: pointer; }
    .findn { flex: none; font-size: 0.9em; color: #868E96; white-space: nowrap; }
    .findmiss { padding: 18px 14px; color: #868E96; text-align: center; line-height: 1.8; }
    .findmiss button { margin: 4px; }

    /* ─ 商品の画面: どの箱に何個 (中原さん 2026-09-23: 商品 → 箱の順で、複数の箱に分けて入れる) ─ */
    .splitrow { display: flex; align-items: center; gap: 8px; padding: 8px; margin-bottom: 6px;
      border: 2px solid #DEE2E6; border-radius: 12px; background: #fff; }
    .splitrow.on { border-color: #E8890C; background: #FFF4E6; }
    .splitrow .sb { flex: 1 1 auto; min-width: 0; cursor: pointer; line-height: 1.35; }
    .splitrow .sb b { font-size: 1.15em; color: #B5651D; }
    .splitrow .sb small { color: #868E96; }
    .splitrow .sbest { font-size: 0.8em; }
    .splitrow .stepbtn { width: 58px; height: 58px; font-size: 1.7em; }
    .splitrow .qtyin { width: 84px; flex: none; font-size: 1.6em; padding: 8px 4px; }
    .splitsum { margin: 6px 0 2px; font-size: 1.05em; font-weight: 700; color: #495057; }
    /* 「入れた」の帯: ダイアログの下に貼り付く。.dlg の padding (18px) の分だけ外へ広げて、下の余白まで白で覆う
       (覆わないと、スクロールした中身が帯の下の隙間から透けて見える) */
    .addbar { position: sticky; bottom: -18px; z-index: 2; margin: 12px -18px -18px; padding: 8px 18px 16px;
      background: #fff; border-top: 1px solid #E9ECEF; box-shadow: 0 -6px 14px rgba(0,0,0,0.08); }
    .addbar .msg { margin: 0 0 6px; min-height: 0; }
    .addbar .msg:empty { display: none; }
    .splitsum.bad { color: #C92A2A; }
    @media (max-width: 480px) {
      .splitrow { gap: 5px; padding: 6px; }
      .splitrow .stepbtn { width: 44px; height: 50px; font-size: 1.4em; }
      .splitrow .qtyin { width: 60px; font-size: 1.3em; }
    }

    /* ─ タブ (梱包グループ) ─ */
    .tabs { display: flex; gap: 8px; padding: 10px 12px 0; overflow-x: auto; }
    .tab { border: 0; background: #E9ECEF; color: #495057; border-radius: 10px 10px 0 0;
      padding: 10px 18px; font-size: 1em; font-weight: 700; cursor: pointer; white-space: nowrap; }
    .tab.on { background: #fff; color: #B5651D; box-shadow: 0 -2px 6px rgba(0,0,0,0.06); }

    /* ─ 行リスト ─ */
    .rows { background: #fff; margin: 0 0 120px; }
    .row { display: flex; align-items: center; gap: 10px; padding: 12px; border-bottom: 1px solid #F1F3F5; cursor: pointer; }
    .row:nth-child(even) { background: #FAFBFC; }
    .row.done { background: #EBFBEE; }
    .row.short { background: #FFF5F5; }
    .row .no { min-width: 96px; text-align: center; }
    /* 納品プランNo (紙のシートと同じ「通常_22」) を一番大きく — 現場はこの番号で商品を探す */
    .row .no .plan { font-weight: 800; font-size: 1.05em; color: #495057; line-height: 1.1; white-space: nowrap; }
    .row .no .plan b { display: block; font-size: 2em; color: #B5651D; letter-spacing: 0.02em; }
    .thumb { width: 64px; height: 64px; border-radius: 10px; background: #F1F3F5; display: flex; align-items: center;
      justify-content: center; overflow: hidden; flex: none; color: #ADB5BD; font-size: 1.4em; }
    .thumb img { width: 100%; height: 100%; object-fit: contain; }
    .thumb.big { width: 120px; height: 120px; }
    /* 🚨 min-width: 0 が要る。flex の既定は auto で、中の一番長い塊 (ASIN や「27.3cm×48.4cm<OPP袋>」)
       より狭くならない → 数量が行の外へ押し出され、ページ全体が横にはみ出して滑っていた
       (中原さん 2026-09-10 の iPhone スクショ)。長い型番などは途中で折り返す */
    .row .name { flex: 1 1 auto; min-width: 0; line-height: 1.45; font-size: 1em; overflow-wrap: anywhere; }
    .row .name .sub { font-size: 0.8em; color: #868E96; }
    .row .qty { min-width: 108px; text-align: right; }
    .row .qty .rem { font-size: 1.5em; font-weight: 800; }
    .row.done .qty .rem { color: #2B8A3E; }
    .row:not(.done) .qty .rem { color: #C92A2A; }
    .row .qty .of { font-size: 0.82em; color: #868E96; }
    .badge { display: inline-block; border-radius: 6px; font-size: 0.72em; padding: 2px 7px; font-weight: 700; }
    .badge.exp { background: #FFF3BF; color: #997404; }
    .badge.short { background: #FFE3E3; color: #C92A2A; }
    .badge.warnm { background: #FFE8CC; color: #B5651D; }
    /* 積み方区分 (土台・重い): 仕分けの手がかり。土台=茶 / 重い=青 */
    .badge.pack.base { background: #EFE6DC; color: #7A4A12; }
    .badge.pack.heavy { background: #E7F5FF; color: #1864AB; }

    /* ─ 狭い画面 (iPhone) ─ iPad 用の寸法のままだと商品名が 1 文字ずつ折り返す。
       固定幅を詰めて、名前に幅を回す (中原さん 2026-09-10) */
    @media (max-width: 480px) {
      .row { gap: 8px; padding: 10px 8px; }
      .row .no { min-width: 54px; }
      .row .no .plan { font-size: 0.85em; }
      .row .no .plan b { font-size: 1.8em; }
      .thumb { width: 48px; height: 48px; }
      .row .qty { min-width: 62px; }
      .row .qty .rem { font-size: 1.3em; }
      .row .qty .of { font-size: 0.75em; }
      .boxbar { padding: 8px; gap: 8px; }
      .curbox { font-size: 1.05em; padding: 6px 12px; }
    }

    /* ─ ダイアログ共通 ─ */
    .ovl { position: fixed; inset: 0; background: rgba(33,37,41,0.55); z-index: 60;
      display: flex; align-items: center; justify-content: center; padding: 16px; }
    .dlg { background: #fff; border-radius: 18px; width: min(96vw, 560px); max-height: 92vh;
      overflow-y: auto; padding: 18px; }
    .dlg h2 { margin: 0 0 4px; font-size: 1.1em; }
    .dlg .fn { font-family: ui-monospace, Menlo, monospace; font-weight: 800; font-size: 1.7em; letter-spacing: 0.08em; }
    .dlg .fn b { color: #B5651D; font-size: 1.25em; }
    .dlg .pname { color: #495057; line-height: 1.5; margin: 6px 0 12px; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    .bigbtn { padding: 16px; font-size: 1.15em; font-weight: 800; border: 0; border-radius: 12px;
      background: #B5651D; color: #fff; cursor: pointer; width: 100%; }
    .bigbtn.sub { background: #E9ECEF; color: #495057; }
    .bigbtn.green { background: #2B8A3E; }
    .bigbtn.red { background: #E03131; }
    /* 押せない状態は 色つき (.sub/.green/.red) より **後ろ** に置く。
       前に置くと同じ強さで打ち消され、「押せるのに反応しない」ボタンに見える */
    .bigbtn:disabled { background: #CED4DA; color: #fff; cursor: default; }
    .selbtn { padding: 12px 8px; font-size: 1.05em; font-weight: 700; border: 2px solid #DEE2E6;
      border-radius: 10px; background: #fff; color: #495057; cursor: pointer; }
    .selbtn.on { border-color: #B5651D; background: #FFF4E6; color: #B5651D; }
    .qtyin { width: 100%; font-size: 2em; font-weight: 800; text-align: center; padding: 10px;
      border: 2px solid #DEE2E6; border-radius: 12px; }
    /* 個数 = [− 1個へらす] [数] [＋ 1個ふやす] — 手袋でも押せる大きさ */
    .qtyrow { display: flex; align-items: stretch; gap: 10px; }
    .qtyrow .qtyin { flex: 1; min-width: 0; }
    .stepbtn { flex: none; width: 78px; font-size: 2em; font-weight: 800; line-height: 1;
      border: 2px solid #DEE2E6; border-radius: 12px; background: #F8F9FA; color: #495057; cursor: pointer; }
    .stepbtn:disabled { color: #CED4DA; background: #F1F3F5; }
    .qtyw { margin-top: 6px; min-height: 1.4em; font-size: 0.95em; color: #495057; }
    /* 箱が選ばれていない = このままでは記録できない。目立たせる (中原さん 9/6) */
    .warnbox { background: #FFF5F5; border: 2px solid #FF8787; border-radius: 12px; padding: 12px 14px;
      color: #C92A2A; font-weight: 800; font-size: 1.1em; }
    .warnbox small { display: block; margin-top: 4px; font-size: 0.78em; font-weight: 600; color: #E03131; }
    .lbl { font-size: 0.85em; color: #868E96; font-weight: 700; margin: 14px 0 6px; }
    .msg { min-height: 1.4em; margin-top: 10px; font-size: 0.95em; }
    .msg.err { color: #C92A2A; font-weight: 700; }
    select.dsel { font-size: 1.15em; padding: 10px; border-radius: 10px; border: 2px solid #DEE2E6; width: 100%; }

    /* ─ トースト (元に戻す) ─ */
    .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: 20px; z-index: 70;
      background: #343A40; color: #fff; border-radius: 14px; padding: 12px 16px;
      display: flex; align-items: center; gap: 14px; box-shadow: 0 6px 24px rgba(0,0,0,0.3); }
    .toast button { border: 0; background: #F59F00; color: #212529; font-weight: 800;
      border-radius: 10px; padding: 10px 16px; font-size: 1em; cursor: pointer; }

    /* ─ 一覧 (納品回・作業者選択) ─ */
    .center { max-width: 640px; margin: 24px auto; padding: 0 14px; }
    .card { background: #fff; border-radius: 16px; padding: 18px; margin-bottom: 14px; }
    .runbtn { display: flex; justify-content: space-between; align-items: center; width: 100%;
      padding: 16px; margin-bottom: 10px; border: 2px solid #DEE2E6; border-radius: 14px;
      background: #fff; font-size: 1.05em; cursor: pointer; text-align: left; }
    .runbtn:disabled { opacity: 0.5; }
    .runbtn .st { font-size: 0.8em; font-weight: 700; border-radius: 6px; padding: 3px 8px; }
    .st.active { background: #D3F9D8; color: #2B8A3E; }
    .st.setup { background: #FFF3BF; color: #997404; }
    .st.done { background: #E9ECEF; color: #868E96; }
    .wbtn { padding: 16px 8px; font-size: 1.1em; font-weight: 700; border: 2px solid #DEE2E6;
      border-radius: 12px; background: #fff; cursor: pointer; }
  </style>
</head>
<body>
  <div id="netbar" class="netbar hidden">⚠ 通信できません — いまは入力できません (表示は続きます)</div>

  <!-- 納品回の選択 -->
  <div id="screen-runs" class="center">
    <div class="card">
      <div style="display:flex; align-items:center; gap:10px; margin:0 0 12px">
        <h2 style="margin:0; flex:1">📦 FBA箱詰め記録</h2>
        <a class="chip" style="background:#E9ECEF; color:#495057; text-decoration:none" href="./manual" target="_blank">📖 つかいかた</a>
        <button class="chip" style="background:#E9ECEF; color:#495057" id="btn-roster">👥 名簿</button>
      </div>
      <div id="runlist">読み込み中…</div>
    </div>
    <div class="card" style="text-align:center; color:#868E96; font-size:0.9em">
      納品回が出てこないときは、本社が「納品回の開始」をしているか確認してください
    </div>
  </div>

  <!-- 作業画面 -->
  <div id="screen-work" class="hidden">
    <!-- 上部バー・送信中の帯・箱バーは 1 つの塊で貼り付ける (.stickyhead のコメント参照) -->
    <div class="stickyhead">
      <div class="topbar">
        <button class="chip" id="btn-back">← 回を選ぶ</button>
        <span class="title" id="run-title"></span>
        <span class="sp"></span>
        <button class="chip" id="btn-summary">📋 まとめ</button>
        <button class="chip" id="btn-worker">👤 作業者を選ぶ</button>
      </div>
      <div id="savebar" class="savebar hidden">送信中…</div>
      <div class="boxbar">
        <div class="curbox" id="curbox" title="いま詰めている箱">
          <small>いまの箱</small><span id="curbox-code">未選択</span>
          <small id="curbox-sub"></small>
          <small id="curbox-est"></small>
        </div>
        <div id="boxbtns" style="display:flex; gap:8px;"></div>
        <button class="boxbtn newbox" id="btn-newbox">＋ 新しい箱</button>
      </div>
      <!-- 番号で探す: 利用者さんが言った商品番号を入れる → その商品だけ出る (Enter で開く) -->
      <form class="findbar" id="findform" action="javascript:void(0)" autocomplete="off">
        <label for="find">🔍 番号</label>
        <input id="find" type="search" inputmode="numeric" enterkeyhint="go" autocomplete="off" placeholder="商品の番号 (例: 22)">
        <button type="button" id="find-x" class="hidden">× 消す</button>
        <span class="findn" id="find-n"></span>
      </form>
    </div>
    <div class="tabs" id="tabs"></div>
    <div class="rows" id="rows"></div>
  </div>

  <div id="ovl-root"></div>
  <div id="toast-root"></div>

  <script src="/apps/fba-box/place-queue.js"></script>
  <script>
  'use strict';
  const BASE = '/apps/fba-box';
  const $ = s => document.querySelector(s);

  // ─── 状態 ───
  let runs = [];
  let S = null;              // getRunState の結果 {run, groups, rows, boxes, placements}
  let workers = [], materials = [];
  let curRunId = null;
  let curGroupId = null;
  let curBoxId = null;       // 端末ローカル (localStorage) — 「いまの箱」は端末ごと
  let worker = null;         // {id, display_name, worker_type}
  let online = true;
  let pollTimer = null;
  let dialogOpen = false;
  // 送信中 = 出口を塞ぐ。取り消せない送信 (箱を閉じる) の返事待ちで使う
  let dialogLocked = false;

  const LS = {
    get(k, def) { try { const v = localStorage.getItem('fbx_' + k); return v == null ? def : JSON.parse(v); } catch { return def; } },
    set(k, v) { try { localStorage.setItem('fbx_' + k, JSON.stringify(v)); } catch { /* noop */ } },
  };

  // ─── 通信 ───
  async function apiGet(url) {
    const r = await fetch(BASE + url, { headers: { 'Accept': 'application/json' } });
    const j = await r.json().catch(() => ({ ok: false, message: '応答を解釈できません' }));
    if (!r.ok && !j.message) j.message = 'HTTP ' + r.status;
    j._status = r.status;   // 呼び出し側が「更新中 (5xx)」と「その他」を見分けるため (apiPost と同じ)
    return j;
  }
  // 投入の送信が最後にどう失敗したか ('server' = 5xx が返った / 'net' = 届かなかった)
  let lastPostKind = 'net';
  // いま何のせいで送れていないか。端末が圏外だと言っているなら、前回が 5xx でもそちらを優先する
  // (前の失敗の種別を引きずらない — Codex PR #1366 R2 #6)
  const failKind = () => (navigator.onLine === false ? 'net' : lastPostKind);
  async function apiPost(url, body) {
    const r = await fetch(BASE + url, {
      method: 'POST', headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify(body || {}),
    });
    // 🚨 本文が読めない = 「サーバは処理したのに返事だけ落ちた」かもしれない。ただの失敗と
    //    同じ顔で返すと、取り消せない送信 (箱を閉じる) で「やめられる」と誤解させる
    //    (Codex PR #1299 R3 P1)。呼び出し側が見分けられるよう error を付ける
    const j = await r.json().catch(() => ({ ok: false, error: 'no_body', message: '応答を解釈できません' }));
    j._status = r.status;
    return j;
  }
  /**
   * 通信の状態。
   * 🚨 **「電波が悪い」と「サーバーの更新中」を分ける** (中原さん 2026-09-18)。
   * ポータルは本社の別アプリのマージでも 1〜3 分 502 になる (Render は永続ディスク付きなので
   * ゼロダウンタイムデプロイができない)。そのとき「電波のよいところへ」と出すと、いろはの職員は
   * Wi-Fi を疑って探し回ることになる。**5xx が返ってきた時点で電波は届いている**ので、そう書かない。
   */
  let netKind = 'net';   // 'net' = 届かない (電波・圏外) / 'server' = 届いたが 5xx (更新中か障害)
  const netKindOf = (j) => (j && j._status >= 500 ? 'server' : 'net');
  function setOnline(v, kind) {
    online = v;
    if (!v && kind) netKind = kind;
    const bar = $('#netbar');
    if (bar) {
      bar.textContent = netKind === 'server'
        ? '⚠ サーバーを更新しています — 少し待つと戻ります (入力した分は消えません)'
        : '⚠ 通信できません — いまは入力できません (表示は続きます)';
      bar.classList.toggle('hidden', v);
    }
  }

  // ─── 読み上げ (商品名短縮 + FNSKU下4桁を1文字ずつ) ───
  const CHAR_READ = { A:'エー', B:'ビー', C:'シー', D:'ディー', E:'イー', F:'エフ', G:'ジー', H:'エイチ', I:'アイ',
    J:'ジェー', K:'ケー', L:'エル', M:'エム', N:'エヌ', O:'オー', P:'ピー', Q:'キュー', R:'アール', S:'エス',
    T:'ティー', U:'ユー', V:'ブイ', W:'ダブリュー', X:'エックス', Y:'ワイ', Z:'ゼット',
    '0':'ゼロ', '1':'イチ', '2':'ニー', '3':'サン', '4':'ヨン', '5':'ゴー', '6':'ロク', '7':'ナナ', '8':'ハチ', '9':'キュー' };
  function shortName(name, maxLen = 22) {
    let s = String(name || '').replace(/[【\[][^】\]]*[】\]]/g, ' ').replace(/[<＜][^>＞]*[>＞]/g, ' ');
    s = s.replace(/\s+/g, ' ').trim();
    return s ? s.slice(0, maxLen) : '商品名なし';
  }
  function fn4(fnsku) { return String(fnsku || '').slice(-4).toUpperCase(); }
  const REASON_JA = { missing: '現物がない', damaged: '破損', bad_label: 'ラベル不良', wrong_item: '商品違い', expiry_issue: '期限が合わない',
    hq_order: '本社指示', stock_short: '在庫が少ない', not_shipped: '今回は納品しない', other: 'その他' };
  /** 読み上げは 🔊 ボタンを押したときだけ (商品を開いたときの自動読み上げは廃止 — 中原さん 9/6) */
  function speak(text) {
    if (!('speechSynthesis' in window)) return;
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'ja-JP'; u.rate = Number(LS.get('rate', 1.0));
      speechSynthesis.speak(u);
    } catch { /* 読み上げは補助 — 失敗しても操作は続行 */ }
  }
  /** 「下4桁を読む」ボタン: FNSKU の下4桁を 1 文字ずつ。前置きは読まない (聞きたいのは 4 文字だけ — 中原さん 9/6) */
  function speakDigits(row) {
    speak(fn4(row.fnsku).split('').map(c => CHAR_READ[c] || c).join('、'));
  }
  /** 納品プランNo「通常_22」→ ラベル部と番号部 (番号を大きく出す) */
  function planParts(planNo) {
    const s = String(planNo || '');
    const i = s.lastIndexOf('_');
    return i < 0 ? { label: s || '—', no: '' } : { label: s.slice(0, i), no: s.slice(i + 1) };
  }
  function thumbHtml(row, big) {
    return `<div class="thumb ${big ? 'big' : ''}">${row.image_url ? `<img src="${esc(row.image_url)}" loading="lazy" referrerpolicy="no-referrer" alt="">` : '📦'}</div>`;
  }

  // ─── 重量補助 (PR3) ───
  /** 商品1個の採用単重 (g)。実測 > Amazon の参考値。不明なら null */
  function unitOf(fnsku) {
    const w = (S && S.weights) ? S.weights[String(fnsku || '').toUpperCase()] : null;
    return w && w.unitG > 0 ? w : null;
  }
  const limits = () => (S && S.weightLimits) || { targetG: 28000, limitG: 30000 };
  /** 箱の推定 kg (小数1桁の文字列)。推定できないときは空文字 */
  function estKg(b) { return b && b.est && b.est.estG > 0 ? (b.est.estG / 1000).toFixed(1) : ''; }
  /**
   * 箱の資材 (サイズ)。箱をつくるときに選んだきり、あとから確かめられなかった (中原さん 2026-09-18)。
   * 登録が消えた資材・古い箱 (資材なし) でも、分かる範囲を出す (コードだけでも出す)
   */
  function matName(b) {
    const code = b && b.material_code;
    if (!code) return '';
    // 退役した資材で作った古い箱も名前を出す (materials は「いま選べる資材」だけ)。
    // 🚨 素の map[key] は継承した中身 (constructor など) を拾う。資材コードは英数字なので
    //    'constructor' という資材が作れてしまう → 関数が返り、後続の replace で画面が落ちる
    //    (Codex PR #1359 R1) [[feedback_object_hasown_for_lookup_validation]]
    const names = (S && S.materialNames) || {};
    const fromApi = Object.prototype.hasOwnProperty.call(names, code) ? names[code] : null;
    if (typeof fromApi === 'string' && fromApi) return fromApi;
    const m = (materials || []).find(x => x.code === code);
    return (m && typeof m.name === 'string' && m.name) ? m.name : code;
  }
  /** 箱ボタン・「いまの箱」に添える短いサイズ (「140サイズ段ボール」→「140」)。長い名前は詰める */
  function matShort(b) {
    const n = matName(b);
    if (!n) return '';
    const s = n.replace(/サイズ(段ボール|ダンボール)?/, '').replace(/(段ボール|ダンボール)$/, '').trim() || n;
    return s.length > 6 ? s.slice(0, 6) + '…' : s;
  }
  /**
   * 箱ボタンの短い重さ表示。推定が当てにならない箱で「約N kg」とだけ書くと
   * 「まだ入る」と誤解させるので、欠損は必ず添える (Codex PR3 #3 / 要件 §7)
   */
  function estChip(b) {
    const e = b && b.est;
    if (!e || !(e.estG > 0)) return '';
    const kg = (e.estG / 1000).toFixed(1);
    if (e.complete) return ` / 約${kg}kg`;
    if (e.unknownQty > 0) return ` / ${kg}kg+不明${e.unknownQty}点`;
    return ` / ${kg}kg(自重なし)`;
  }
  /**
   * 推定の見せ方。単重不明の商品がある箱は「(重量不明 N点を除く)」を必ずセットで出す (要件 §7) —
   * 数字だけ見て「まだ入る」と誤解させない
   */
  function estLabel(b) {
    const e = b && b.est;
    if (!e || !(e.estG > 0)) return '';
    const L = limits();
    const color = e.estG > L.limitG ? '#C92A2A' : (e.estG > L.targetG ? '#B5651D' : '#A0742E');
    const miss = e.unknownQty > 0 ? ` (重量不明 ${e.unknownQty}点を除く)` : (e.tareKnown ? '' : ' (箱の自重が未登録)');
    return `<span style="color:${color}">⚖ 推定 ${(e.estG / 1000).toFixed(1)}kg${miss}</span>`;
  }
  /** この箱にあと約何個入るか。単重不明・自重未登録があるうちは出さない (要件 §7) */
  function roomLeft(b, unitG) {
    const e = b && b.est;
    if (!e || !e.complete || !(unitG > 0)) return null;
    return Math.floor((limits().targetG - e.estG) / unitG);
  }
  function weighChipLabel(fnsku) {
    const w = unitOf(fnsku);
    if (!w) return '⚖ 重さを登録';
    return `⚖ 1個 ${fmtG(w.unitG)}${w.source === 'measured' ? ' (実測)' : ' (参考)'}`;
  }
  const fmtG = (g) => (g >= 1000 ? (g / 1000).toFixed(2) + 'kg' : Math.round(g * 10) / 10 + 'g');

  // ─── 積み方区分 (土台・重い。2026-09-09 別紙要件) ───
  // 商品の性質 (次回以降のピッキングリスト・P-touch ラベルにも出る)。今回この箱の「置いた場所」とは別物。
  // 有効な値はサーバー (effectivePackingClass) が決める: 人が付けた値 > 重さから自動の「重い」 > 未設定
  const PACK_JA = { base: '土台', heavy: '重い', normal: '通常' };
  function packOf(fnsku) { return (S && S.packing) ? (S.packing[String(fnsku || '').toUpperCase()] || null) : null; }
  function packBadge(fnsku) {
    const p = packOf(fnsku);
    if (!p || !p.cls || p.cls === 'normal') return '';
    return `<span class="badge pack ${p.cls}">${PACK_JA[p.cls]}</span>`;
  }
  /** 投入ダイアログの積み方の説明 (いま何が効いていて、なぜか) */
  function packStatusText(fnsku) {
    const p = packOf(fnsku);
    if (!p || !p.cls) {
      let why = '';
      if (p && !p.unitG) why = ' (重さが未登録なので「重い」の自動判定はできません)';
      else if (p && !p.heavyMinG) why = ' (「重い」の基準が未設定なので自動判定はありません)';
      return `<span style="color:#B5651D">未設定 — 仕分けの区分を選んでください${why}</span>`;
    }
    const who = p.source === 'weight' ? `重さから自動 (1個 ${fmtG(p.unitG)} ≥ ${fmtG(p.heavyMinG)}。外すなら「通常」)`
      : (p.source === 'sheet_import' ? '土台シートから取り込み' : `手で設定${p.updatedBy ? ' (' + esc(p.updatedBy) + ')' : ''}`);
    return `いま: <b>${PACK_JA[p.cls]}</b> <small style="color:#868E96">${who}</small>`;
  }
  function packBlockHtml(r) {
    const p = packOf(r.fnsku);
    const cur = p && p.cls;
    return `<div class="lbl">📦 積み方 (この商品はいつも — 次回のラベルにも出ます)</div>
        <div class="grid3">${['base', 'heavy', 'normal'].map(v => `<button class="selbtn pack ${cur === v ? 'on' : ''}" data-v="${v}">${PACK_JA[v]}</button>`).join('')}</div>
        <div class="msg" id="d-packmsg">${packStatusText(r.fnsku)}</div>`;
  }
  /**
   * 賞味期限の入力 (中原さん 2026-09-18: 期限管理商品として設定されているものだけ出す)。
   *   r.requires_expiry === 1 → いままでどおり 年/月/日 を開いて出す + 「期限管理商品です」
   *   r.requires_expiry === 0 → たたむ。「＋ この商品にも期限を入れる」を押せば出る
   *     🚨 隠しきらない: 判定 (ロジザードの商品マスタ) が違っていても、現場がその場で入れられる
   *   null (分からない / まだ判定していない) → いままでどおり出す
   */
  function expiryBlockHtml(r, knownExpiry) {
    const sel = `<div class="grid3" id="d-expsel">
        <select class="dsel" id="d-ey"><option value="">年</option>${expiryYears()}</select>
        <select class="dsel" id="d-em"><option value="">月</option>${range(1, 12).map(m => `<option>${String(m).padStart(2, '0')}</option>`).join('')}</select>
        <select class="dsel" id="d-ed"><option value="">日</option>${range(1, 31).map(m => `<option>${String(m).padStart(2, '0')}</option>`).join('')}</select>
      </div>`;
    if (knownExpiry) {
      return `<div class="lbl">賞味期限</div>
        <div>この商品の期限: <b>${esc(knownExpiry)}</b> (2回目からは自動で同じ期限になります)</div>`;
    }
    if (r.requires_expiry === 0) {
      return `<button class="selbtn" id="d-expopen" style="width:100%; margin-top:10px; font-weight:700">＋ この商品にも賞味期限を入れる</button>
        <div id="d-expwrap" hidden>
          <div class="lbl">賞味期限</div>
          <div class="msg">この商品は期限管理商品ではない設定です (ロジザードの商品マスタ)。実物に期限が書いてあれば入れてください</div>
          ${sel}
        </div>`;
    }
    return `<div class="lbl">賞味期限${r.requires_expiry === 1 ? ' <span class="badge exp">この商品は期限管理商品です</span>' : ' (期限のある商品だけ)'}</div>
      ${sel}`;
  }

  // ─── 納品回一覧 ───
  // 一覧が読めないときは 10 秒ごとに取り直す (回を開いたあとの自動更新と同じ間隔)。
  // これが無いと、サーバーが戻っても一覧は「待ってください」のまま止まる (Codex PR #1366 R1 #3)
  let runsRetryTimer = null;
  function retryRuns() { if (!runsRetryTimer) runsRetryTimer = setInterval(() => { if (!curRunId) loadRuns(); }, 10000); }
  function stopRetryRuns() { if (runsRetryTimer) { clearInterval(runsRetryTimer); runsRetryTimer = null; } }

  async function loadRuns() {
    const j = await apiGet('/api/runs').catch(() => ({ ok: false }));
    setOnline(!!j.ok, netKindOf(j));
    if (!j.ok) {
      // 赤バーと食い違わせない (更新中に「再読み込みして」と急かさない)。
      // 🚨「終わると自動で出ます」と書く以上、**本当に取りに行き続ける** (Codex PR #1366 R1 #3)
      $('#runlist').textContent = netKindOf(j) === 'server'
        ? 'サーバーを更新しています。終わると自動で出ます (このまま待ってください)'
        : '読み込めませんでした。つながると自動で出ます';
      retryRuns();
      return;
    }
    stopRetryRuns();
    runs = j.runs;
    const stJa = { active: '作業できます', setup: '準備中 (本社確認待ち)', done: '完了', cancelled: '取消' };
    // まだ納品回になっていない picking 実行 (本社の picking-prep 完了で普通は自動作成されるが、
    // 失敗したとき・作り直したいときは現場が「作業開始」で作れる)
    const pending = (j.pickingRuns || []).filter(p => !p.boxRun);
    // 完了した回は「結果を見る」(読むだけの一覧・Google チャットへの知らせの状態) を開く (中原さん 2026-09-17)。準備中・取消は押せないまま
    const html = runs.map(r => r.status === 'done' ? `
      <button class="runbtn" data-result="${r.id}">
        <span>${esc(r.title)}<br><small style="color:#868E96">${r.row_count}商品 / ${r.group_count}グループ</small></span>
        <span class="st done">完了 ・ 結果を見る ›</span>
      </button>` : `
      <button class="runbtn" data-id="${r.id}" ${r.status === 'active' ? '' : 'disabled'}>
        <span>${esc(r.title)}<br><small style="color:#868E96">${r.row_count}商品 / ${r.group_count}グループ</small></span>
        <span class="st ${r.status}">${stJa[r.status] || r.status}</span>
      </button>`).join('') + pending.map(p => `
      <button class="runbtn" data-src="${p.id}" style="border-style:dashed">
        <span>${esc(p.deliveryDate ? p.deliveryDate + ' 納品分' : '実行#' + p.id)}<br><small style="color:#868E96">${p.sheetCount ?? '?'}シート / まだ始めていません</small></span>
        <span class="st setup">▶ 作業開始</span>
      </button>`).join('');
    $('#runlist').innerHTML = html || '納品回がまだありません' + (j.pickingError ? `<br><small style="color:#C92A2A">ピッキング実行を読めません: ${esc(j.pickingError)}</small>` : '');
    $('#runlist').querySelectorAll('button[data-id]').forEach(b => {
      b.addEventListener('click', () => openRun(Number(b.dataset.id)));
    });
    $('#runlist').querySelectorAll('button[data-result]').forEach(b => {
      b.addEventListener('click', async () => {
        if (b.disabled) return;
        b.disabled = true;
        const url = `${BASE}/runs/${Number(b.dataset.result)}/result`;
        // ホーム画面のアイコンから開いた画面には「戻る」が無い。圏外で移ると戻れない白い画面になるので、先に届くか確かめる
        // 届いたが 5xx = サーバーの更新中 (電波は問題ない) / 届かない = 圏外。文面を分ける
        const head = await fetch(url, { method: 'HEAD', cache: 'no-store' }).then(r => ({ ok: r.ok, status: r.status })).catch(() => ({ ok: false, status: 0 }));
        if (!head.ok) {
          const server = head.status >= 500;
          setOnline(false, server ? 'server' : 'net');
          alert(server
            ? 'サーバーを更新しているところです。少し待ってから、もう一度押してください'
            : '通信できません。電波のよいところで、もう一度押してください');
          b.disabled = false; return;
        }
        location.href = url;
      });
    });
    $('#runlist').querySelectorAll('button[data-src]').forEach(b => {
      b.addEventListener('click', async () => {
        b.disabled = true;
        const r = await apiPost('/api/runs/from-picking', { source_run_id: Number(b.dataset.src) });
        if (!r.ok) { alert(r.message || '作れませんでした'); b.disabled = false; return; }
        openRun(Number(r.runId));
      });
    });
  }

  // ─── 作業画面 ───
  async function openRun(runId) {
    curRunId = runId;
    curBoxId = LS.get('curbox_' + runId, null);
    $('#find').value = '';   // 前の回の番号を持ち越さない
    await refresh(true);
    if (!S) return;
    $('#screen-runs').classList.add('hidden');
    $('#screen-work').classList.remove('hidden');
    // refresh が未確認の記録を出していたら、それを上書きしない (閉じたあとに出す — PQ-R2 high#4)
    if (!worker && !dialogOpen) pickWorker();
    startPolling();
  }
  function backToRuns() {
    stopPolling();
    $('#screen-work').classList.add('hidden');
    $('#screen-runs').classList.remove('hidden');
    curRunId = null; S = null;
    loadRuns();
  }

  async function refresh(force) {
    if (!curRunId) return;
    if (dialogOpen && !force) return;   // 入力中に画面を差し替えない
    // 読めない記録が残っているなら、投入を押す前に職員に見せる (押してから気づくと、
    // その「今回分」も行き場がなくなる — Codex PQ-R3 high#3)
    const stuck = placeQueue.peek();
    if (stuck && stuck.broken) { if (!dialogOpen) showBrokenPending(stuck); return; }
    const resolved = await placeQueue.flush();   // 未確定の割当を同じ request_id で送り直す
    if (resolved) showLeftoverPlacement(resolved);   // 確定した分は必ず人に見せてから消す
    try {
      const j = await apiGet('/api/state?run=' + curRunId);
      setOnline(!!j.ok || j._status === 404, netKindOf(j));
      if (!j.ok) return;
      S = j; workers = j.workers; materials = j.materials;
      if (!curGroupId || !S.groups.some(g => g.id === curGroupId)) curGroupId = S.groups[0]?.id || null;
      const boxOk = S.boxes.some(b => b.id === curBoxId && b.status === 'open' && b.pack_group_id === curGroupId);
      if (!boxOk) curBoxId = null;
      render();
      if (!dialogOpen && !showPendingUndo()) showUnsentNow();
    } catch {
      setOnline(false, 'net');   // 例外 = 応答が無い = 届いていない (Codex PR #1366 R1 #4)
    }
  }
  function startPolling() { stopPolling(); pollTimer = setInterval(() => refresh(false), 10000); }
  function stopPolling() { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }

  /**
   * サーバから見たいまの箱の状態。取れなければ null (= 分からない)。
   * 🚨 「返事が来なかった」は「閉じていない」ではない。聞き直して確かめるために使う
   *    (Codex PR #1299 R2 P1)
   */
  async function boxStatusNow(boxId) {
    try {
      const j = await apiGet('/api/state?run=' + curRunId);
      if (!j || !j.ok) return null;
      const x = (j.boxes || []).find(v => v.id === boxId);
      return x ? x.status : null;
    } catch { return null; }
  }

  /** 記録の時刻 (HH:MM・日本時間)。created_at は UTC の ISO なので、文字を切り出すと 9 時間ずれる */
  function hhmm(iso) {
    const d = new Date(iso || '');
    if (Number.isNaN(d.getTime())) return '';
    const j = new Date(d.getTime() + 9 * 3600 * 1000);
    return String(j.getUTCHours()).padStart(2, '0') + ':' + String(j.getUTCMinutes()).padStart(2, '0');
  }
  function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }

  function render() {
    if (!S) return;
    $('#run-title').textContent = S.run.title;
    $('#btn-worker').textContent = worker ? `👤 ${worker.display_name}` : '👤 作業者を選ぶ';
    $('#btn-worker').classList.toggle('warn', !worker);
    // タブ
    $('#tabs').innerHTML = S.groups.map(g => {
      const rowsOf = S.rows.filter(r => r.pack_group_id === g.id && r.match_state !== 'retired');
      const doneN = rowsOf.filter(r => rowDone(r)).length;
      return `<button class="tab ${g.id === curGroupId ? 'on' : ''}" data-id="${g.id}">${esc(g.sheet_name)} (${doneN}/${rowsOf.length})</button>`;
    }).join('');
    $('#tabs').querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => switchGroup(Number(b.dataset.id))));
    // 箱バー (取消した箱は出さない。Amazon 番号がずれた箱は →P1 - B2 を添える)
    const boxes = S.boxes.filter(b => b.pack_group_id === curGroupId && b.status !== 'void');
    const cur = boxes.find(b => b.id === curBoxId);
    // いまの箱にもサイズを出す (「どの箱サイズだったっけ」を、タップしなくても分かるように)。
    // 🚨 箱コードの行にはコードだけを置く — サイズや個数を並べると、狭い画面で**箱コードのほうが**
    //    「…」で切れてしまう (Codex PR #1359 R1)。サイズ・個数・推定は下の小さい行へ
    $('#curbox-code').textContent = cur ? cur.box_code : '未選択';
    $('#curbox-sub').textContent = cur ? [matShort(cur), `${cur.total_qty}個`].filter(Boolean).join(' ・ ') : '';
    // 🚨 推定は別の行に置き、折り返させる (要件 §7)。資材名や個数と同じ行にして「…」で切ると、
    //    kg だけ見えて「(重量不明 N点を除く)」が消え、まだ入ると誤解させる (Codex PR #1359 R2)
    $('#curbox-est').innerHTML = cur ? estLabel(cur) : '';
    $('#boxbtns').innerHTML = boxes.map(b => `
      <button class="boxbtn ${b.status === 'closed' ? 'closed' : ''}" data-id="${b.id}">
        ${esc(b.box_code)}${b.status === 'closed' ? ' ✓' : ''} <small>${matShort(b) ? esc(matShort(b)) + ' / ' : ''}${b.total_qty}個${estChip(b)}${b.amazon_box_no !== b.box_no ? ' →' + esc(b.amazon_name) : ''}</small>
      </button>`).join('');
    $('#boxbtns').querySelectorAll('.boxbtn').forEach(b => b.addEventListener('click', () => openBoxDialog(Number(b.dataset.id))));
    // 行リスト (retired = 差し替えで消えた行は出さない)。番号が入っていれば、その番号の商品だけ
    const allRows = S.rows.filter(r => r.pack_group_id === curGroupId && r.match_state !== 'retired');
    const q = findQuery();
    const rows = q ? findRows(allRows, q) : allRows;
    renderFindInfo(q, rows, allRows);
    if (q && rows.length === 0) {
      $('#rows').innerHTML = findMissHtml(q);
      $('#rows').querySelectorAll('button[data-gid]').forEach(b => b.addEventListener('click', () => switchGroup(Number(b.dataset.gid))));
      return;
    }
    $('#rows').innerHTML = rows.map(r => {
      const rem = r.planned_qty - r.placed - (r.shortage_qty || 0);
      const done = rowDone(r);
      const pp = planParts(r.plan_no);
      return `<div class="row ${done ? 'done' : ''} ${r.shortage_qty ? 'short' : ''}" data-id="${r.id}">
        <div class="no"><div class="plan">${esc(pp.label)}<b>${esc(pp.no)}</b></div></div>
        ${thumbHtml(r)}
        <div class="name">${esc(r.product_name || r.seller_sku)}
          <div class="sub">${esc(r.fnsku)} ${packBadge(r.fnsku)}
            ${r.match_state === 'qty_mismatch' ? '<span class="badge warnm">数量注意</span>' : ''}
            ${r.match_state === 'excel_only' ? '<span class="badge warnm">Excelにだけある</span>' : ''}
            ${r.match_state === 'picking_only' ? '<span class="badge short">Excelに無い (入れない)</span>' : ''}
            ${r.shortage_qty ? `<span class="badge short">送る数 ${r.planned_qty - r.shortage_qty} (予定 ${r.planned_qty}${r.shortage_reason ? '・' + esc(REASON_JA[r.shortage_reason] || r.shortage_reason) : ''})</span>` : ''}
            ${expiryOf(r.id) ? `<span class="badge exp">期限 ${esc(expiryOf(r.id))}</span>` : ''}
            ${!expiryOf(r.id) && r.requires_expiry === 1 && r.placed > 0 ? '<span class="badge short">期限まだ</span>' : ''}
            ${r.check_worker ? `✅${esc(r.check_worker)}` : ''}
          </div>
        </div>
        <div class="qty"><span class="rem">${done ? '✓' : rem}</span><div class="of">${r.placed}/${r.planned_qty}</div></div>
      </div>`;
    }).join('');
    $('#rows').querySelectorAll('.row').forEach(el => el.addEventListener('click', () => openRowDialog(Number(el.dataset.id))));
  }
  function rowDone(r) { return r.match_state === 'picking_only' || (r.placed + (r.shortage_qty || 0) >= r.planned_qty && r.planned_qty > 0); }
  function switchGroup(gid) {
    curGroupId = gid;
    const boxOk = S.boxes.some(x => x.id === curBoxId && x.status === 'open' && x.pack_group_id === curGroupId);
    if (!boxOk) curBoxId = null;
    render();
  }

  // ─── 番号で探す (いろは 2026-09-23: 60 商品を超えるとスクロールが大変。利用者さんが言った番号を直接入れる) ───
  /** 入力欄の文字。全角の数字・英字は半角にそろえる (iPad の日本語キーボードのまま打っても当たるように) */
  function findQuery() {
    const el = $('#find');
    return el ? el.value.replace(/[０-９Ａ-Ｚａ-ｚ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).trim() : '';
  }
  /**
   * 数字だけ = 商品番号 (「通常_22」の 22)。**その番号ちょうど**を先頭に、続けて その番号で始まる商品
   * (「2」と打った途中でも 2・20〜29 が出て、「22」まで打てば 22 が先頭)。
   * 数字以外 = FNSKU (下 4 桁など) か商品名に含まれるもの
   */
  function findRows(rows, q) {
    if (/^\d+$/.test(q)) {
      const n = String(Number(q));   // 「022」でも 22 に当てる
      const noOf = (r) => { const s = planParts(r.plan_no).no; return /^\d+$/.test(s) ? String(Number(s)) : s; };
      return [...rows.filter(r => noOf(r) === n), ...rows.filter(r => noOf(r) !== n && noOf(r).startsWith(n))];
    }
    const u = q.toUpperCase();
    return rows.filter(r => String(r.fnsku || '').toUpperCase().includes(u) || String(r.product_name || '').toUpperCase().includes(u));
  }
  /** Enter (キーボードの「開く」) で開く商品 = 番号ちょうどの商品が 1 つだけのとき (数字以外なら当たりが 1 つだけのとき) */
  function findTarget(rows, q) {
    if (!q) return null;
    if (/^\d+$/.test(q)) {
      const exact = rows.filter(r => { const s = planParts(r.plan_no).no; return /^\d+$/.test(s) && Number(s) === Number(q); });
      return exact.length === 1 ? exact[0] : null;
    }
    return rows.length === 1 ? rows[0] : null;
  }
  function renderFindInfo(q, rows, allRows) {
    $('#find-x').classList.toggle('hidden', !q);
    $('#find-n').textContent = q ? (rows.length ? `${rows.length} 件` : '') : `${allRows.length} 商品`;
  }
  /** このタブに無いとき、ほかのタブにあれば切り替えボタンを出す (番号はタブごとに 1 から振ってある) */
  function findMissHtml(q) {
    const others = S.groups.filter(g => g.id !== curGroupId).map(g => ({
      g, n: findRows(S.rows.filter(r => r.pack_group_id === g.id && r.match_state !== 'retired'), q).length,
    })).filter(x => x.n > 0);
    return `<div class="findmiss">このタブには「${esc(q)}」の商品がありません${others.length
      ? `<br>${others.map(x => `<button class="selbtn" data-gid="${x.g.id}">${esc(x.g.sheet_name)} に ${x.n} 件 → 切り替える</button>`).join('')}`
      : ''}</div>`;
  }
  function clearFind() {
    const el = $('#find');
    if (el && el.value) { el.value = ''; render(); }
  }

  // ─── まとめ (出荷前チェック): 何が残っているかを現場でも見られる ───
  async function summaryDialog() {
    const j = await apiGet('/api/readiness?run=' + curRunId);
    if (!j.ok) { alert(j.message || '読み込めませんでした'); return; }
    const r = j.readiness;
    const item = (x, color) => `<div style="padding:6px 0; border-bottom:1px solid #F1F3F5; color:${color}">${esc(x.message)}
      ${x.rows ? `<div style="font-size:0.85em; color:#495057">${x.rows.slice(0, 12).map(y => `・${esc(shortName(y.name, 16))} ${esc(fn4(y.fnsku))} (${y.placed}/${y.planned})`).join('<br>')}${x.rows.length > 12 ? '<br>…' : ''}</div>` : ''}
      ${x.boxes ? `<div style="font-size:0.85em; color:#495057">${x.boxes.map(y => `・${esc(y.code)}${y.amazonName && y.amazonBoxNo !== y.boxNo ? ' → Amazon ' + esc(y.amazonName) : ''}`).join('<br>')}</div>` : ''}</div>`;
    openDialog(`
      <h2>📋 まとめ — ${esc(S.run.title)}</h2>
      ${r.ok ? '<div class="msg" style="color:#2B8A3E; font-weight:700">✅ 箱詰めは完了しています。本社が Excel を出力します</div>'
             : `<div class="lbl" style="color:#C92A2A">あと残っていること</div>${r.blockers.map(x => item(x, '#C92A2A')).join('')}`}
      ${r.warnings.length ? `<div class="lbl">注意</div>${r.warnings.filter(w => !['exported', 'stale_export', 'sta_uploaded', 'no_dims', 'match_warnings'].includes(w.code)).map(x => item(x, '#B5651D')).join('')}` : ''}
      <div class="lbl">箱 (箱札は 🖨 から印刷)</div>
      ${r.groups.map(g => `<div><b>${esc(g.sheetName)}</b>: ${g.boxes.map(b => `${esc(b.code)}${b.amazonBoxNo !== b.boxNo ? '→' + esc(b.amazonName) : ''}${b.status === 'closed' ? '✓' : ''}`).join(' / ') || 'なし'}</div>`).join('')}
      <div class="grid2" style="margin-top:14px">
        <a class="bigbtn sub" style="text-align:center; text-decoration:none; display:block" href="${BASE}/print/boxes?run=${curRunId}" target="_blank">🖨 箱札 (全部)</a>
        <button class="bigbtn sub" id="sm-close">閉じる</button>
      </div>
      ${S.run.status === 'active' ? '<div style="margin-top:10px"><button class="bigbtn green" id="sm-finish">✅ 作業を終える (職員)</button></div>' : ''}`);
    $('#sm-close').addEventListener('click', closeDialog);
    $('#sm-finish')?.addEventListener('click', () => finishFlow());
  }

  /**
   * 作業を終える: 職員PIN → まだ入っていない商品があれば一覧を出して確認 → それでも完了 (残りは「今回は納品しない」)。
   * 中身のある開いた箱は先に閉じてもらう
   */
  function finishFlow() {
    staffPinPrompt(async (sw, pin) => {
      const j = await apiPost(`/api/runs/${curRunId}/finish`, { worker_id: sw.id, pin, acknowledge: false });
      if (j.ok) { alert(`✅ 作業を終えました${j.voidedBoxes?.length ? `\n(使わなかった箱を取消: ${j.voidedBoxes.join(', ')})` : ''}`); backToRuns(); return; }
      if (j.error === 'open_boxes') { alert(j.message); return; }
      if (j.error !== 'incomplete') { alert(j.message || '終えられませんでした'); return; }
      const dlg = openDialog(`
        <h2>⚠ まだ入っていない商品があります</h2>
        <div class="msg" style="color:#495057">${esc(j.message)}</div>
        <div style="max-height:40vh; overflow-y:auto; margin:10px 0; background:#FFF5F5; border-radius:10px; padding:10px">
          ${j.rows.map(x => `<div style="padding:5px 0; border-bottom:1px solid #FFE3E3"><b>${esc(x.planNo || '')}</b> ${esc(shortName(x.name, 22))} — 予定 ${x.planned} / 入れた ${x.placed}${x.shortage ? ' / 不足 ' + x.shortage : ''} → <b style="color:#C92A2A">残り ${x.remaining}</b></div>`).join('')}
        </div>
        <div class="msg" style="color:#868E96">破損・自社出荷の引当などで納品しない場合はそのまま完了できます。残りは「今回は納品しない」として記録され、本社の画面に出ます</div>
        <div class="grid2" style="margin-top:12px">
          <button class="bigbtn sub" id="f-back">戻って続ける</button>
          <button class="bigbtn red" id="f-go">それでも完了する</button>
        </div>`);
      dlg.querySelector('#f-back').addEventListener('click', closeDialog);
      dlg.querySelector('#f-go').addEventListener('click', async () => {
        const j2 = await apiPost(`/api/runs/${curRunId}/finish`, { worker_id: sw.id, pin, acknowledge: true });
        if (!j2.ok) { alert(j2.message || '終えられませんでした'); return; }
        closeDialog();
        alert(`✅ 作業を終えました (納品しない商品 ${j2.notShipped} 行)`);
        backToRuns();
      });
    });
  }
  function expiryOf(rowId) {
    const p = (S.placements || []).find(p => p.row_id === rowId && p.expiry);
    return p ? p.expiry : null;
  }

  // ─── ダイアログ部品 ───
  function openDialog(html, opts) {
    dialogOpen = true;
    dialogLocked = false;   // 新しい画面は必ず閉じられる状態から始める
    // 🚨 前の「記録しました / 元に戻す」のトーストは消す。トーストは画面の下で、ダイアログより手前 (z-index 70 > 60)。
    //    「入れた」を画面の下に貼り付けたので、重なったところを押すと前の商品の記録を取り消してしまう (Codex PR #1428 R1 #1)
    hideToast();
    $('#ovl-root').innerHTML = `<div class="ovl"><div class="dlg">${html}</div></div>`;
    // sticky = 背景タップで閉じない。「さらに入れましたか?」の答えを取りこぼすと
    // 実際に入れた分が記録されない (Codex PQ-R1 high#4)
    if (!(opts && opts.sticky)) {
      // 送信中 (dialogLocked) は背景タップでも閉じない。ボタンだけ塞いでも
      // 背景から抜けられては同じこと (Codex PR #1299 R1)
      $('#ovl-root .ovl').addEventListener('click', (e) => { if (e.target === e.currentTarget && !dialogLocked) closeDialog(); });
    }
    return $('#ovl-root .dlg');
  }
  function closeDialog() { dialogOpen = false; dialogLocked = false; $('#ovl-root').innerHTML = ''; refresh(true); }

  // ─── 作業者選択 ───
  function pickWorker() {
    const dlg = openDialog(`
      <h2>👤 作業者を選んでください</h2>
      <div class="grid3" style="margin-top:12px" id="wgrid">
        ${workers.map(w => `<button class="wbtn" data-id="${w.id}">${esc(w.display_name)}${w.worker_type === 'staff' ? ' 🔑' : ''}</button>`).join('')}
      </div>
      <div class="msg" style="color:#868E96">🔑 = 職員 ${workers.length === 0 ? '— まだ名簿がありません。「名簿を編集」から登録してください' : ''}</div>
      <div style="margin-top:8px"><button class="bigbtn sub" id="w-roster">👥 名簿を編集 (追加・PIN)</button></div>`);
    dlg.querySelectorAll('.wbtn').forEach(b => b.addEventListener('click', () => {
      worker = workers.find(w => w.id === Number(b.dataset.id));
      LS.set('worker', worker.id);

  // ─── 名簿 (作業者・PIN) の編集 — 職員PINで守る。PIN持ちの職員がいない最初だけ無ゲート ───
  async function rosterDialog() {
    const j = await apiGet('/api/roster');
    if (!j.ok) { alert(j.message || '名簿を読めませんでした'); return; }
    const list = j.workers;
    const dlg = openDialog(`
      <h2>👥 名簿 (作業者)</h2>
      ${j.bootstrap
        ? '<div class="msg" style="color:#B5651D; font-weight:700">はじめに職員を1人登録して PIN を決めてください。以後、名簿の変更には職員の PIN が必要になります</div>'
        : '<div class="msg" style="color:#868E96">変更には職員の PIN が必要です (🔑 = PIN 設定済み)。名簿と PIN は いろは在庫化アプリ・会社のスタッフマスタと共通です</div>'}
      <div class="lbl">追加する</div>
      <input class="qtyin" id="r-name" type="text" placeholder="名前 (例: たなか)" maxlength="30" style="font-size:1.2em; text-align:left">
      <div class="grid2" style="margin-top:8px"><button class="selbtn rt on" data-v="member">利用者</button><button class="selbtn rt" data-v="staff">職員 (PINあり)</button></div>
      <div style="margin-top:10px"><button class="bigbtn" id="r-add">追加する</button></div>
      <div class="lbl">いまの名簿</div>
      <div style="max-height:36vh; overflow-y:auto">
        ${list.length === 0 ? '<div style="color:#868E96">まだ誰もいません</div>' : list.map(w => `
          <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid #F1F3F5; ${w.active ? '' : 'color:#ADB5BD'}">
            <span>${esc(w.display_name)} <small>${w.worker_type === 'staff' ? '職員' + (w.pin_set ? ' 🔑' : ' (PIN未設定)') : '利用者'}${w.active ? '' : ' / 無効'}</small></span>
            <span style="white-space:nowrap">
              ${w.worker_type === 'staff' && w.active ? `<button class="selbtn r-pin" data-id="${w.id}" data-name="${esc(w.display_name)}" style="padding:6px 10px">PIN${w.pin_set ? '変更' : '設定'}</button>` : ''}
              <button class="selbtn r-act" data-id="${w.id}" data-name="${esc(w.display_name)}" data-active="${w.active ? 1 : 0}" style="padding:6px 10px">${w.active ? '無効' : '有効'}</button>
            </span>
          </div>`).join('')}
      </div>
      <div style="margin-top:12px"><button class="bigbtn sub" id="r-close">閉じる</button></div>
      <div class="msg" id="r-msg"></div>`);
    const msg = dlg.querySelector('#r-msg');
    let wtype = 'member';
    dlg.querySelectorAll('.rt').forEach(b => b.addEventListener('click', () => {
      dlg.querySelectorAll('.rt').forEach(x => x.classList.remove('on')); b.classList.add('on'); wtype = b.dataset.v;
    }));
    dlg.querySelector('#r-close').addEventListener('click', closeDialog);
    // 変更操作: bootstrap ならそのまま、そうでなければ職員PIN → 実行 → 名簿を開き直す
    const staffList = list.filter(w => w.worker_type === 'staff' && w.active && w.pin_set);
    const withAuth = (fn) => {
      if (j.bootstrap) return fn({});
      staffPinPrompt((sw, pin) => fn({ auth_worker_id: sw.id, auth_pin: pin }), staffList);
    };
    const done = async (p) => {
      const r = await p;
      if (!r.ok) alert(r.message || '変更できませんでした');
      rosterDialog();
    };
    dlg.querySelector('#r-add').addEventListener('click', () => {
      const name = dlg.querySelector('#r-name').value.trim();
