      withAuth(auth => done(apiPost('/api/workers', { display_name: name, worker_type: wtype, ...auth })));
    });
    dlg.querySelectorAll('.r-pin').forEach(b => b.addEventListener('click', () => {
      withAuth(auth => newPinDialog(b.dataset.name, (pin) => done(apiPost(`/api/workers/${b.dataset.id}/pin`, { pin, ...auth }))));
    }));
    dlg.querySelectorAll('.r-act').forEach(b => b.addEventListener('click', () => {
      const toActive = b.dataset.active !== '1';
      if (!confirm(`${b.dataset.name} を${toActive ? '有効' : '無効'}にしますか?`)) return;
      withAuth(auth => done(apiPost(`/api/workers/${b.dataset.id}/active`, { active: toActive, ...auth })));
    }));
  }

  /** 新しい PIN の入力 (2回・伏せ字)。window.prompt は平文表示なので使わない */
  function newPinDialog(name, cb) {
    const dlg = openDialog(`
      <h2>🔑 ${esc(name)} の PIN</h2>
      <div class="lbl">新しい PIN (4〜8桁の数字)</div>
      <input class="qtyin" id="np-1" type="password" inputmode="numeric" maxlength="8">
      <div class="lbl">もう一度</div>
      <input class="qtyin" id="np-2" type="password" inputmode="numeric" maxlength="8">
      <div style="margin-top:14px"><button class="bigbtn" id="np-go">決定</button></div>
      <div class="msg" id="np-msg"></div>`);
    dlg.querySelector('#np-go').addEventListener('click', () => {
      const a = dlg.querySelector('#np-1').value, b = dlg.querySelector('#np-2').value, m = dlg.querySelector('#np-msg');
      if (!/^\d{4,8}$/.test(a)) { m.className = 'msg err'; m.textContent = '4〜8桁の数字で入れてください'; return; }
      if (a !== b) { m.className = 'msg err'; m.textContent = '2回の入力が違います'; return; }
      closeDialog();
      cb(a);
    });
  }

  // ─── 商品行ダイアログ (割当・担当者・読み上げ) ───
  /**
   * 商品の画面。**商品 → どの箱に何個** の順で入れる (中原さん 2026-09-23)。
   * いろはでは利用者さんが「商品番号」を言ってから「何番の箱に入れるか」を職員に伝えるルールなので、
   * 先に箱を選ばなくても、この画面で箱を選べる・1 箱目に何個 / 2 箱目に何個 と分けられる。
   * 「いまの箱」があれば、その箱に残り全部が入った状態で開く (これまでどおり 1 回押せば済む)。
   * draft = この画面の入力途中 (「＋ 新しい箱」「⚖ 重さ」「確認した人」で別の画面へ行って戻ったときに消さない)
   */
  function openRowDialog(rowId, draft) {
    const r = S.rows.find(x => x.id === rowId);
    if (!r) return;
    const rem = r.planned_qty - r.placed - (r.shortage_qty || 0);
    // この商品のグループで開いている箱。箱の番号順 (箱に書いた「1箱目・2箱目」と同じ並び)
    const boxes = S.boxes.filter(b => b.pack_group_id === r.pack_group_id && b.status === 'open').sort((a, b) => a.box_no - b.box_no);
    const knownExpiry = expiryOf(r.id);
    const excluded = r.match_state === 'picking_only';   // 添付した Excel (納品プラン) に無い → 入れない
    const mine = (S.placements || []).filter(p => p.row_id === r.id).sort((a, b) => b.id - a.id);   // この商品の記録 (新しい順)
    const boxCodeOf = (id) => (S.boxes.find(b => b.id === id) || {}).box_code || '?';
    const boxClosed = (id) => (S.boxes.find(b => b.id === id) || {}).status === 'closed';
    const unit = unitOf(r.fnsku);                  // 1個の重さ (実測 > 参考)。未登録なら null
    // 確認担当の既定 = いまの作業者。実際に書き込むのはサーバー側 (投入と同じトランザクション。
    // 別POSTだと通信断で欠落し、他端末と競合して上書きし合う — Codex PR2.6-R1)。画面は予告だけ
    const checkDefault = worker ? worker.display_name : '';
    // サーバーが入れるのは「この行に残っている一番古い投入をした人」= まだ1個も入っていない行のときだけ
    // いまの作業者と一致する。既に誰かが入れている行で名前を約束すると嘘になる (Codex PR2.6-R2 medium#2)
    const canAutoCheck = rem > 0 && !excluded;                   // 「入れた」がある = 自動で入る行
    const willAutoCheck = canAutoCheck && r.placed === 0 && !!checkDefault;
    const pp = planParts(r.plan_no);
    // 最初の個数: 入力途中があればそれ / 無ければ「いまの箱」に残り全部 (これまでの 1 箱の入れ方と同じ手数)
    const startQty = (b) => {
      if (draft && draft.split) return draft.split[b.id] != null ? String(draft.split[b.id]) : '';
      return b.id === curBoxId ? String(rem) : '';
    };
    // 行を出す箱 = 数が入っている箱 + 入力途中で出していた箱 (新しくつくった箱は空でも出す — Codex PR #1426 R1 #1:
    // 全部割り振ってあるときに新しい箱をつくると、その箱がボタンの中に隠れ、そのまま押すと前の箱に記録されていた)
    const shown = (b) => startQty(b) !== '' || !!(draft && Array.isArray(draft.show) && draft.show.includes(b.id));
    const startVisibleCount = boxes.filter(shown).length;   // 開いたときに行を出す箱の数
    /**
     * 残りが 0 なのに、入力途中の箱ごとの数が残っている (送る数を減らした直後など)。黙って捨てずに見せる
     * (Codex PR #1426 R2 #2)。送る数を戻せば、その入力のまま開き直る
     */
    const pendingDraftNote = () => {
      const ent = Object.entries((draft && draft.split) || {}).filter(([, v]) => String(v).trim() !== '' && String(v).trim() !== '0');
      if (!ent.length) return '';
      const code = (id) => (S.boxes.find(b => b.id === Number(id)) || {}).box_code || '?';
      return `<div class="warnbox" style="margin-top:8px">⚠ 入れようとしていた数 (${esc(ent.map(([id, v]) => `${code(id)} に ${v}個`).join('・'))}) は、残りが 0 なので記録できません
        <small>箱に入れてあるなら、職員が「送る数を直す」で数を戻してください (この入力のまま開き直します)</small></div>`;
    };
    const dlg = openDialog(`
      <div style="display:flex; gap:14px; align-items:flex-start">
        ${thumbHtml(r, true)}
        <div style="flex:1; min-width:0">
          <div style="font-weight:800; color:#495057">${esc(pp.label)}<span style="font-size:2.2em; color:#B5651D; margin-left:2px">${esc(pp.no)}</span></div>
          <div class="fn" style="font-size:1.2em">${esc(r.fnsku).slice(0, -4)}<b>${esc(fn4(r.fnsku))}</b></div>
          <div class="pname" style="margin:4px 0 8px">${esc(r.product_name || r.seller_sku)}</div>
          <div style="display:flex; gap:8px; flex-wrap:wrap">
            <button class="chip" style="background:#B5651D" id="d-digits">🔊 下4桁を読む</button>
            <button class="chip" style="background:#E9ECEF;color:#495057" id="d-tts">🔊 商品名</button>
            <button class="chip" style="background:${unitOf(r.fnsku) ? '#E9ECEF' : '#FFF4E6'};color:#495057" id="d-weigh">${weighChipLabel(r.fnsku)}</button>
          </div>
        </div>
      </div>
      <div class="grid2">
        <div>予定 <b style="font-size:1.3em">${r.planned_qty}</b></div>
        <div>残り <b style="font-size:1.3em; color:${rem > 0 ? '#C92A2A' : '#2B8A3E'}">${excluded ? '—' : rem}</b></div>
      </div>
      ${draft && draft.notStored ? `<div class="warnbox" style="margin-top:8px">⚠ 前に押した分は、まだ記録していません (この端末に控えを保存できませんでした)
          <small>箱の中身を確かめて「入れた」を押すまで、この画面を閉じたり読み込み直したりしないでください</small></div>` : ''}
      ${excluded ? `<div class="msg err">この商品は納品プラン (Excel) に無いので箱に入れません。${r.placed > 0 ? `すでに ${r.placed} 個入っています — 職員が取り消してください。` : ''}本社に確認してください</div>` : ''}
      ${rem > 0 && !excluded ? `
        <div class="lbl">📦 どの箱に何個</div>
        <!-- ふだんは「いまの箱」の 1 行だけ。ほかの箱は「＋ 別の箱にも入れる」を押したときだけ小さく並べる
             (中原さん 2026-09-23: 箱が増えると、箱を全部並べる作りでは かなり下までスクロールする) -->
        <div id="d-splits">${boxes.map(b => splitRowHtml(b, r, !shown(b))).join('')}</div>
        <button class="selbtn${startVisibleCount === 0 ? ' hidden' : ''}" id="d-otherbox" style="width:100%">＋ 別の箱にも入れる (分けるとき)</button>
        <div id="d-boxpick" class="${startVisibleCount === 0 ? '' : 'hidden'}" style="margin-top:6px">
          ${startVisibleCount === 0 ? `<div class="warnbox" style="margin-bottom:8px">入れた箱をえらんでください<small>「いまの箱」が決まっていません。押した箱に残り全部が入ります</small></div>` : ''}
          ${boxes.length ? `<div class="grid3">${boxes.map(b => `<button class="selbtn boxchip${shown(b) ? ' hidden' : ''}" data-box="${b.id}">${esc(b.box_code)}<br><small style="font-weight:600; color:#868E96">${matShort(b) ? esc(matShort(b)) + ' ・ ' : ''}いま ${b.total_qty}個</small></button>`).join('')}</div>`
            : '<div class="msg" style="color:#868E96">このグループに開いている箱がありません</div>'}
          <button class="selbtn boxnew" style="width:100%; margin-top:8px">＋ 新しい箱をつくる</button>
        </div>
        <div class="splitsum" id="d-splitsum"></div>
        <div class="qtyw" id="d-weight"></div>
        ${packBlockHtml(r)}
        <div class="lbl">置いた場所 (この箱で・わかれば)</div>
        <div class="grid3">
          <button class="selbtn layer" data-v="bottom">⬇ 下</button>
          <button class="selbtn layer" data-v="middle">↔ 中</button>
          <button class="selbtn layer" data-v="top">⬆ 上</button>
        </div>
        <div class="msg hidden" id="d-laynote" style="color:#868E96">箱を 2 つ以上に分けたときは、置いた場所は記録しません</div>
        ${expiryBlockHtml(r, knownExpiry)}
      ` : (excluded ? '' : `${pendingDraftNote()}<div class="msg" style="color:#2B8A3E; font-weight:700">この商品は入力が終わっています</div>${packBlockHtml(r)}`)}
      ${mine.length > 0 ? `
        <div class="lbl">📝 この商品の記録 (間違えたら「数を直す」)</div>
        <div style="background:#F8F9FA; border-radius:10px; padding:6px 10px">
          ${mine.map(p => `<div style="display:flex; justify-content:space-between; align-items:center; gap:8px; padding:6px 0; border-bottom:1px solid #E9ECEF">
            <span><b>${esc(boxCodeOf(p.box_id))}</b> に <b style="font-size:1.2em">${p.qty}</b>個 <small style="color:#868E96">${esc(hhmm(p.created_at))} ${esc(p.worker_name || '')}${boxClosed(p.box_id) ? ' / 箱は閉じ済み' : ''}</small></span>
            <span style="white-space:nowrap"><button class="selbtn adj" data-id="${p.id}" data-qty="${p.qty}" style="padding:6px 10px">数を直す</button>
              <button class="selbtn rvk" data-id="${p.id}" style="padding:6px 10px">取消</button></span>
          </div>`).join('')}
        </div>` : ''}
      <div class="lbl">👤 確認した人</div>
      <button class="selbtn ${r.check_worker ? 'on' : ''}" id="d-cw" style="width:100%">${r.check_worker
        ? `✅ ${esc(r.check_worker)}`
        : (willAutoCheck
          ? `${esc(checkDefault)} <small style="font-weight:600; color:#868E96">(「入れた」を押すと、この人で記録します・タップで変更)</small>`
          : (canAutoCheck && checkDefault
            ? `— <small style="font-weight:600; color:#868E96">(「入れた」を押すと、最初に入れた人で記録します・タップで指名)</small>`
            : `— <small style="font-weight:600; color:#C92A2A">${checkDefault
              ? 'まだ記録されていません。タップして選んでください'
              : '上の「👤 作業者を選ぶ」から選んでください'}</small>`))}</button>
      <div class="lbl">⚠ 困ったとき (職員)</div>
      <div class="grid3">
        <button class="selbtn" id="d-sendqty">${r.shortage_qty ? `送る数 ${r.planned_qty - r.shortage_qty} を直す` : '送る数を直す'}</button>
        <button class="selbtn" id="d-short">数が足りない</button>
        <button class="selbtn" id="d-close">閉じる</button>
      </div>
      ${r.shortage_qty ? `<div class="msg" style="color:#C92A2A">予定 ${r.planned_qty} → 送る数 ${r.planned_qty - r.shortage_qty}${r.shortage_reason ? ' (' + esc(REASON_JA[r.shortage_reason] || r.shortage_reason) + ')' : ''}</div>` : ''}
      ${rem > 0 && !excluded
        // 「入れた」は画面の下に貼り付ける (中原さん 2026-09-23: 積み方・置いた場所・期限などの下にあってスクロールが要った)。
        // 送信中・エラーの文言も同じ帯に置く (押したボタンのすぐ上で見える)
        ? `<div class="addbar"><div class="msg" id="d-msg"></div><button class="bigbtn" id="d-add" disabled>入れた</button></div>`
        : '<div class="msg" id="d-msg"></div>'}`);

    // ── どの箱に何個 ──
    const splitEls = [...dlg.querySelectorAll('.splitrow')];
    const qtyIn = (el) => el.querySelector('.qtyin');
    /**
     * 箱に打った数。空欄 = 0 / 整数 (全角数字も) / それ以外 (6.5・文字) = 不正 (NaN)。
     * 🚨 不正を 0 にして黙って外すと、打った箱の分が抜けたまま残りだけ記録される (Codex PR #1421 R1 #3)
     */
    const parseQty = (v) => {
      const t = String(v || '').replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).trim();
      if (t === '') return 0;
      return /^\d{1,6}$/.test(t) ? Number(t) : NaN;
    };
    const rawOf = (el) => parseQty(qtyIn(el).value);
    const valOf = (el) => { const n = rawOf(el); return Number.isFinite(n) ? n : 0; };
    const badOf = (el) => !Number.isFinite(rawOf(el));
    const setVal = (el, n) => { qtyIn(el).value = n > 0 ? String(n) : ''; };
    /** 箱に入れる個数 (0 の箱は含めない)。並びは画面の順 = 箱の番号順 */
    const readSplits = () => splitEls.map(el => ({ boxId: Number(el.dataset.box), qty: valOf(el) })).filter(s => s.qty > 0);
    // 送信中は数を触らせない・「入れた」を生き返らせない (Codex PR #1421 R1 #4: 送信中に数を変えて押し直すと
    // 送信キューが「さらに入れましたか」を出し、1 回目の完了と食い違う)
    let sending = false;
    // 積み方 (土台/重い/通常) を保存しているあいだは「入れた」を押せない。保存の結果 (失敗) をこの画面で見てから入れる
    // (Codex PR #1428 R2: 先に投入が終わって画面が閉じると、積み方の失敗が伝わらない・トーストの「元に戻す」を消す)
    let packSaving = false;
    const setSending = (v) => {
      sending = v;
      // 🚨 画面の中のボタン・入力を全部塞ぎ、背景タップでも閉じない。⚖ や「確認した人」へ移れると、
      //    送信の完了が移った先の画面を閉じて、そこでの入力が消える (Codex PR #1426 R1 #2 = master から)
      dialogLocked = v;
      dlg.querySelectorAll('button, input, select').forEach(x => { x.disabled = v; });
      if (v) hideToast();   // 画面の外の「元に戻す」からも別の画面へ移れないように (R2 #1)
      if (!v) syncSplits();   // 戻すときは、数の条件で押せない ＋ − や「入れた」を数え直す
    };
    dlg._setSending = setSending;   // handlePlaceOutcome が失敗したときに戻す
    const others = (el) => splitEls.filter(x => x !== el).reduce((a, x) => a + valOf(x), 0);
    splitEls.forEach(el => { qtyIn(el).value = startQty({ id: Number(el.dataset.box) }); });   // 打った文字のまま (不正な値も赤で残す)

    let layer = null;
    const layerBtns = [...dlg.querySelectorAll('.layer')];
    const setLayer = (v) => { layer = v; layerBtns.forEach(x => x.classList.toggle('on', x.dataset.v === v)); };
    layerBtns.forEach(b => b.addEventListener('click', () => {
      if (b.disabled) return;
      setLayer(b.classList.contains('on') ? null : b.dataset.v);
    }));

    function syncSplits() {
      const sp = readSplits();
      const sum = sp.reduce((a, s) => a + s.qty, 0);
      const bad = splitEls.filter(badOf);
      splitEls.forEach(el => {
        const v = valOf(el);
        el.classList.toggle('on', v > 0);
        qtyIn(el).style.borderColor = badOf(el) ? '#E03131' : '';
        if (sending) return;
        el.querySelector('[data-d="-1"]').disabled = !(v > 0);
        el.querySelector('[data-d="1"]').disabled = !(v + others(el) < rem);
      });
      const sumEl = dlg.querySelector('#d-splitsum');
      if (sumEl) {
        sumEl.classList.toggle('bad', sum > rem || bad.length > 0);
        sumEl.innerHTML = bad.length > 0
          ? `⚠ ${bad.map(el => esc(el.querySelector('.sb b').textContent)).join('・')} の個数が数字になっていません (1 個単位の数字で入れてください)`
          : sum === 0
          ? `どの箱に何個入れたかを入れてください (残り ${rem} 個)`
          : (sum > rem
            ? `⚠ 合計 ${sum} 個 — 残り ${rem} 個を超えています`
            : `合計 <b style="font-size:1.2em">${sum}</b> 個 / 残り ${rem} 個${sum < rem ? ` (あと ${rem - sum} 個)` : ' ✓ 全部'}`);
      }
      const wEl = dlg.querySelector('#d-weight');
      if (wEl) {
        wEl.innerHTML = !unit
          ? '<span style="color:#B5651D">⚖ 1個の重さが未登録です — 上の「⚖ 重さを登録」から登録できます</span>'
          : (sum > 0
            ? `⚖ 1個 ${fmtG(unit.unitG)}${unit.source === 'measured' ? ' (実測)' : ' (参考)'} × ${sum}個 = <b style="font-size:1.15em">${fmtG(unit.unitG * sum)}</b>`
            : `⚖ 1個 ${fmtG(unit.unitG)}${unit.source === 'measured' ? ' (実測)' : ' (参考)'}`);
      }
      // 置いた場所 (下/中/上) は「この箱で」の記録。箱を分けたら、どの箱の話か決まらないので記録しない
      const multi = sp.length > 1;
      layerBtns.forEach(x => { x.disabled = multi; });
      if (multi && layer) setLayer(null);
      dlg.querySelector('#d-laynote')?.classList.toggle('hidden', !multi);
      const add = dlg.querySelector('#d-add');
      if (add) {
        add.disabled = sending || packSaving || sum <= 0 || sum > rem || bad.length > 0;
        if (sending) return;
        add.textContent = packSaving ? '積み方を保存しています…' : bad.length > 0 ? '個数を数字で入れてください' : sum <= 0 ? '先に「どの箱に何個」を入れてください'
          : (sp.length === 1 ? `${boxCodeOf(sp[0].boxId)} に ${sum}個 入れた` : `${sp.length}箱に 合計 ${sum}個 入れた`);
      }
    }
    splitEls.forEach(el => {
      const inp = qtyIn(el);
      el.querySelectorAll('.stepbtn').forEach(btn => btn.addEventListener('click', () => {
        if (sending) return;
        const next = valOf(el) + Number(btn.dataset.d);
        setVal(el, Math.max(0, Math.min(rem - others(el), next)));
        syncSplits();
      }));
      // 箱の名前を押す = まだどの箱にも割り振っていない残りを、この箱に足す。
      // もう全部割り振ってあれば、全部をこの箱へ移す (「いまの箱」に残り全部が入った状態で別の箱を押したとき)。
      // 🚨 0 に戻す動きは持たせない (押すたびに入ったり消えたりすると、何が起きたか分からない — Codex PR #1421 R1 #5)。減らすのは − か数字
      el.querySelector('.sb').addEventListener('click', () => {
        if (sending) return;
        const free = rem - others(el) - valOf(el);
        const holders = splitEls.filter(x => x !== el && valOf(x) > 0);
        if (free > 0) setVal(el, valOf(el) + free);
        // 「いまの箱」に残り全部が入った状態で別の箱を押した = その箱へ移したい。
        // 🚨 2 つ以上に分けてあるときは移さない (分けた数を黙って消すと、実物と違う箱別の数で記録される — Codex PR #1421 R2 #4)
        else if (valOf(el) === 0 && holders.length === 1 && valOf(holders[0]) === rem) { setVal(holders[0], 0); setVal(el, rem); }
        else {
          const m = dlg.querySelector('#d-msg');
          if (m) { m.className = 'msg'; m.textContent = 'もう全部の箱に割り振ってあります。数を変えるときは − ＋ か数字で直してください'; }
        }
        syncSplits();
      });
      inp.addEventListener('input', syncSplits);
      // 🚨 打った数は丸めない (ほかの箱と合わせて残りを超えたときに 0 や上限へ勝手に直すと、打った数が消えて見える)。
      //    超えていれば合計の行を赤くして「入れた」を押せなくするだけ。整数でない・マイナスだけ直す
      inp.addEventListener('change', () => { if (!badOf(el)) setVal(el, valOf(el)); syncSplits(); });   // 不正な値は消さずに赤く残す
      inp.addEventListener('focus', () => inp.select());
    });

    /** 入力途中を持ち出す (別の画面へ行って戻ったときに、入れた個数・期限・置いた場所を消さない) */
    const readDraft = () => {
      // 箱の入力欄が無い画面 (残り 0) では、持ってきた入力途中をそのまま持ち回る (R2 #2: 送る数を戻したら復元できるように)
      if (splitEls.length === 0 && draft) return draft;
      const split = {};
      // 🚨 打った文字のまま持ち出す。数に直してから持つと「6.5」が 0 になって消え、戻った画面で残りだけ送れてしまう (Codex PR #1421 R2 #3)
      splitEls.forEach(el => { const t = qtyIn(el).value.trim(); if (t !== '' && t !== '0') split[el.dataset.box] = t; });
      const show = splitEls.filter(el => !el.classList.contains('hidden')).map(el => Number(el.dataset.box));
      const sel = (id) => { const x = dlg.querySelector(id); return x ? x.value : ''; };
      const wrap = dlg.querySelector('#d-expwrap');
      return { split, show, layer, ey: sel('#d-ey'), em: sel('#d-em'), ed: sel('#d-ed'), expOpen: !!(wrap && !wrap.hidden),
        unsentId: (draft && draft.unsentId) || null, notStored: !!(draft && draft.notStored) };
    };
    dlg._readDraft = readDraft;   // 前の記録の失敗を見せたあと、この入力のまま開き直すため (handlePlaceOutcome)
    // ↩ 戻ってきたとき: 置いた場所・期限の選択も戻す
    if (draft) {
      if (draft.layer) setLayer(draft.layer);
      const put = (id, v) => { const x = dlg.querySelector(id); if (x && v) x.value = v; };
      put('#d-ey', draft.ey); put('#d-em', draft.em); put('#d-ed', draft.ed);
      if (draft.expOpen && dlg.querySelector('#d-expwrap')) {
        dlg.querySelector('#d-expwrap').hidden = false;
        const ob = dlg.querySelector('#d-expopen'); if (ob) ob.hidden = true;
      }
    }
    syncSplits();

    // 「＋ 別の箱にも入れる」→ ほかの箱を小さく並べる。押した箱の行を出し、まだ割り振っていない残りを入れる
    dlg.querySelector('#d-otherbox')?.addEventListener('click', () => {
      dlg.querySelector('#d-boxpick').classList.toggle('hidden');
    });
    dlg.querySelectorAll('.boxchip').forEach(chip => chip.addEventListener('click', () => {
      if (sending) return;
      const el = splitEls.find(x => x.dataset.box === chip.dataset.box);
      if (!el) return;
      const free = rem - splitEls.reduce((a, x) => a + valOf(x), 0);
      el.classList.remove('hidden');
      chip.classList.add('hidden');
      if (free > 0) setVal(el, valOf(el) + free);
      dlg.querySelector('#d-boxpick').classList.add('hidden');
      dlg.querySelector('#d-otherbox').classList.remove('hidden');
      syncSplits();
      if (free <= 0) qtyIn(el).focus();   // 残りが無い = 何個かは人が決める
    }));
    dlg.querySelector('.boxnew')?.addEventListener('click', () => {
      const dr = readDraft();
      closeDialog();
      // つくった箱には、まだどの箱にも割り振っていない残りを入れておく (1 箱目に 12・残りは新しい箱に、が 1 回で済む)
      newBoxDialog(async (newBoxId) => {
        const used = Object.values(dr.split).reduce((a, v) => { const n = parseQty(v); return a + (Number.isFinite(n) ? n : 0); }, 0);
        if (newBoxId && rem - used > 0) dr.split[newBoxId] = rem - used;
        if (newBoxId) dr.show = [...(dr.show || []), newBoxId];   // 残りが無くても、つくった箱の行は出す (箱の名前を押せば全部移せる)
        await refresh(true);   // つくった箱を画面の状態に入れてから開き直す (古い状態のままだと新しい箱が出ない)
        if (!dialogOpen) openRowDialog(rowId, dr);   // refresh が未確認の記録を出していたら上書きしない
      });
    });
    // 期限管理商品ではない商品の「＋ この商品にも賞味期限を入れる」(判定が違っていても現場で入れられる逃げ道)
    dlg.querySelector('#d-expopen')?.addEventListener('click', (ev) => {
      ev.currentTarget.hidden = true;
      dlg.querySelector('#d-expwrap').hidden = false;
    });
    dlg.querySelector('#d-tts').addEventListener('click', () => speak(`${shortName(r.product_name)}。${Math.max(0, rem)}個`));
    dlg.querySelector('#d-digits').addEventListener('click', () => speakDigits(r));
    dlg.querySelector('#d-weigh').addEventListener('click', () => { const dr = readDraft(); closeDialog(); weighDialog(r, () => openRowDialog(rowId, dr)); });
    // 積み方 (土台 / 重い / 通常): 押した瞬間に保存 (投入の送信キューとは別の API。投入を送らなくても残る)。
    // 選択中のボタンをもう一度押すと未設定に戻す。ただし「重さから自動」の重いを押したときは手動の重いに固定する
    // (自動を外すのは「通常」— 未設定に戻しても自動で重いに戻るだけなので)
    dlg.querySelectorAll('.pack').forEach(btn => btn.addEventListener('click', async () => {
      if (!worker) { pickWorker(); return; }
      const msg = dlg.querySelector('#d-packmsg');
      if (!online) { msg.innerHTML = '<span style="color:#C92A2A; font-weight:700">通信できないため変更できません</span>'; return; }
      const p = packOf(r.fnsku);
      const isOn = btn.classList.contains('on');
      const next = (isOn && p && p.source !== 'weight') ? null : btn.dataset.v;
      dlg.querySelectorAll('.pack').forEach(x => { x.disabled = true; });
      packSaving = true; syncSplits();
      let j;
      try { j = await apiPost('/api/packing-class', { fnsku: r.fnsku, class: next, run_id: curRunId, worker_id: worker.id }); }
      catch { j = { ok: false, message: '通信できませんでした。もう一度押してください' }; }
      // 「入れた」の送信中なら押せないまま (送信中の塞ぎを積み方の返事で解かない — Codex PR #1428 R1 #2)
      dlg.querySelectorAll('.pack').forEach(x => { x.disabled = sending; });
      packSaving = false; if (dlg.isConnected) syncSplits();
      if (!j.ok) {
        // 返事が来る前に画面が閉じていたら (入れた が先に終わった)、閉じた画面に書いても見えない → トーストで知らせる
        if (!dlg.isConnected) {
          const note = `📦 積み方を保存できませんでした: ${j.message || ''} (商品の画面からもう一度選んでください)`;
          // 「記録しました / 元に戻す」が出ていれば、上書きせずに書き足す (元に戻すを消さない — Codex PR #1428 R3)
          const span = document.querySelector('#toast-root .toast span');
          if (document.getElementById('undo') && span) span.insertAdjacentHTML('beforeend', `<br><small>${esc(note)}</small>`);
          else showNoteToast(note);
          return;
        }
        msg.innerHTML = `<span style="color:#C92A2A; font-weight:700">${esc(j.message || '保存できませんでした')}</span>`; return;
      }
      if (S && S.packing && j.effective) S.packing[String(r.fnsku).toUpperCase()] = j.effective;   // 次の refresh で同じ値が来る
      const cur = j.effective && j.effective.cls;
      dlg.querySelectorAll('.pack').forEach(x => x.classList.toggle('on', x.dataset.v === cur));
      msg.innerHTML = packStatusText(r.fnsku);
    }));
    dlg.querySelector('#d-close').addEventListener('click', () => {
      // 控えを保存できていない分がある = この画面を閉じると、どこにも残らない (Codex PR #1424 R3 #3)
      if (draft && draft.notStored && !confirm('前に押した分は、まだ記録していません (端末にも控えていません)。記録せずに閉じますか?')) return;
      closeDialog();
    });
    dlg.querySelector('#d-cw').addEventListener('click', () => { const dr = readDraft(); pickCheckWorker(r, () => openRowDialog(rowId, dr)); });
    dlg.querySelector('#d-short').addEventListener('click', () => shortageDialog(r));
    dlg.querySelector('#d-sendqty').addEventListener('click', () => sendQtyDialog(r, readDraft()));   // 戻ったとき箱ごとの数を消さない (R1 #3)
    // 記録の修正・取消 = 入力ミスの訂正なので PIN は要らない (中原さん 9/3)。閉じた箱のときだけ量り直しを案内
    dlg.querySelectorAll('.adj').forEach(btn => btn.addEventListener('click', () => adjustDialog(r, Number(btn.dataset.id), Number(btn.dataset.qty))));
    dlg.querySelectorAll('.rvk').forEach(btn => btn.addEventListener('click', async () => {
      if (!worker) { pickWorker(); return; }
      if (!confirm('この記録を取り消しますか?')) return;
      const j2 = await apiPost(`/api/placements/${btn.dataset.id}/revoke`, { worker_id: worker.id });
      if (!j2.ok) alert(j2.message);
      else if (j2.boxReopened) alert('閉じていた箱の中身を直したので、箱をあけました。もう一度読み合わせて、重さを量って閉じてください');
      await refresh(true);
      if (!dialogOpen) openRowDialog(rowId);   // refresh が未確認の記録を出していたら上書きしない
    }));
    dlg.querySelector('#d-add')?.addEventListener('click', async () => {
      const msg = dlg.querySelector('#d-msg');
      if (!worker) { msg.className = 'msg err'; msg.textContent = '先に作業者を選んでください'; pickWorker(); return; }
      // 通信断のときは新規入力を止める (要件 §5-7)。ただし送れていない記録が残っているときは、
      // 押し直し = 再送なので通す (online イベントが来ない障害から抜けられなくなる — PQ-R2 medium#1)
      if (!online && !placeQueue.peek()) { msg.className = 'msg err'; msg.textContent = '通信できないため入力できません'; return; }
      if (sending || packSaving) return;
      if (splitEls.some(badOf)) { msg.className = 'msg err'; msg.textContent = '個数が数字になっていない箱があります'; return; }
      const splits = readSplits();
      const sum = splits.reduce((a, s) => a + s.qty, 0);
      if (sum <= 0) { msg.className = 'msg err'; msg.textContent = 'どの箱に何個入れたかを入れてください'; return; }
      if (sum > rem) { msg.className = 'msg err'; msg.textContent = `合計 ${sum} 個は残り ${rem} 個を超えています`; return; }
      let expiry = knownExpiry ? null : readExpiry(dlg);
      if (expiry === false) { msg.className = 'msg err'; msg.textContent = '期限は 年・月 まで選んでください (日は任意)'; return; }
      setSending(true);
      dlg.querySelector('#d-add').disabled = true;
      msg.className = 'msg'; msg.textContent = '送信中…';
      // meta = あとで結果を見せるときに要る情報 (裏で送り直して確定したときはダイアログが無い)
      // 控えから開いた画面で、**控えと同じ箱・同じ数**で押したときだけ控えの印を付ける (記録できたら控えを消す)。
      // 🚨 箱や数を変えて押した = 控えの分とは別の投入かもしれない → 控えは残し、人に決めてもらう (Codex PR #1424 R3 #1)
      const stash = unsentNow.get();
      const sameAsStash = !!(stash && draft && draft.unsentId === stash.id
        && JSON.stringify(bodySplits(stash.body).map(x => [x.boxId, x.qty])) === JSON.stringify(splits.map(x => [x.boxId, x.qty])));
      const meta = { productName: r.product_name || r.seller_sku, checkDefault, hadCheckWorker: !!r.check_worker,
        unsentId: sameAsStash ? stash.id : null };
      const out = await sendPlacement({ rowId: r.id, splits, layer: splits.length > 1 ? null : layer, expiry, meta });
      await handlePlaceOutcome(out, { dlg, msg, row: r });
    });
  }

  /**
   * 商品の画面の「箱 1 つ分」の行: [箱の名前・サイズ・いまの個数・推定] [−] [個数] [＋]。
   * 推定の見せ方は要件 §7 のまま (重量不明があれば必ず添える。「あと約N個」は重さが全部そろったときだけ)
   */
  function splitRowHtml(b, r, hidden) {
    return `<div class="splitrow${hidden ? ' hidden' : ''}" data-box="${b.id}">
        <div class="sb"><b>${esc(b.box_code)}</b>${b.id === curBoxId ? ' <span class="badge exp">いまの箱</span>' : ''}
          <br><small>${matShort(b) ? esc(matShort(b)) + ' ・ ' : ''}いま ${b.total_qty}個</small>
          <div class="sbest">${splitHint(b, r)}</div></div>
        <button class="stepbtn" data-d="-1" aria-label="1個へらす">−</button>
        <input class="qtyin" type="tel" inputmode="numeric" placeholder="0" aria-label="${esc(b.box_code)} に入れる個数">
        <button class="stepbtn" data-d="1" aria-label="1個ふやす">＋</button>
      </div>`;
  }
  function splitHint(box, row) {
    const e = box.est;
    if (!e || !(e.estG > 0)) return '';
    const w = unitOf(row.fnsku);
    const L = limits();
    if (e.estG > L.limitG) return `<span style="color:#C92A2A; font-weight:700">🚨 推定 ${estKg(box)}kg — 上限 ${L.limitG / 1000}kg 超え</span>`;
    const n = w ? roomLeft(box, w.unitG) : null;
    if (n === null) return estLabel(box);   // 「あと何個」は重さが全部そろってから (要件 §7)
    if (n <= 0) return `<span style="color:#C92A2A; font-weight:700">⚠ 推定 ${estKg(box)}kg — 目標 ${L.targetG / 1000}kg に達しています</span>`;
    return `${estLabel(box)} <span style="color:#2B8A3E">・あと約 ${n} 個</span>`;
  }

  /** 送った中身 (1 箱 = box_id + qty / 分けた = splits) を同じ形 [{boxId, qty}] にそろえる */
  function bodySplits(body) {
    if (body && Array.isArray(body.splits)) return body.splits.map(s => ({ boxId: Number(s.box_id), qty: Number(s.qty) }));
    return [{ boxId: Number(body && body.box_id), qty: Number(body && body.qty) }];
  }
  const bodyQty = (body) => bodySplits(body).reduce((a, s) => a + (s.qty || 0), 0);
  const boxCodeById = (id) => (((S && S.boxes) || []).find(b => b.id === id) || {}).box_code || '?';
  /** 「G1-1」/ 分けたときは「G1-1 に 12個・G1-2 に 5個」 */
  function bodyWhere(body) {
    const sp = bodySplits(body);
    return sp.length === 1 ? boxCodeById(sp[0].boxId) : sp.map(s => `${boxCodeById(s.boxId)} に ${s.qty}個`).join('・');
  }
  /** 記録できた投入の ID (分けたときは箱の数だけ) */
  function placementIdsOf(j) {
    if (j && Array.isArray(j.placements) && j.placements.length) return j.placements.map(p => p.placementId);
    return j && j.placementId ? [j.placementId] : [];
  }
  /**
   * 取り消す (分けた投入は全部)。分けた分は **1 回の POST・1 トランザクション** = 全部戻るか、1 つも戻らない
   * (1 件ずつだと途中で通信が切れたとき一部だけ戻る — Codex PR #1421 R1 #1)。取消済みは成功扱いなので押し直してよい。
   * unknown = 返事が来ない・5xx・本文が落ちた = 戻ったかどうか分からない
   */
  /**
   * 返事の来ていない「元に戻す」の控え。**取り消す記録の組ごと**に持つ (1 つの入れ物を上書きすると、
   * 別の納品回の取消が前の回の控えを消す — Codex PR #1421 R3 #1)。{ [key]: {ids, what, runId} }
   */
  const UNDO_KEY = 'fbx_pending_undo';
  const undoKeyOf = (ids) => ids.map(Number).sort((a, b) => a - b).join(',');
  const pendingUndo = {
    all() { try { const v = JSON.parse(localStorage.getItem(UNDO_KEY) || '{}'); return v && typeof v === 'object' && !Array.isArray(v) ? v : {}; } catch { return {}; } },
    /** 保存して読み直す。保存できなければ false (呼び出し側は送らない) */
    add(ids, what, runId) {
      const k = undoKeyOf(ids);
      try {
        const m = this.all(); m[k] = { ids, what: what || '', runId };
        localStorage.setItem(UNDO_KEY, JSON.stringify(m));
        return !!this.all()[k];
      } catch { return false; }
    },
    remove(ids) {
      try { const m = this.all(); delete m[undoKeyOf(ids)]; localStorage.setItem(UNDO_KEY, JSON.stringify(m)); } catch { /* noop */ }
    },
    firstFor(runId) { return Object.values(this.all()).find(p => p && Array.isArray(p.ids) && p.ids.length && p.runId === runId) || null; },
  };
  /**
   * 🚨 取り消す前に「何を取り消すか」を端末に残す。返事の前に通信が切れて画面を読み込み直しても、
   *    同じ記録をもう一度取り消せる (Codex PR #1421 R2 #1)。通れば消す。取り消せないと確定した (4xx) ときも消す。
   *    🚨 控えを保存できない端末では送らない (送ったあとに通信が切れると、取り消したかどうか追えなくなる — R3 #3)
   */
  async function revokeAll(ids, what) {
    if (!pendingUndo.add(ids, what, curRunId)) {
      return { ok: false, unknown: false, message: 'この端末に控えを保存できないため、取り消しを送りませんでした (プライベートモードになっていませんか)。職員を呼んでください' };
    }
    const r = await revokeAllOnce(ids);
    if (r.ok || !r.unknown) pendingUndo.remove(ids);
    return r;
  }
  /**
   * 「前の記録が登録できなかった」ときに、いま押した分 (まだ送っていない) の控え。1 件だけ持つ。
   * 送信キューとは別 (キューに入れると自動で送られる。前の分が入っていないので、人が箱を確かめてから押す)
   */
  const UNSENT_KEY = 'fbx_unsent_now';
  const unsentNow = {
    get() { try { const v = JSON.parse(localStorage.getItem(UNSENT_KEY) || 'null'); return v && v.id && v.body && v.rowId ? v : null; } catch { return null; } },
    /** 保存して読み直す。保存できなければ null (呼び出し側が「控えられていない」と見せる — Codex PR #1424 R2 #3) */
    set(v) {
      const id = (crypto.randomUUID ? crypto.randomUUID() : Date.now() + '-' + Math.random().toString(36).slice(2));
      try { localStorage.setItem(UNSENT_KEY, JSON.stringify(Object.assign({ id, at: Date.now() }, v))); } catch { return null; }
      const back = this.get();
      return back && back.id === id ? id : null;
    },
    clear() { try { localStorage.removeItem(UNSENT_KEY); } catch { /* noop */ } },
    /**
     * 🚨 消すのは「**この控えから押した操作**が記録できた」と分かったときだけ (Codex PR #1424 R2 #1・#2)。
     *    同じ商品の別の投入が通っただけで消すと、控えていた分が追えなくなる。
     *    裏で送り直して確定した結果 (showLeftoverPlacement・askPlacedAgain) でも同じように消す
     */
    settle(rec) {
      const v = this.get();
      if (v && rec && rec.result && rec.result.ok === true && rec.meta && rec.meta.unsentId === v.id) this.clear();
    },
  };
  /** 前の画面で「まだ記録していない」と見せた分が残っている → 開き直せる画面を出す (読み込み直し・ページが捨てられたあと) */
  function showUnsentNow() {
    const v = unsentNow.get();
    if (!v || dialogOpen || v.runId !== curRunId || placeQueue.peek()) return false;
    const row = S && S.rows.find(r => r.id === v.rowId);
    const dlg = openDialog(`
      <h2>⚠ まだ記録していない分があります</h2>
      <div class="pname">${esc(shortName((v.meta && v.meta.productName) || 'この商品'))} <b style="font-size:1.2em">${bodyQty(v.body)}</b>個 → ${esc(bodyWhere(v.body))}</div>
      <div class="msg err">前の画面で「入れた」を押しましたが、前の記録が登録できなかったため、この分はまだ送っていません。
        <small style="display:block; font-weight:600">箱の中身を確かめて、入れてあれば商品の画面から「入れた」を押してください</small></div>
      ${row ? '<div style="margin-top:12px"><button class="bigbtn" id="un-open">この商品の画面を開く (入力はそのまま)</button></div>' : '<div class="msg err">この商品は一覧にありません (画面を更新してください)</div>'}
      <div style="margin-top:8px"><button class="bigbtn sub" id="un-drop">箱には入れていない・もう記録した (この控えを消す)</button></div>`, { sticky: true });
    dlg.querySelector('#un-open')?.addEventListener('click', () => { closeDialog(); openRowDialog(v.rowId, Object.assign({}, v.draft || {}, { unsentId: v.id })); });
    dlg.querySelector('#un-drop').addEventListener('click', () => {
      if (!confirm('この控えを消してよいですか? (箱に入れてあって、まだ記録していないなら「この商品の画面を開く」から記録してください)')) return;
      unsentNow.clear(); closeDialog();
    });
    return true;
  }
  /** 前の画面で「元に戻す」の返事が来ないままだった → 押し直せる画面を出す (回を開いたとき・更新のたび)。いま開いている回の分だけ */
  function showPendingUndo() {
    const p = pendingUndo.firstFor(curRunId);
    if (!p || dialogOpen) return false;
    showUndoFailed(p.ids, { ok: false, unknown: true, message: '前の画面で「元に戻す」を押しましたが、返事が届いていません' }, p.what);
    return true;
  }
  async function revokeAllOnce(ids) {
    try {
      const j = ids.length === 1
        ? await apiPost(`/api/placements/${ids[0]}/revoke`, { worker_id: worker && worker.id })
        : await apiPost('/api/placements/revoke-batch', { worker_id: worker && worker.id, placement_ids: ids });
      if (j.ok) return { ok: true, boxReopened: !!j.boxReopened };
      return { ok: false, unknown: j.error === 'no_body' || j._status >= 500, message: j.message || '' };
    } catch { return { ok: false, unknown: true, message: '通信できませんでした' }; }
  }
  /** 「元に戻す」が通らなかった。トーストは消えているので、押し直せる画面を出す (押し直しても二重には取り消さない) */
  function showUndoFailed(ids, res, what) {
    const dlg = openDialog(`
      <h2>${res.unknown ? '❓ 取り消せたか分かりません' : '⚠ 取り消せませんでした'}</h2>
      <div class="pname">${esc(what || '')}</div>
      <div class="msg err">${esc(res.message || '')}${res.unknown ? '<br>通信が戻ってから「もう一度取り消す」を押してください (押し直しても二重には取り消しません)' : '<br>職員を呼んでください'}</div>
      <div style="margin-top:12px"><button class="bigbtn" id="uf-retry">もう一度取り消す</button></div>
      <div style="margin-top:8px"><button class="bigbtn sub" id="uf-close">閉じる (取り消さない)</button></div>

  /**
   * 投入の結果をさばく。
   * confirm = 前の1件が確定・成功していて同じ商品 → 押し直しか本当の2回目か決められないので人に聞く
   * (Codex PR2.6-R5 high#1・#4 / PQ-R1 high#1・medium#2)。

  async function handlePlaceOutcome(out, ctx) {
    const dlg = ctx && ctx.dlg, msg = ctx && ctx.msg;
    const reenable = () => {
      if (dlg && dlg._setSending) { dlg._setSending(false); return; }   // 商品の画面: 数の入力ごと戻す (数の条件も見直す)
      const b = dlg && dlg.querySelector('#d-add'); if (b) b.disabled = false;
    };
    const err = (t) => {
      if (msg) { msg.className = 'msg err'; msg.textContent = t; } else { alert(t); }
      reenable();
    };
    switch (out.kind) {
      case 'blocked':
        setOnline(false, failKind());
        return err(failKind() === 'server'
          ? '前回の記録がまだ送れていません。サーバーの更新が終わってから、もう一度押してください'
          : '前回の記録がまだ送れていません。電波が戻ってからもう一度押してください');
      case 'storage_failed':
        return err('この端末では記録を安全に保存できません (プライベートモードになっていませんか)。職員を呼んでください');
      case 'conflict':
        refresh(true);
        return err('別の画面で操作されました。画面を更新してからもう一度押してください');
      case 'broken':
        reenable();

      case 'previousFailed': {

        // まず失敗を見せて、押し直してもらう。
        // 🚨 いま押した分の入力を捨てない (Codex PR #1421 R1 #6 = master から): 失敗の画面で商品の画面が置き換わり、
        //    「わかりました」で閉じると、いま箱に入れた分がどこにも残らなかった。
        //    → 「いま押した分はまだ記録していない」と見せ、閉じたら**同じ入力のまま**商品の画面に戻す (自動では送らない)
        reenable();
        const row = ctx && ctx.row;
        const draft = dlg && dlg._readDraft ? dlg._readDraft() : null;   // 画面が置き換わる前に持ち出す
        // 🚨 端末にも控える。この画面のあいだに読み込み直し・iPad がページを捨てても、「まだ記録していない分」を
        //    追えるように (Codex PR #1424 R1 #1)。送信キューの 1 件にすると自動で送られてしまうので、別の控え
        const unsentId = unsentNow.set({ runId: curRunId, rowId: row ? row.id : out.body.row_id, draft, body: out.body, meta: out.meta });
        const dr = Object.assign({}, draft || {}, { unsentId: unsentId || null, notStored: !unsentId });
        return showLeftoverPlacement(out.prev, null,
          row ? async () => { if (!dialogOpen) openRowDialog(row.id, dr); } : null,
          { pendingNow: { body: out.body, meta: out.meta }, reopens: !!row, notStored: !unsentId });
      }
      case 'showFirst':
        // 別の商品の見せそびれ。見せてから、ack と今回分の保存を**1回の操作で**やる
        // (間で落ちると今回の現物投入がどこにも残らない — PQ-R2 high#5)
        reenable();

      return err(failKind() === 'server'
        ? 'サーバーを更新しています。この記録は端末に残っていて、戻ると自動で送られます (二重には登録されません)'
        : '通信できませんでした。この記録は電波が戻ると自動で送り直します (二重には登録されません)');

      await placeQueue.ack(rec.requestId);

    const sp = bodySplits(rec.body);
    const lastBox = sp[sp.length - 1] && sp[sp.length - 1].boxId;
    if (lastBox && ((S && S.boxes) || []).some(b => b.id === lastBox && b.status === 'open')) setCurBox(lastBox);

    if (!dlg || $('#ovl-root .dlg') === dlg) closeDialog();

    showUndoToast(placementIdsOf(j), { product_name: rec.meta && rec.meta.productName }, bodyQty(rec.body), checkWorkerNoteOf(rec, j), sp.length > 1 ? bodyWhere(rec.body) : '');
  }

  function range(a, b) { const out = []; for (let i = a; i <= b; i++) out.push(i); return out; }

   * 使い続ける (Codex PR1 #6: 手動リトライで新しい id を発行すると二重登録になる)
   */
  /**
   * 割当POSTの「確定した応答」判定: アプリが返した構造化JSON (ok フィールドあり) かつ 5xx でない
   * ときだけ確定とみなす。プロキシの502や解釈不能な応答は「サーバーが処理したか不明」なので
   * pending を保持し、同じ request_id で再送する (Codex PR1-R2 #2)

    // 打ち切っても「サーバーが処理したか不明」= 未確定として扱うので、同じ request_id で送り直せる
    const ac = typeof AbortController === 'function' ? new AbortController() : null;
    const timer = ac ? setTimeout(() => ac.abort(), 20000) : null;

    lastPostKind = 'net';

        method: 'POST', headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify(body), signal: ac ? ac.signal : undefined,
      });
    } finally { if (timer) clearTimeout(timer); }
    let j = null;
    try { j = await r.json(); } catch { /* JSONでない = アプリ応答でない */ }
    if (r.status >= 500 || !j || typeof j.ok !== 'boolean') {

      if (r.status >= 500) lastPostKind = 'server';

    }
    j._status = r.status;
    return j;

    const loMsg = dlg.querySelector('#lo-msg');
    const busy = (v) => dlg.querySelectorAll('button').forEach(b => { b.disabled = v; });
    // next があるときは、ack と「いま押した分の保存」を1回の操作で行う (PQ-R2 high#5)
    const done = async () => {
      busy(true);
      try {
        if (next) {
          unsentNow.settle(rec);
          const again = await withSaving(() => placeQueue.ackAndSend({ ackRequestId: rec.requestId, body: next.body, meta: next.meta }));
          // 置き換えられなかった = いま箱に入れた分がまだどこにも残っていない → 閉じない
          if (again.kind === 'storage_failed' || again.kind === 'conflict' || again.kind === 'broken') {
            loMsg.className = 'msg err';
            loMsg.textContent = again.kind === 'storage_failed'
              ? 'この端末に保存できませんでした。職員を呼んでください (箱には追加しないでください)'
              : '別の画面で操作されたため、いま記録できませんでした。少し待ってもう一度押してください';
            return;
          }
          closeDialog();
          if (after) await after(again);
          return;
        }
        unsentNow.settle(rec);   // 裏で送り直して確定した分が、控えから押したものなら控えを消す (R2 #1)
        const a = await placeQueue.ack(rec.requestId);
        if (!a.ok && a.reason === 'storage_failed') {
          loMsg.className = 'msg err';
          loMsg.textContent = 'この端末に保存できませんでした。職員を呼んでください (画面を再読み込みすると、この記録がもう一度出ます)';
          return;
        }
        closeDialog();
        if (after) await after();
      } finally { busy(false); }
    };
    dlg.querySelector('#lo-ok').addEventListener('click', done);
    dlg.querySelector('#lo-undo')?.addEventListener('click', async () => {
      busy(true);
      try {
        // 分けて入れた記録は全部戻す。1 つでも戻せなければ、ここで止めて知らせる (押し直せば残りを戻す)
        const j2 = await revokeAll(placementIdsOf(j), `${shortName(name, 20)} ${bodyQty(rec.body)}個`);
        if (!j2.ok) {
          loMsg.className = 'msg err';
          loMsg.textContent = (j2.message || '戻せませんでした') + (j2.unknown ? ' — 戻せたか分かりません。通信を確かめて、もう一度押してください (二重には取り消しません)' : '');
          return;
        }
      } catch (e) {
        loMsg.className = 'msg err';
        loMsg.textContent = '通信できませんでした。電波を確かめて、もう一度押してください';
        return;
      } finally { busy(false); }
      await done();
    });
  }
  /** 予告した名前と実際に入った名前がずれたときだけ知らせる (R3 medium#1 / R4 medium#2) */
  function checkWorkerNoteOf(rec, j) {
    const expected = rec.meta?.checkDefault;
    if (rec.meta?.hadCheckWorker || !j.checkWorker || j.checkWorker === expected) return null;
    return { name: j.checkWorker, auto: j.checkWorkerSource === 'auto' };
  }
  /** 送れていなかった記録が「登録できなかった」と確定した = 現物と記録がずれている。必ず人に見せる */
  function notePendingFailed(j) {
    alert(`⚠ 前に送れていなかった記録が、登録できませんでした。

${j.message || ''}

箱の中身と画面の数を見くらべて、足りなければ入れ直してください (職員を呼んでください)`);
  }
  /** 投入を送る。戻り値は place-queue の outcome (done / blocked / confirm) をそのまま返す */
  /**
   * splits = [{boxId, qty}]。箱が 1 つなら、いままでと同じ形 (box_id + qty) で送る —
   * サーバーも送信キューの送り直しも、1 箱の投入はこれまでとまったく同じに扱う。
   * 2 つ以上は splits で 1 回に送る (サーバーが 1 トランザクションで全部入れるか、1 つも入れない)
   */
  async function sendPlacement({ rowId, splits, layer, expiry, meta }) {
    const where = splits.length === 1
      ? { box_id: splits[0].boxId, qty: splits[0].qty }
      : { splits: splits.map(s => ({ box_id: s.boxId, qty: s.qty })) };
    const body = Object.assign({ run_id: curRunId, row_id: rowId }, where, {
      layer: layer || null, expiry: expiry || null, worker_id: worker.id,
    });
    showSaving(true);
    try { return await placeQueue.send({ body, meta }); } finally { showSaving(false); }
  }
  function showSaving(v) { $('#savebar').classList.toggle('hidden', !v); }

  /**
   * トーストは 1 枚しか出ない (同じ入れ物を使い回す) ので、タイマーも 1 本にする。
   * 🚨 関数ごとに setTimeout を持つと、前の消えるタイマーが次のトーストを
   *    早すぎるうちに消す (Codex PR #1299 R3 P2)
   */
  let toastTimer = null;
  function showToast(html, ms) {
    if (toastTimer) clearTimeout(toastTimer);
    $('#toast-root').innerHTML = html;
    toastTimer = setTimeout(() => { toastTimer = null; $('#toast-root').innerHTML = ''; }, ms);
  }
  function hideToast() {
    if (toastTimer) { clearTimeout(toastTimer); toastTimer = null; }
    $('#toast-root').innerHTML = '';
  }

  function showUndoToast(placementIds, row, qty, checkWorkerNote, where) {
    showToast(`<div class="toast">
      <span>✅ ${esc(shortName(row.product_name, 14))} を ${qty}個 記録しました${where ? `<br><small>${esc(where)}</small>` : ''}${checkWorkerNote
        ? `<br><small>👤 確認した人は${checkWorkerNote.auto ? '先に入れた ' : ''}<b>${esc(checkWorkerNote.name)}</b> さんで記録されています</small>` : ''}</span>
      <button id="undo">元に戻す</button></div>`, 8000);
    $('#undo').addEventListener('click', async () => {
      hideToast();
      const j = await revokeAll(placementIds, `${shortName(row.product_name, 20)} ${qty}個${where ? ' (' + where + ')' : ''}`);
      if (!j.ok) { showUndoFailed(placementIds, j, `${shortName(row.product_name, 20)} ${qty}個${where ? ' (' + where + ')' : ''}`); return; }
      if (j.boxReopened) alert('閉じていた箱の中身を直したので、箱をあけました。もう一度読み合わせて、重さを量って閉じてください');
      refresh(true);
    });
  }

  /**
   * 止めない知らせ。⚖ 推定との差のように「参考になるが、作業を止めるほどではない」もの。
   * 🚨 モーダル (alert) で出すと、当てにならない推定のために現場が止まる (中原さん 2026-09-10)
   */
  function showNoteToast(text) {
    showToast(`<div class="toast"><span>${esc(text)}</span><button id="note-x">閉じる</button></div>`, 12000);
    $('#note-x').addEventListener('click', hideToast);
  }

  function setCurBox(id) { curBoxId = id; LS.set('curbox_' + curRunId, id); }

  // ─── 箱 ───
  /**
   * ⚖ 商品の重さ (中原さん要望「何個で何g」)。軽い商品を1個ずつ量ると誤差が大きいので、
   * まとめて量って個数で割る。登録すると、その商品を含む箱の推定重量が実測で計算し直される
   */
  async function weighDialog(r, after) {
    const w0 = unitOf(r.fnsku);
    const dlg = openDialog(`
      <h2>⚖ 重さを量る</h2>
      <div style="display:flex; gap:12px; align-items:flex-start">
        ${thumbHtml(r, false)}
        <div style="flex:1; min-width:0">
          <div class="pname">${esc(r.product_name || r.seller_sku)}</div>
          <div class="fn" style="font-size:1em">${esc(r.fnsku).slice(0, -4)}<b>${esc(fn4(r.fnsku))}</b></div>
        </div>
      </div>
      <div style="margin:10px 0; background:#F8F9FA; border-radius:10px; padding:10px">
        いま使っている1個あたり: <b style="font-size:1.2em">${w0 ? fmtG(w0.unitG) : '未登録'}</b>
        <small style="color:#868E96; display:block">${w0
          ? (w0.source === 'measured' ? `実測 (${w0.sampleQty}個をまとめて量った値)` : 'Amazon の参考値 — 10g 単位なので粗いです。量ると精度が上がります')
          : 'Amazon に重さの登録がありません。量ってもらえると箱の推定重量が出せます'}</small>
      </div>
      <div class="lbl">① はかりに のせた個数</div>
      <input class="qtyin" id="w-n" type="tel" inputmode="numeric" value="10">
      <div class="lbl">② はかりの数字 (g) — 商品だけをのせる (トレーを使うなら 0 合わせ)</div>
      <input class="qtyin" id="w-g" type="text" inputmode="decimal" placeholder="例: 205">
      <div style="text-align:center; margin:12px 0; font-size:1.15em; min-height:1.4em" id="w-calc"></div>
      <button class="bigbtn green" id="w-go">この重さで登録</button>
      <div class="msg" id="w-msg"></div>
      <div class="lbl">📝 これまでの記録</div>
      <div id="w-hist" style="color:#868E96">読み込み中…</div>`);
    const nIn = dlg.querySelector('#w-n'), gIn = dlg.querySelector('#w-g'), calc = dlg.querySelector('#w-calc');
    const unit = () => {
      const n = parseInt(nIn.value, 10), g = parseFloat(gIn.value);
      return (Number.isInteger(n) && n >= 1 && Number.isFinite(g) && g > 0) ? g / n : null;
    };
    const showCalc = () => { const u = unit(); calc.innerHTML = u ? `→ 1個あたり <b>${fmtG(Math.round(u * 10) / 10)}</b>` : ''; };
    nIn.addEventListener('input', showCalc); gIn.addEventListener('input', showCalc);
    showCalc();
    const loadHist = async () => {
      const j = await apiGet('/api/weights?fnsku=' + encodeURIComponent(r.fnsku));
      const box = dlg.querySelector('#w-hist');
      if (!j.ok) { box.textContent = '読み込めませんでした'; return; }
      if (!j.measurements.length) { box.textContent = 'まだありません'; return; }
      box.innerHTML = j.measurements.map(m => `
        <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; padding:6px 0; border-bottom:1px solid #E9ECEF; ${m.revoked_at ? 'opacity:0.5; text-decoration:line-through' : ''}">
          <span>${m.sample_qty}個で ${fmtG(m.total_g)} → <b>1個 ${fmtG(m.unit_g)}</b>
            <small style="color:#868E96">${esc(String(m.measured_at || '').slice(5, 16).replace('T', ' '))} ${esc(m.worker_name || '')}</small></span>
          ${m.revoked_at ? '' : `<button class="selbtn wrvk" data-id="${m.id}" style="padding:6px 10px">取消</button>`}
        </div>`).join('');
      box.querySelectorAll('.wrvk').forEach(btn => btn.addEventListener('click', async () => {
        if (!worker) { pickWorker(); return; }
        if (!confirm('この重さの記録を取り消しますか?')) return;
        const send = (auth) => apiPost(`/api/weights/${btn.dataset.id}/revoke`,
          { worker_id: worker.id, run_id: curRunId, ...(auth ? { as_staff: true, auth_worker_id: auth.staff.id, auth_pin: auth.pin } : {}) });
        const j2 = await send(null);
        if (!j2.ok) {
          // 前の納品回で登録した重さ = 全部の回に効くので職員の確認が要る
          if (j2.error === 'staff_required') {
            alert(j2.message);
            staffPinPrompt(async (staff, pin) => {
              const j3 = await send({ staff, pin });
              if (!j3.ok) { alert(j3.message); return; }
              await refresh(true);
              weighDialog(r, after);
            });
            return;
          }
          alert(j2.message); return;
        }
        await refresh(true);
        loadHist();
      }));
    };
    loadHist();
    dlg.querySelector('#w-go').addEventListener('click', async () => {
      if (!worker) { pickWorker(); return; }
      const msg = dlg.querySelector('#w-msg');
      const n = parseInt(nIn.value, 10), g = parseFloat(gIn.value);
      if (!Number.isInteger(n) || n < 1) { msg.className = 'msg err'; msg.textContent = 'のせた個数を入れてください'; return; }
      if (!Number.isFinite(g) || g <= 0) { msg.className = 'msg err'; msg.textContent = 'はかりの数字 (g) を入れてください'; return; }
      const j = await apiPost('/api/weights', { fnsku: r.fnsku, sample_qty: n, total_g: g, run_id: curRunId, worker_id: worker.id });
      if (!j.ok) { msg.className = 'msg err'; msg.textContent = j.message; return; }
      await refresh(true);
      closeDialog();
      if (after) after();
    });
  }

  function newBoxDialog(after) {

      </div>
      <div class="lbl">緩衝材 (プチプチ・紙)</div>
      <div class="grid3">
        <button class="selbtn cshn" data-v="none">なし</button>
        <button class="selbtn cshn" data-v="little">少し</button>
        <button class="selbtn cshn" data-v="much">多い</button>
      </div>
      <!-- 実測が上限 (Amazon の受入条件) を超えたときだけ出す。ブラウザの confirm は iPad で
           小さく出て見落とすので、画面の中に大きなボタンで置く (中原さん 2026-09-10) -->
      <div id="c-over" class="hidden" style="margin-top:14px; background:#FFF5F5; border:2px solid #E03131; border-radius:12px; padding:12px">
        <div id="c-over-t" style="font-weight:800; color:#C92A2A"></div>
        <div style="margin-top:10px"><button class="bigbtn red" id="c-over-go">🚨 30kg を超えたまま閉じる</button></div>
        <div style="margin-top:8px"><button class="bigbtn sub" id="c-over-no">中身を分ける (閉じない)</button></div>
      </div>
      <div style="margin-top:16px"><button class="bigbtn green" id="c-go">この箱の封を閉じる (確定)</button></div>
      <!-- 押し間違えたときの戻り道。箱が確定する画面なので出口を画面に出しておく -->
      <div style="margin-top:8px"><button class="bigbtn sub" id="c-cancel">やめる (まだ閉じない)</button></div>
      <div class="msg" id="c-msg"></div>`);
    dlg.querySelector('#c-cancel')?.addEventListener('click', () => closeDialog());
    // 読み合わせで数の違いに気づいたら、ここから直す (いろは 2026-09-23)。直したら箱の画面に戻って、読み合わせからやり直す
    dlg.querySelectorAll('.cadj').forEach(btn => btn.addEventListener('click', () => {
      if (dialogLocked) return;   // 閉じる送信中は触らせない
      const row = (S.rows || []).find(x => x.id === Number(btn.dataset.row));
      if (!row) { alert('この商品が一覧にありません。画面を更新してください'); return; }
      adjustDialog(row, Number(btn.dataset.id), Number(btn.dataset.qty), {
        boxCode: b.box_code, placement: contents.find(p => p.id === Number(btn.dataset.id)) || null,
        after: async () => { await refresh(true); if (!dialogOpen) openBoxDialog(b.id); },
      });
    }));
    /** 上限超え: 「分ける」か「このまま閉じる」かを画面の中で選んでもらう (二段階。PIN は要らない) */
    const showOverLimit = (message) => {
      dlg.querySelector('#c-over-t').textContent = message;
      dlg.querySelector('#c-over').classList.remove('hidden');
      dlg.querySelector('#c-go').classList.add('hidden');   // 確定ボタンと二択にしない
      dlg.querySelector('#c-msg').textContent = '';
    };
    dlg.querySelector('#c-over-no')?.addEventListener('click', () => {
      dlg.querySelector('#c-over').classList.add('hidden');
      dlg.querySelector('#c-go').classList.remove('hidden');
    });
    dlg.querySelector('#c-over-go')?.addEventListener('click', () => {
      if (!worker) { pickWorker(); return; }
      send(true);   // override = 上限を承知で閉じる。決めた人 (いまの作業者) がサーバに残る
    });
    /**
     * 送信中は出口 (確定・やめる・上限超えの2ボタン・背景タップ) を全部塞ぐ。
     * 🚨 /close は投げたら取り消せない。返事を待つ間に「やめる」を押せると、
     *    サーバでは箱が閉じているのに現場は「やめたから未封」と思い込む
     *    (Codex PR #1299 R1 — 「やめる」を足したこの PR が作った穴)。
     * 🚨 押せるボタンを 1 つでも数え漏らすと、そこから /close が同時に何本も飛び、
     *    片方の応答で塞ぎが解けて もう片方の送信中に出口が生き返る (R4 P2)。
     *    だから ①ボタンは配列で一括 ②sending で送信そのものも止める の二重にする
     */
    const SENDING = '送信中… そのままお待ちください';
    const BUSY_BTNS = ['#c-go', '#c-cancel', '#c-over-go', '#c-over-no'];
    let sending = false;
    const setBusy = (on) => {
      sending = on;
      dialogLocked = on;
      for (const sel of BUSY_BTNS) { const b = dlg.querySelector(sel); if (b) b.disabled = on; }
      const m = dlg.querySelector('#c-msg');
      if (m) {
        if (on) { m.className = 'msg'; m.textContent = SENDING; }
        else if (m.textContent === SENDING) m.textContent = '';   // 圏外で失敗しても「送信中」を残さない
      }
    };
    /**
     * 送ったのに結果が分からないとき。「やめる (まだ閉じない)」は嘘になりうるので言い換える。
     * ここで画面から出られなくすると現場が詰むので、出口は残す (ただし箱の状態は約束しない)
     */
    const markUnknown = (text) => {
      sending = false;
      dialogLocked = false;
      for (const sel of BUSY_BTNS) { const b = dlg.querySelector(sel); if (b) b.disabled = false; }
      const cancel = dlg.querySelector('#c-cancel'), m = dlg.querySelector('#c-msg');
      if (cancel) cancel.textContent = '画面を閉じる (箱の状態は職員に確認)';
      if (m) { m.className = 'msg err'; m.textContent = text; }
    };
    let reason = null, cushion = null;
    const pick = (cls, cb) => dlg.querySelectorAll(cls).forEach(x => x.addEventListener('click', () => {
      dlg.querySelectorAll(cls).forEach(y => y.classList.remove('on'));
      x.classList.add('on'); cb(x.dataset.v);
    }));
    pick('.crsn', v => reason = v);
    pick('.cshn', v => cushion = v);
    // 入力しながら目標・上限に当てて知らせる (閉じる前に気づけるように)
    const kgIn = dlg.querySelector('#c-kg'), wmsg = dlg.querySelector('#c-wmsg');
    kgIn.addEventListener('input', () => {
      const kg = parseFloat(kgIn.value), L = limits();
      if (!Number.isFinite(kg) || kg <= 0) { wmsg.textContent = ''; return; }
      const g = kg * 1000;
      if (g > L.limitG) { wmsg.style.color = '#C92A2A'; wmsg.innerHTML = `🚨 上限 ${L.limitG / 1000}kg 超え — 中身を分けてください (確定を押すと、このまま閉じるか選べます)`; }
      else if (g > L.targetG) { wmsg.style.color = '#B5651D'; wmsg.innerHTML = `⚠ 目標 ${L.targetG / 1000}kg を超えています (上限 ${L.limitG / 1000}kg まではこのまま閉じられます)`; }
      else { wmsg.style.color = '#2B8A3E'; wmsg.textContent = '✓ 重さは問題ありません'; }
    });
    /** 送信。override = 上限 30kg を超えたまま閉じる (二段階の2回目。PIN は要らない) */
    const send = async (override) => {
      if (sending) return;   // 連打・押し忘れの塞ぎ漏れでも /close は 1 本しか飛ばさない (R4 P2)
      const msg = dlg.querySelector('#c-msg');
      const showErr = (m) => { msg.className = 'msg err'; msg.textContent = m; };
      const kg = parseFloat(kgIn.value);
      if (!Number.isFinite(kg) || kg <= 0) { showErr('はかりの重さ (kg) を入れてください'); return; }
      // このダイアログは送信のあいだ出たままなので、ボタンを塞げばよい
      // (以前は職員PINの画面でダイアログが外れていたため「送信中」の板が要った)
      const startBusy = () => setBusy(true);
      const endBusy = () => setBusy(false);
      /**
       * 🚨 送ったのに結果が分からないときの後始末。閉じたのか閉じていないのか分からないので、
       *    黙って「やめる (まだ閉じない)」に戻さない。まずサーバに聞き直す (Codex PR #1299 R2 P1)。
       *    返事が丸ごと来ない場合と、本文だけ落ちた場合の両方がここに来る (R3 P1)
       */
      const lostReply = async () => {
        const after = await boxStatusNow(b.id);
        endBusy();
        if (after === 'closed') {   // 返事は届かなかったが、記録は残っていた
          if (curBoxId === b.id) { curBoxId = null; LS.set('curbox_' + curRunId, null); }
          closeDialog();
          alert(`✅ ${b.box_code} は閉じました (返事は届きませんでしたが、記録は残っています)`);
          return;
        }
        if (after === 'open') { showErr('送れませんでした (通信が切れました)。この箱はまだ閉じていません。もう一度押してください'); return; }
        const unknown = '❓ 送れたかどうか分かりません。通信が戻ってから、もう一度「この箱の封を閉じる (確定)」を押してください (すでに閉じていれば その旨が出ます)';
        markUnknown(unknown);
      };
      let j;
      startBusy();
      try {
        j = await apiPost(`/api/boxes/${b.id}/close`, {
          worker_id: worker.id, measured_kg: kg, closed_reason: reason, cushion_level: cushion,
          content_version: contentVersion,
          ...(override ? { override: true } : {}),
        });
      } catch {
        await lostReply();
        return;
      }
      if (j.error === 'no_body') { await lostReply(); return; }   // 本文だけ落ちた = 閉じたかどうか分からない
      endBusy();
      if (!j.ok) {
        if (j.error === 'box_changed') {   // 他の iPad で中身が直された → 読み合わせからやり直す
          closeDialog();
          alert(j.message);
          openBoxDialog(b.id);
          return;
        }
        if (j.error === 'over_limit') {    // 上限超え = 実測が Amazon の受入条件を超えた (要件 §7)
          showOverLimit(j.message);
          return;
        }
        showErr(j.message); return;
      }
      if (curBoxId === b.id) { curBoxId = null; LS.set('curbox_' + curRunId, null); }
      closeDialog();
      // 推定と大きく違うときだけ知らせる。🚨 モーダルにしない —
      // 推定は登録済みの単重からの目安で、単重は余裕のあるときしか量っていない。
      // 当てにならない数字で作業を止めるのが一番よくない (中原さん 2026-09-10)
      if (j.hint) showNoteToast(`⚖ ${j.hint.message}`);
    };
    dlg.querySelector('#c-go').addEventListener('click', () => {
      if (!worker) { pickWorker(); return; }
      send(false);
    });
  }

  // ─── 職員PIN (staffList 省略時は state の作業者から。名簿画面は /api/roster の一覧を渡す) ───

    const dlg = openDialog(`
      <h2>🔑 職員の確認</h2>

      <div class="grid3">${staff.map(w => `<button class="selbtn stf" data-id="${w.id}">${esc(w.display_name)}</button>`).join('')}</div>

      <input class="qtyin" id="p-pin" type="password" inputmode="numeric" maxlength="8">

  // ─── 確認した人 (行) ─── ※ラベル貼り担当の記録は廃止 (中原さん 9/6)。既定はいまの作業者
  function pickCheckWorker(row, onDone) {
    const dlg = openDialog(`
      <h2>👤 確認した人</h2>
      <div class="grid3" style="margin-top:12px">
        ${workers.map(w => `<button class="wbtn rw" data-name="${esc(w.display_name)}">${esc(w.display_name)}</button>`).join('')}
        <button class="wbtn rw" data-name="">— 消す —</button>
      </div>`);
    dlg.querySelectorAll('.rw').forEach(b => b.addEventListener('click', async () => {
      if (!worker) { pickWorker(); return; }
      // intent=manual = 「人が画面で選んだ」印。これが無い更新はサーバーが弾く (旧画面の自動POST対策)
      const j = await apiPost(`/api/rows/${row.id}/workers`, { worker_id: worker.id, check_worker: b.dataset.name || null, check_worker_intent: 'manual' });
      if (!j.ok) { alert(j.message); return; }
      closeDialog();
      await refresh(true);
      if (onDone) onDone();
    }));

  // ─── 記録の数を直す (間違えて押したとき): 取消 + 入れ直しを 1 回で ───
  /** opts.after = 直したあとの戻り先 (既定 = 商品の画面) / opts.boxCode = どの箱の記録か (見出しに出す) */
  function adjustDialog(row, placementId, currentQty, opts) {
    if (!worker) { pickWorker(); return; }
    const pp = planParts(row.plan_no);
    const rem = row.planned_qty - row.placed - (row.shortage_qty || 0);
    // 箱の中身・読み合わせから来たときは、その画面が出していた記録そのもの (opts.placement) を使う。
    // S.placements は少し古いことがあり、別の iPad が入れた直後の記録だと見つからない・置いた場所が食い違う (Codex PR #1430 R2 #1)
    const pl = (opts && opts.placement) || (S.placements || []).find(p => p.id === placementId) || null;
    const boxCode = (opts && opts.boxCode) || (pl ? boxCodeById(pl.box_id) : '');
    // 同じ箱に同じ商品の記録が 2 つあると、商品名と数だけでは見分けられない → 置いた場所・時刻・入れた人を出す (Codex PR #1430 R1 #2)
    const LAYJA = { bottom: '下', middle: '中', top: '上' };
    const plInfo = pl ? [hhmm(pl.created_at), pl.worker_name || '', pl.placement_layer ? '置いた場所 ' + LAYJA[pl.placement_layer] : ''].filter(Boolean).join(' ・ ') : '';
    const dlg = openDialog(`
      <h2>✏ 数を直す</h2>
      <div style="font-weight:800; color:#495057">${esc(pp.label)}<span style="font-size:1.6em; color:#B5651D; margin-left:2px">${esc(pp.no)}</span></div>
      <div class="pname">${esc(shortName(row.product_name))}${boxCode ? ` — <b>${esc(boxCode)}</b> の記録` : ''} <b style="font-size:1.3em">${currentQty}</b>個</div>
      ${plInfo ? `<div class="msg" style="color:#495057; margin-top:0">記録: ${esc(plInfo)}</div>` : ''}
      <div class="msg" style="color:#868E96; margin-top:0">予定 ${row.planned_qty} / 入れた ${row.placed}${row.shortage_qty ? ` / 送らない ${row.shortage_qty}` : ''} → この記録は <b>${currentQty + Math.max(0, rem)}</b> 個まで増やせます</div>
      <div class="lbl">正しい個数 (0 = この記録を取り消す)</div>
      <input class="qtyin" id="a-qty" type="tel" inputmode="numeric" value="${currentQty}">
      <div style="margin-top:14px"><button class="bigbtn" id="a-go">この数に直す</button></div>
      <div class="msg" id="a-msg"></div>`);
    // 操作ID は「同じ数を押し直すあいだ」使い続ける。返事が落ちて押し直したとき、サーバーは同じ修正として
    // 前の結果を返す (二重に直さない)。数を変えたら新しい ID (Codex PR #1421 R1 #7: 以前は押すたびに新しい ID だった)
    let requestId = null, sentQty = null, busy = false;
    dlg.querySelector('#a-go').addEventListener('click', async (ev) => {
      if (busy) return;
      const msg = dlg.querySelector('#a-msg');
      // 🚨 空欄を 0 (= 取消) にしない。書き換えの途中で押すと記録が消える (Codex PR #1430 R1 #4)。全角の数字は受け付ける
      const raw = dlg.querySelector('#a-qty').value.replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).trim();
      if (!/^\d{1,6}$/.test(raw)) { msg.className = 'msg err'; msg.textContent = raw === '' ? '個数を入れてください (取り消すときは 0)' : '0 以上の整数で入れてください'; return; }
      const qty = Number(raw);
      if (!requestId || sentQty !== qty) {
        requestId = (crypto.randomUUID ? crypto.randomUUID() : Date.now() + '-' + Math.random().toString(36).slice(2));
        sentQty = qty;
      }
      // 🚨 ボタンは await の前に掴んでおく (ev.currentTarget は await のあとで null になる)
      const goBtn = ev.currentTarget;
      // 送信中は背景タップでも閉じない。閉じて別の画面を開くと、遅れて来た返事がその画面を閉じてしまう (Codex PR #1430 R1 #3)
      busy = true; goBtn.disabled = true; dialogLocked = true;
      msg.className = 'msg'; msg.textContent = '送信中…';
      let j;
      try { j = await apiPost(`/api/placements/${placementId}/adjust`, { worker_id: worker.id, qty, request_id: requestId }); }
      catch { j = { ok: false, error: 'no_body' }; }
      busy = false; goBtn.disabled = false;
      const mine = $('#ovl-root .dlg') === dlg;
      if (mine) dialogLocked = false;
      if (!j.ok && (j.error === 'no_body' || j._status >= 500)) {
        msg.className = 'msg err';
        msg.textContent = '返事が届きませんでした。通信が戻ってから、同じ数のままもう一度押してください (二重には直りません)';
        return;
      }
      // 予定を超える: サーバーの文は「取り消してから入れ直す」途中の数 (入力済み 0 など) で分かりにくいので、この画面の言葉で言い直す
      // 上限はサーバーが返した**今の**数で出す (画面を開いたあとに別の iPad が入れていると、開いた時点の数は古い — Codex PR #1430 R1 #1)。
      // placed はこの記録を取り消したあとの数
      if (!j.ok && j.error === 'over_qty') {
        const max = Number.isFinite(j.plannedQty) && Number.isFinite(j.placed) ? Math.max(0, j.plannedQty - (j.shortage || 0) - j.placed) : currentQty + Math.max(0, rem);
        msg.className = 'msg err'; msg.textContent = `この記録は ${max} 個までにしか直せません (予定を超えます)`; return;
      }
      if (!j.ok) { msg.className = 'msg err'; msg.textContent = j.message || '直せませんでした'; return; }
      if (j.boxReopened) alert('閉じていた箱の中身を直したので、箱をあけました。もう一度読み合わせて、重さを量って閉じてください');
      if (!mine) { showNoteToast(`✏ ${shortName(row.product_name, 14)} の数を ${qty}個 に直しました`); return; }   // 別の画面に替わっていたら、その画面は閉じない
      closeDialog();
      if (opts && opts.after) { await opts.after(); return; }
      await refresh(true); openRowDialog(row.id);
    });
  }

  // ─── 送る数の修正 (職員): 棚の在庫が予定より少ないとき等。予定 → 送る数 と理由を記録 ───

        <div class="grid3">
          <div>予定 <b style="font-size:1.3em">${row.planned_qty}</b></div>
          <div>入れた <b style="font-size:1.3em">${row.placed}</b></div>
          <div>今の送る数 <b style="font-size:1.3em">${current}</b></div>

        <div class="lbl">送る数 (実際に納品する個数)</div>
        <input class="qtyin" id="q-qty" type="tel" inputmode="numeric" value="${current}">

        <div class="grid3">
          ${[['stock_short', '在庫が少ない'], ['damaged', '破損'], ['not_shipped', '今回は納品しない'], ['hq_order', '本社指示'], ['other', 'その他']]
            .map(([v, ja]) => `<button class="selbtn qrsn ${(row.shortage_reason || 'stock_short') === v ? 'on' : ''}" data-v="${v}">${ja}</button>`).join('')}
        </div>
        <div class="msg" style="color:#868E96">予定に戻すときは送る数に予定の数 (${row.planned_qty}) を入れてください。本社の画面には「予定 → 送る数」と理由が出ます</div>
        <div style="margin-top:14px"><button class="bigbtn" id="q-go">この数で送る</button></div>
        <div class="msg" id="q-msg"></div>`);
      let reason = ['stock_short', 'damaged', 'not_shipped', 'hq_order', 'other'].includes(row.shortage_reason) ? row.shortage_reason : 'stock_short';
      dlg.querySelectorAll('.qrsn').forEach(b => b.addEventListener('click', () => {
        dlg.querySelectorAll('.qrsn').forEach(x => x.classList.remove('on'));

      }));

        if (!j.ok) { msg.className = 'msg err'; msg.textContent = j.message; return; }
        dialogOpen = false; $('#ovl-root').innerHTML = '';
        // 商品の画面に戻る (一覧に落とさない)。入力途中の箱ごとの数はそのまま — 送る数が減って残りを超えたら赤く出る
        await refresh(true); if (!dialogOpen) openRowDialog(row.id, draft || null);
      });
    });
  }

  // ─── 不足 (職員) ───
  function shortageDialog(row) {
    staffPinPrompt(async (staffWorker, pin) => {
      if (row.shortage_qty) {
        if (confirm(`不足${row.shortage_qty} の記録を消しますか? (現物が見つかったとき)`)) {
          const j = await apiPost(`/api/rows/${row.id}/shortage`, { worker_id: staffWorker.id, pin, clear: true });
          if (!j.ok) alert(j.message);
          await refresh(true);   // 解除結果をすぐ画面に反映 (Codex PR1 #10)
        }
        return;
      }
      const rem = row.planned_qty - row.placed;
      const dlg = openDialog(`
        <h2>⚠ 数が足りない (職員)</h2>
        <div class="pname">${esc(shortName(row.product_name))} — 残り ${rem} 個のうち、足りない個数と理由</div>
        <div class="lbl">足りない個数</div>
        <input class="qtyin" id="s-qty" type="tel" inputmode="numeric" value="${rem}">
        <div class="lbl">理由</div>
        <div class="grid3">
          <button class="selbtn srsn" data-v="missing">現物がない</button>
          <button class="selbtn srsn" data-v="damaged">破損</button>
          <button class="selbtn srsn" data-v="bad_label">ラベル不良</button>
          <button class="selbtn srsn" data-v="wrong_item">商品違い</button>
          <button class="selbtn srsn" data-v="expiry_issue">期限が合わない</button>
          <button class="selbtn srsn" data-v="not_shipped">今回は納品しない</button>
          <button class="selbtn srsn" data-v="other">その他</button>
        </div>
        <div style="margin-top:14px"><button class="bigbtn red" id="s-go">不足として確定</button></div>
        <div class="msg" id="s-msg"></div>`);
      let reason = null;
      dlg.querySelectorAll('.srsn').forEach(b => b.addEventListener('click', () => {
        dlg.querySelectorAll('.srsn').forEach(x => x.classList.remove('on'));
        b.classList.add('on'); reason = b.dataset.v;
      }));
      dlg.querySelector('#s-go').addEventListener('click', async () => {
        const msg = dlg.querySelector('#s-msg');
        if (!reason) { msg.className = 'msg err'; msg.textContent = '理由を選んでください'; return; }
        const j = await apiPost(`/api/rows/${row.id}/shortage`, {
          worker_id: staffWorker.id, pin, qty: Number(dlg.querySelector('#s-qty').value), reason,
        });
        if (!j.ok) { msg.className = 'msg err'; msg.textContent = j.message; return; }
        closeDialog();
      });
    });
  }

  // ─── 初期化 ───
  $('#btn-back').addEventListener('click', backToRuns);
  $('#btn-worker').addEventListener('click', pickWorker);
  $('#btn-roster').addEventListener('click', () => rosterDialog());
  $('#btn-summary').addEventListener('click', () => summaryDialog());
  $('#btn-newbox').addEventListener('click', () => newBoxDialog());
  // 番号で探す: 打つたびに絞る / Enter (キーボードの「開く」) で、その番号の商品を開く / × で全部に戻す
  $('#find').addEventListener('input', () => { if (S) { render(); window.scrollTo(0, 0); } });
  $('#findform').addEventListener('submit', (e) => {
    e.preventDefault();
    if (!S) return;
    const q = findQuery();
    const all = S.rows.filter(r => r.pack_group_id === curGroupId && r.match_state !== 'retired');
    const hit = findTarget(findRows(all, q), q);
    if (!hit) return;
    $('#find').blur();   // キーボードを下げてから商品の画面を出す (iPad でダイアログの下半分が隠れないように)
    openRowDialog(hit.id);
  });
  $('#find-x').addEventListener('click', () => { $('#find').value = ''; if (S) render(); $('#find').focus(); });
  window.addEventListener('online', () => setOnline(true));
  window.addEventListener('offline', () => setOnline(false, 'net'));
  // 「結果を見る」から戻る操作で、押した直後 (ボタンが塞がったまま) の画面が保存から出てくることがある → 一覧を読み直す
  window.addEventListener('pageshow', (e) => { if (e.persisted && !curRunId) loadRuns(); });

  loadRuns();
  // 前回の作業者の復元は state 取得後 (refresh のラップ内) に行う — workers は state と一緒に来る
  const _origRefresh = refresh;
  refresh = async function (force) {
    await _origRefresh(force);
    if (!worker && S) {
      const savedId = LS.get('worker', null);
      const w = workers.find(x => x.id === savedId && x.active);
      if (w) { worker = w; render(); }
    }
  };

  // 画面 HTML と部品のフォールバック (Render の更新中に開いても真っ白にならない)。
  // 本社が別のアプリをマージしただけでも 1〜3 分 502 になるため (中原さん 2026-09-18)。
  // 登録できなくても動作に影響はない。初回表示は SW を通らないので、登録できたら今の画面を保存させる
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register(BASE + '/sw.js', { scope: BASE + '/' })
      .then(() => navigator.serviceWorker.ready)
      .then(reg => { if (reg.active) reg.active.postMessage('cache-shell'); })
      .catch(() => { /* 非対応・失敗は無視 */ });
  }
  </script>
</body>
</html>
